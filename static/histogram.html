        function clearTransientPlotTextState() {
            HISTOGRAM_PLOT_UI.titleText = '';
            HISTOGRAM_PLOT_UI.xLabelText = '';
            HISTOGRAM_PLOT_UI.yLabelText = '';
            saveHistogramPlotUiState();
        }

        function hasCustomPlotSize() {
            return HISTOGRAM_PLOT_UI.customSizeEnabled === true
                && Number.isFinite(EXPORT_WIDTH) && EXPORT_WIDTH > 0
                && Number.isFinite(EXPORT_HEIGHT) && EXPORT_HEIGHT > 0;
        }

        function syncPlotSizeControls() {
            const wInput = document.getElementById('plot-width-input');
            const hInput = document.getElementById('plot-height-input');
            if (wInput) wInput.value = String(hasCustomPlotSize() ? EXPORT_WIDTH : (HISTOGRAM_PLOT_UI.width || DEFAULT_EXPORT_WIDTH));
            if (hInput) hInput.value = String(hasCustomPlotSize() ? EXPORT_HEIGHT : (HISTOGRAM_PLOT_UI.height || DEFAULT_EXPORT_HEIGHT));
        }

        function readPlotSizeControls() {
            const width = parseInt(document.getElementById('plot-width-input')?.value || '', 10);
            const height = parseInt(document.getElementById('plot-height-input')?.value || '', 10);
            if (!Number.isFinite(width) || !Number.isFinite(height)) return null;
            if (width < 200 || height < 200) return null;
            return { width, height };
        }

        function getDefaultLivePlotSize() {
            const width = Number.isFinite(HISTOGRAM_PLOT_UI.width) && HISTOGRAM_PLOT_UI.width > 0
                ? HISTOGRAM_PLOT_UI.width
                : DEFAULT_EXPORT_WIDTH;
            const height = Number.isFinite(HISTOGRAM_PLOT_UI.height) && HISTOGRAM_PLOT_UI.height > 0
                ? HISTOGRAM_PLOT_UI.height
                : DEFAULT_EXPORT_HEIGHT;
            return { width, height };
        }

        function getTargetHistogramHeight(gd = document.getElementById('histogram-plot')) {
            if (hasCustomPlotSize()) return EXPORT_HEIGHT;
            const liveHeight = Number(gd?.clientHeight);
            if (Number.isFinite(liveHeight) && liveHeight > 0) return liveHeight;
            return getDefaultLivePlotSize().height;
        }

        function applyPlotHostSizing() {
            const gd = document.getElementById('histogram-plot');
            const host = document.getElementById('plot-host');
            if (!gd || !host) return;
            if (hasCustomPlotSize()) {
                gd.style.width = EXPORT_WIDTH + 'px';
                gd.style.height = EXPORT_HEIGHT + 'px';
                host.classList.add('has-custom-size');
            } else {
                const defaultSize = getDefaultLivePlotSize();
                gd.style.width = `min(100%, ${defaultSize.width}px)`;
                gd.style.height = `${defaultSize.height}px`;
                host.classList.remove('has-custom-size');
            }
        }

        function applyHistogramLayoutSizing(layout) {
            if (!layout || typeof layout !== 'object') return layout;
            if (hasCustomPlotSize()) {
                layout.width = EXPORT_WIDTH;
                layout.height = EXPORT_HEIGHT;
                layout.autosize = false;
            } else {
                delete layout.width;
                delete layout.height;
                layout.autosize = true;
            }
            return layout;
        }

        function getDefaultHistogramTexts(mode, xKey, yKey, orientation, histnorm) {
            if (mode === '1d') {
                if (orientation === 'h') {
                    return {
                        title: `${xKey}`,
                        x: histnorm || 'Count',
                        y: isDtFeature(xKey) ? 'Δt (ns)' : xKey,
                    };
                }
                return {
                    title: `${xKey}`,
                    x: isDtFeature(xKey) ? 'Δt (ns)' : xKey,
                    y: histnorm || 'Count',
                };
            }
            return {
                title: `${xKey} vs ${yKey}`,
                x: xKey,
                y: yKey,
            };
        }

        function getHistogramTextSettings(mode, xKey, yKey, orientation, histnorm) {
            const defaults = getDefaultHistogramTexts(mode, xKey, yKey, orientation, histnorm);
            return {
                title: (HISTOGRAM_PLOT_UI.titleText || '').trim() || defaults.title,
                x: (HISTOGRAM_PLOT_UI.xLabelText || '').trim() || defaults.x,
                y: (HISTOGRAM_PLOT_UI.yLabelText || '').trim() || defaults.y,
            };
        }

        function getHistogramTextStyleState(textKey) {
            if (textKey === 'titleText') {
                return {
                    bold: !!HISTOGRAM_PLOT_UI.titleBold,
                    italic: !!HISTOGRAM_PLOT_UI.titleItalic,
                    underline: !!HISTOGRAM_PLOT_UI.titleUnderline,
                    script: HISTOGRAM_PLOT_UI.titleScript || 'normal',
                    color: normalizeHistogramColor(HISTOGRAM_PLOT_UI.titleColor, ''),
                    highlight: normalizeHistogramHighlightColor(HISTOGRAM_PLOT_UI.titleHighlightColor, ''),
                };
            }
            if (textKey === 'xLabelText') {
                return {
                    bold: !!HISTOGRAM_PLOT_UI.xLabelBold,
                    italic: !!HISTOGRAM_PLOT_UI.xLabelItalic,
                    underline: !!HISTOGRAM_PLOT_UI.xLabelUnderline,
                    script: HISTOGRAM_PLOT_UI.xLabelScript || 'normal',
                    color: normalizeHistogramColor(HISTOGRAM_PLOT_UI.xLabelColor, ''),
                    highlight: normalizeHistogramHighlightColor(HISTOGRAM_PLOT_UI.xLabelHighlightColor, ''),
                };
            }
            if (textKey === 'yLabelText') {
                return {
                    bold: !!HISTOGRAM_PLOT_UI.yLabelBold,
                    italic: !!HISTOGRAM_PLOT_UI.yLabelItalic,
                    underline: !!HISTOGRAM_PLOT_UI.yLabelUnderline,
                    script: HISTOGRAM_PLOT_UI.yLabelScript || 'normal',
                    color: normalizeHistogramColor(HISTOGRAM_PLOT_UI.yLabelColor, ''),
                    highlight: normalizeHistogramHighlightColor(HISTOGRAM_PLOT_UI.yLabelHighlightColor, ''),
                };
            }
            return { bold: false, italic: false, underline: false, script: 'normal', color: '', highlight: '' };
        }

        function getGlobalHistogramTextStyleState() {
            const styles = [
                getHistogramTextStyleState('titleText'),
                getHistogramTextStyleState('xLabelText'),
                getHistogramTextStyleState('yLabelText'),
            ];
            const first = styles[0] || { color: '', highlight: '' };
            return {
                color: styles.every((style) => (style?.color || '') === (first.color || '')) ? (first.color || '') : '',
                highlight: styles.every((style) => (style?.highlight || '') === (first.highlight || '')) ? (first.highlight || '') : '',
            };
        }

        function setHistogramTextStyleState(textKey, updates = {}) {
            const nextScript = updates.script === 'super' || updates.script === 'sub' ? updates.script : 'normal';
            if (textKey === 'titleText') {
                if (Object.prototype.hasOwnProperty.call(updates, 'bold')) HISTOGRAM_PLOT_UI.titleBold = !!updates.bold;
                if (Object.prototype.hasOwnProperty.call(updates, 'italic')) HISTOGRAM_PLOT_UI.titleItalic = !!updates.italic;
                if (Object.prototype.hasOwnProperty.call(updates, 'underline')) HISTOGRAM_PLOT_UI.titleUnderline = !!updates.underline;
                if (Object.prototype.hasOwnProperty.call(updates, 'script')) HISTOGRAM_PLOT_UI.titleScript = nextScript;
                if (Object.prototype.hasOwnProperty.call(updates, 'color')) HISTOGRAM_PLOT_UI.titleColor = normalizeHistogramColor(updates.color, '');
                if (Object.prototype.hasOwnProperty.call(updates, 'highlight')) HISTOGRAM_PLOT_UI.titleHighlightColor = normalizeHistogramHighlightColor(updates.highlight, '');
                return;
            }
            if (textKey === 'xLabelText') {
                if (Object.prototype.hasOwnProperty.call(updates, 'bold')) HISTOGRAM_PLOT_UI.xLabelBold = !!updates.bold;
                if (Object.prototype.hasOwnProperty.call(updates, 'italic')) HISTOGRAM_PLOT_UI.xLabelItalic = !!updates.italic;
                if (Object.prototype.hasOwnProperty.call(updates, 'underline')) HISTOGRAM_PLOT_UI.xLabelUnderline = !!updates.underline;
                if (Object.prototype.hasOwnProperty.call(updates, 'script')) HISTOGRAM_PLOT_UI.xLabelScript = nextScript;
                if (Object.prototype.hasOwnProperty.call(updates, 'color')) HISTOGRAM_PLOT_UI.xLabelColor = normalizeHistogramColor(updates.color, '');
                if (Object.prototype.hasOwnProperty.call(updates, 'highlight')) HISTOGRAM_PLOT_UI.xLabelHighlightColor = normalizeHistogramHighlightColor(updates.highlight, '');
                return;
            }
            if (textKey === 'yLabelText') {
                if (Object.prototype.hasOwnProperty.call(updates, 'bold')) HISTOGRAM_PLOT_UI.yLabelBold = !!updates.bold;
                if (Object.prototype.hasOwnProperty.call(updates, 'italic')) HISTOGRAM_PLOT_UI.yLabelItalic = !!updates.italic;
                if (Object.prototype.hasOwnProperty.call(updates, 'underline')) HISTOGRAM_PLOT_UI.yLabelUnderline = !!updates.underline;
                if (Object.prototype.hasOwnProperty.call(updates, 'script')) HISTOGRAM_PLOT_UI.yLabelScript = nextScript;
                if (Object.prototype.hasOwnProperty.call(updates, 'color')) HISTOGRAM_PLOT_UI.yLabelColor = normalizeHistogramColor(updates.color, '');
                if (Object.prototype.hasOwnProperty.call(updates, 'highlight')) HISTOGRAM_PLOT_UI.yLabelHighlightColor = normalizeHistogramHighlightColor(updates.highlight, '');
            }
        }

        function applyHistogramTextStyleMarkup(text, textKey) {
            let formatted = convertHistogramTextMarkupForPlot(String(text || ''));
            const styleState = getHistogramTextStyleState(textKey);
            if (styleState.underline) formatted = `<u>${formatted}</u>`;
            if (styleState.italic) formatted = `<i>${formatted}</i>`;
            if (styleState.bold) formatted = `<b>${formatted}</b>`;
            if (styleState.script === 'super') formatted = `<sup>${formatted}</sup>`;
            if (styleState.script === 'sub') formatted = `<sub>${formatted}</sub>`;
            const inlineStyle = buildHistogramPlotInlineStyle(styleState.color, styleState.highlight);
            if (inlineStyle) formatted = `<span style="${escapeHistogramHtmlAttribute(inlineStyle)}">${formatted}</span>`;
            return formatted;
        }

        function stripHistogramTextStyleMarkup(value) {
            if (typeof value !== 'string') return value;
            return value
                .replace(/<\/?(b|i|u|sup|sub)>/gi, '')
                .replace(/<br\s*\/?>/gi, ' ')
                .replace(/<[^>]+>/g, '')
                .trim();
        }

        function escapeHistogramTextHtml(value) {
            return String(value || '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function sanitizeHistogramTextMarkup(value) {
            if (typeof value !== 'string' || !value) return '';
            const template = document.createElement('template');
            template.innerHTML = value;
            const visit = (node) => {
                if (node.nodeType === Node.TEXT_NODE) {
                    return escapeHistogramTextHtml((node.textContent || '').replace(/\u00a0/g, ' '));
                }
                if (node.nodeType !== Node.ELEMENT_NODE) return '';
                const tagName = String(node.nodeName || '').toLowerCase();
                if (tagName === 'br') return ' ';
                const children = Array.from(node.childNodes || []).map(visit).join('');
                if (tagName === 'span') {
                    const safeStyle = sanitizeHistogramInlineStyle(node.getAttribute('style') || '');
                    if (!safeStyle) return children;
                    return `<span style="${escapeHistogramHtmlAttribute(safeStyle)}">${children}</span>`;
                }
                if (!ALLOWED_HISTOGRAM_TEXT_TAGS.has(tagName)) return children;
                return `<${tagName}>${children}</${tagName}>`;
            };
            return Array.from(template.content.childNodes).map(visit).join('').trim();
        }

        function convertHistogramTextMarkupForPlot(value) {
            if (typeof value !== 'string' || !value) return '';
            const template = document.createElement('template');
            template.innerHTML = sanitizeHistogramTextMarkup(value);
            const visit = (node) => {
                if (node.nodeType === Node.TEXT_NODE) {
                    return escapeHistogramTextHtml((node.textContent || '').replace(/\u00a0/g, ' '));
                }
                if (node.nodeType !== Node.ELEMENT_NODE) return '';
                const tagName = String(node.nodeName || '').toLowerCase();
                if (tagName === 'br') return ' ';
                const children = Array.from(node.childNodes || []).map(visit).join('');
                if (tagName === 'span') {
                    const safeStyle = sanitizeHistogramInlineStyle(node.getAttribute('style') || '');
                    if (!safeStyle) return children;
                    const probe = document.createElement('span');
                    probe.style.cssText = safeStyle;
                    const plotStyle = buildHistogramPlotInlineStyle(
                        probe.style.color,
                        probe.style.backgroundColor,
                        probe.style.fontFamily,
                        probe.style.fontSize
                    );
                    if (!plotStyle) return children;
                    return `<span style="${escapeHistogramHtmlAttribute(plotStyle)}">${children}</span>`;
                }
                if (!ALLOWED_HISTOGRAM_TEXT_TAGS.has(tagName)) return children;
                return `<${tagName}>${children}</${tagName}>`;
            };
            return Array.from(template.content.childNodes).map(visit).join('').trim();
        }

        function getHistogramEditorHtml(textKey, fallbackText = '') {
            if (isHistogramDrawAnnotationTextKey(textKey)) {
                const annotation = getHistogramDrawAnnotationByKey(textKey);
                if (annotation?.text) return sanitizeHistogramTextMarkup(annotation.text);
                return escapeHistogramTextHtml(fallbackText);
            }
            const storedValue = HISTOGRAM_PLOT_UI[textKey];
            if (typeof storedValue === 'string' && storedValue) return sanitizeHistogramTextMarkup(storedValue);
            return escapeHistogramTextHtml(fallbackText);
        }

        function getCurrentHistogramTextSettings() {
            return getHistogramTextSettings(
                document.querySelector('input[name="hist-type"]:checked')?.value || '1d',
                document.getElementById('axis-x')?.value || 'X',
                document.getElementById('axis-y')?.value || 'Y',
                document.getElementById('orientation')?.value || 'v',
                document.getElementById('histnorm')?.value || ''
            );
        }

        function insertSymbolIntoEditablePlotText(editor, symbol) {
            if (!editor || !symbol) return false;
            editor.focus();
            const activeSelection = getEditablePlotTextSelection(editor);
            let range = activeSelection?.range || null;
            if (!range) {
                range = document.createRange();
                range.selectNodeContents(editor);
                range.collapse(false);
                const selection = window.getSelection();
                if (selection) {
                    selection.removeAllRanges();
                    selection.addRange(range);
                }
            }
            range.deleteContents();
            const textNode = document.createTextNode(symbol);
            range.insertNode(textNode);
            range.setStartAfter(textNode);
            range.collapse(true);
            const selection = window.getSelection();
            if (selection) {
                selection.removeAllRanges();
                selection.addRange(range);
            }
            editor.normalize();
            return true;
        }

        async function insertHistogramSymbol(symbol) {
            if (!symbol) return;
            const gd = document.getElementById('histogram-plot');
            const selectedTextKey = getActiveEditablePlotTextKey(gd);
            if (!selectedTextKey) return;
            const activeEditor = gd?.__plotTextEditor;
            const editor = activeEditor?.key === selectedTextKey ? activeEditor.editor : null;
            if (editor && gd?.__plotTextSavedSelectionRange) {
                restoreEditablePlotTextSelectionRange(editor, gd.__plotTextSavedSelectionRange);
            }
            if (editor && insertSymbolIntoEditablePlotText(editor, symbol)) {
                HISTOGRAM_PLOT_UI[selectedTextKey] = sanitizeHistogramTextMarkup(editor.innerHTML);
                gd.__plotTextSavedSelectionRange = cloneEditablePlotTextSelectionRange(editor);
                saveHistogramPlotUiState();
                scheduleHistogramHistoryCommit();
                syncPlotSettingsForm(
                    document.querySelector('input[name="hist-type"]:checked')?.value || '1d',
                    document.getElementById('axis-x')?.value || 'X',
                    document.getElementById('axis-y')?.value || 'Y',
                    document.getElementById('orientation')?.value || 'v',
                    document.getElementById('histnorm')?.value || ''
                );
                await relayoutHistogramAppearance();
                const refreshedMatch = findEditablePlotTextByKey(gd, selectedTextKey);
                if (refreshedMatch) positionEditablePlotTextEditor(gd, editor, refreshedMatch);
                return;
            }
            const texts = getCurrentHistogramTextSettings();
            const fallbackText = selectedTextKey === 'titleText'
                ? texts.title
                : selectedTextKey === 'xLabelText'
                    ? texts.x
                    : texts.y;
            HISTOGRAM_PLOT_UI[selectedTextKey] = sanitizeHistogramTextMarkup(
                `${getHistogramEditorHtml(selectedTextKey, fallbackText)}${escapeHistogramTextHtml(symbol)}`
            );
            saveHistogramPlotUiState();
            scheduleHistogramHistoryCommit();
            syncPlotSettingsForm(
                document.querySelector('input[name="hist-type"]:checked')?.value || '1d',
                document.getElementById('axis-x')?.value || 'X',
                document.getElementById('axis-y')?.value || 'Y',
                document.getElementById('orientation')?.value || 'v',
                document.getElementById('histnorm')?.value || ''
            );
            await relayoutHistogramAppearance();
        }

        function getHistogramAxisTitleStandoff(fontSize) {
            const numericSize = Math.max(8, Number(fontSize) || DEFAULT_AXIS_FONT_SIZE);
            return Math.max(26, Math.round(numericSize * 1.2));
        }

        function getGlobalHistogramFontSettings() {
            return {
                family: normalizeHistogramFontFamily(HISTOGRAM_PLOT_UI.titleFontFamily, DEFAULT_FONT_FAMILY),
                size: HISTOGRAM_PLOT_UI.titleFontSize || DEFAULT_TITLE_FONT_SIZE,
            };
        }

        function setAllHistogramFontSettings(fontFamily, fontSize) {
            const normalizedFontFamily = normalizeHistogramFontFamily(fontFamily, DEFAULT_FONT_FAMILY);
            const normalizedFontSize = Math.max(8, parseInt(String(fontSize), 10) || DEFAULT_TITLE_FONT_SIZE);
            HISTOGRAM_PLOT_UI.titleFontFamily = normalizedFontFamily;
            HISTOGRAM_PLOT_UI.axisFontFamily = normalizedFontFamily;
            HISTOGRAM_PLOT_UI.xLabelFontFamily = normalizedFontFamily;
            HISTOGRAM_PLOT_UI.yLabelFontFamily = normalizedFontFamily;
            HISTOGRAM_PLOT_UI.titleFontSize = normalizedFontSize;
            HISTOGRAM_PLOT_UI.axisFontSize = normalizedFontSize;
            HISTOGRAM_PLOT_UI.xLabelFontSize = normalizedFontSize;
            HISTOGRAM_PLOT_UI.yLabelFontSize = normalizedFontSize;
        }

        function getEditorPlainText(editor) {
            return String(editor?.textContent || '').replace(/\u00a0/g, ' ').trim();
        }

        function selectAllEditablePlotText(editor) {
            if (!editor) return;
            const selection = window.getSelection();
            if (!selection) return;
            const range = document.createRange();
            range.selectNodeContents(editor);
            selection.removeAllRanges();
            selection.addRange(range);
        }

        function getEditablePlotTextSelection(editor) {
            if (!editor) return null;
            const selection = window.getSelection();
            if (!selection || selection.rangeCount === 0) return null;
            const range = selection.getRangeAt(0);
            if (!editor.contains(range.commonAncestorContainer)) return null;
            return { selection, range };
        }

        function cloneEditablePlotTextSelectionRange(editor) {
            const activeSelection = getEditablePlotTextSelection(editor);
            if (!activeSelection) return null;
            const hasSelectedText = !activeSelection.range.collapsed && String(activeSelection.selection.toString() || '').length > 0;
            if (!hasSelectedText) return null;
            return activeSelection.range.cloneRange();
        }

        function restoreEditablePlotTextSelectionRange(editor, savedRange) {
            if (!editor || !savedRange) return false;
            if (!savedRange.commonAncestorContainer || !editor.contains(savedRange.commonAncestorContainer)) return false;
            const selection = window.getSelection();
            if (!selection) return false;
            selection.removeAllRanges();
            selection.addRange(savedRange);
            return true;
        }

        function captureActiveEditablePlotTextSelection(gd = document.getElementById('histogram-plot')) {
            const editor = gd?.__plotTextEditor?.editor;
            gd.__plotTextSavedSelectionRange = editor ? cloneEditablePlotTextSelectionRange(editor) : null;
        }

        function isHistogramTextToolInteractionTarget(target) {
            if (!(target instanceof Element)) return false;
            return !!(
                target.closest('#export-group-fonts')
                || target.closest('.pcr-app')
                || target.closest('.sciplotter-color-picker-btn')
            );
        }

        function isEditablePlotTextPartialSelection(editor) {
            const activeSelection = getEditablePlotTextSelection(editor);
            if (!activeSelection) return false;
            const selectedText = String(activeSelection.selection.toString() || '').replace(/\u00a0/g, ' ').trim();
            if (!selectedText) return false;
            const editorText = getEditorPlainText(editor);
            return !!editorText && selectedText !== editorText;
        }

        function stripHistogramMarkupTags(value, tagNames = []) {
            if (typeof value !== 'string' || !tagNames.length) return value;
            const escapedTags = tagNames.map((tagName) => String(tagName || '').trim()).filter(Boolean).join('|');
            if (!escapedTags) return value;
            return value.replace(new RegExp(`</?(${escapedTags})>`, 'gi'), '');
        }

        function unwrapSingleHistogramTag(value, tagName) {
            const template = document.createElement('template');
            template.innerHTML = sanitizeHistogramTextMarkup(value);
            const children = Array.from(template.content.childNodes || []).filter((node) => {
                return !(node.nodeType === Node.TEXT_NODE && !(node.textContent || '').trim());
            });
            if (children.length !== 1) return { unwrapped: false, html: sanitizeHistogramTextMarkup(value) };
            const onlyChild = children[0];
            if (onlyChild.nodeType !== Node.ELEMENT_NODE) return { unwrapped: false, html: sanitizeHistogramTextMarkup(value) };
            if (String(onlyChild.nodeName || '').toLowerCase() !== tagName) return { unwrapped: false, html: sanitizeHistogramTextMarkup(value) };
            return { unwrapped: true, html: sanitizeHistogramTextMarkup(onlyChild.innerHTML || '') };
        }

        function isHistogramSelectionFullyTagged(value, tagName) {
            if (typeof value !== 'string' || !value || !tagName) return false;
            const template = document.createElement('template');
            template.innerHTML = sanitizeHistogramTextMarkup(value);
            let sawText = false;
            let fullyTagged = true;
            const visit = (node, insideTargetTag) => {
                if (!fullyTagged) return;
                if (node.nodeType === Node.TEXT_NODE) {
                    if (String(node.textContent || '').trim()) {
                        sawText = true;
                        if (!insideTargetTag) fullyTagged = false;
                    }
                    return;
                }
                if (node.nodeType !== Node.ELEMENT_NODE) return;
                const nextInsideTargetTag = insideTargetTag || String(node.nodeName || '').toLowerCase() === tagName;
                Array.from(node.childNodes || []).forEach((childNode) => visit(childNode, nextInsideTargetTag));
            };
            Array.from(template.content.childNodes || []).forEach((childNode) => visit(childNode, false));
            return sawText && fullyTagged;
        }

        function buildHistogramFragmentFromHtml(html, wrapperTagName = null) {
            const fragment = document.createDocumentFragment();
            const template = document.createElement('template');
            template.innerHTML = sanitizeHistogramTextMarkup(html);
            if (wrapperTagName) {
                const wrapper = document.createElement(wrapperTagName);
                wrapper.appendChild(template.content.cloneNode(true));
                fragment.appendChild(wrapper);
                return fragment;
            }
            fragment.appendChild(template.content.cloneNode(true));
            return fragment;
        }

        function stripHistogramInlineStyleProperty(html, styleKey) {
            if (typeof html !== 'string' || !html) return '';
            const template = document.createElement('template');
            template.innerHTML = sanitizeHistogramTextMarkup(html);
            const visit = (node) => {
                if (node.nodeType === Node.TEXT_NODE) {
                    return escapeHistogramTextHtml((node.textContent || '').replace(/\u00a0/g, ' '));
                }
                if (node.nodeType !== Node.ELEMENT_NODE) return '';
                const tagName = String(node.nodeName || '').toLowerCase();
                if (tagName === 'br') return ' ';
                const children = Array.from(node.childNodes || []).map(visit).join('');
                if (tagName === 'span') {
                    const probe = document.createElement('span');
                    probe.setAttribute('style', sanitizeHistogramInlineStyle(node.getAttribute('style') || ''));
                    if (styleKey === 'color') probe.style.color = '';
                    if (styleKey === 'highlight') probe.style.backgroundColor = '';
                    if (styleKey === 'fontFamily') probe.style.fontFamily = '';
                    if (styleKey === 'fontSize') probe.style.fontSize = '';
                    const nextStyle = buildHistogramInlineStyle(probe.style.color, probe.style.backgroundColor, probe.style.fontFamily, probe.style.fontSize);
                    if (!nextStyle) return children;
                    return `<span style="${escapeHistogramHtmlAttribute(nextStyle)}">${children}</span>`;
                }
                if (!ALLOWED_HISTOGRAM_TEXT_TAGS.has(tagName)) return children;
                return `<${tagName}>${children}</${tagName}>`;
            };
            return Array.from(template.content.childNodes).map(visit).join('').trim();
        }

        function applyEditorSelectionInlineStyle(editor, styleKey, value) {
            if (!editor || !['color', 'highlight', 'fontFamily', 'fontSize'].includes(styleKey)) return false;
            const activeSelection = getEditablePlotTextSelection(editor);
            if (!activeSelection) return false;
            const hasSelectedText = !activeSelection.range.collapsed && String(activeSelection.selection.toString() || '').length > 0;
            if (!hasSelectedText) return false;
            const normalizedValue = styleKey === 'color'
                ? normalizeHistogramColor(value, '')
                : styleKey === 'highlight'
                    ? normalizeHistogramHighlightColor(value, '')
                    : styleKey === 'fontFamily'
                        ? normalizeHistogramFontFamily(value, '')
                        : normalizeHistogramFontSize(value, '');
            const { selection, range } = activeSelection;
            const extracted = range.extractContents();
            const holder = document.createElement('div');
            holder.appendChild(extracted);
            let selectionHtml = sanitizeHistogramTextMarkup(holder.innerHTML);
            if (!selectionHtml) return false;
            selectionHtml = stripHistogramInlineStyleProperty(selectionHtml, styleKey);
            const wrapperStyle = styleKey === 'color'
                ? buildHistogramInlineStyle(normalizedValue, '', '', '')
                : styleKey === 'highlight'
                    ? buildHistogramInlineStyle('', normalizedValue, '', '')
                    : styleKey === 'fontFamily'
                        ? buildHistogramInlineStyle('', '', normalizedValue, '')
                        : buildHistogramInlineStyle('', '', '', normalizedValue);
            const wrappedHtml = wrapperStyle
                ? `<span style="${escapeHistogramHtmlAttribute(wrapperStyle)}">${selectionHtml}</span>`
                : selectionHtml;
            const insertionFragment = buildHistogramFragmentFromHtml(wrappedHtml);
            const insertedNodes = Array.from(insertionFragment.childNodes);
            range.insertNode(insertionFragment);
            if (insertedNodes.length) {
                const nextRange = document.createRange();
                nextRange.setStartBefore(insertedNodes[0]);
                nextRange.setEndAfter(insertedNodes[insertedNodes.length - 1]);
                selection.removeAllRanges();
                selection.addRange(nextRange);
            }
            editor.normalize();
            return true;
        }

        function getHistogramSelectionAnchorNode(editor) {
            const activeSelection = getEditablePlotTextSelection(editor);
            if (!activeSelection) return null;
            const { range } = activeSelection;
            let node = range.startContainer;
            if (node?.nodeType === Node.TEXT_NODE) return node;
            if (node?.nodeType === Node.ELEMENT_NODE) {
                const childNode = node.childNodes[range.startOffset]
                    || node.childNodes[Math.max(0, range.startOffset - 1)]
                    || node;
                if (childNode?.nodeType === Node.TEXT_NODE) return childNode;
                if (childNode?.firstChild?.nodeType === Node.TEXT_NODE) return childNode.firstChild;
                return childNode;
            }
            return null;
        }

        function getHistogramSelectionInlineState(editor, textKey) {
            const activeSelection = getEditablePlotTextSelection(editor);
            if (!activeSelection || activeSelection.range.collapsed || !String(activeSelection.selection.toString() || '').length) return null;
            const baseFont = getHistogramFontSettings(textKey);
            const baseStyle = getHistogramTextStyleState(textKey);
            const anchorNode = getHistogramSelectionAnchorNode(editor);
            const state = {
                bold: !!baseStyle.bold,
                italic: !!baseStyle.italic,
                underline: !!baseStyle.underline,
                script: baseStyle.script || 'normal',
                color: baseStyle.color || '',
                highlight: baseStyle.highlight || '',
                fontFamily: baseFont.family,
                fontSize: baseFont.size,
            };
            let current = anchorNode?.nodeType === Node.ELEMENT_NODE ? anchorNode : anchorNode?.parentElement;
            while (current && current !== editor) {
                const tagName = String(current.nodeName || '').toLowerCase();
                if (tagName === 'b' || tagName === 'strong') state.bold = true;
                if (tagName === 'i' || tagName === 'em') state.italic = true;
                if (tagName === 'u') state.underline = true;
                if (tagName === 'sup') state.script = 'super';
                if (tagName === 'sub') state.script = 'sub';
                if (tagName === 'span') {
                    const safeStyle = sanitizeHistogramInlineStyle(current.getAttribute('style') || '');
                    if (safeStyle) {
                        const probe = document.createElement('span');
                        probe.style.cssText = safeStyle;
                        if (probe.style.color) state.color = probe.style.color;
                        if (probe.style.backgroundColor) state.highlight = probe.style.backgroundColor;
                    }
                }
                current = current.parentElement;
            }
            return state;
        }

        function getHistogramToolbarState(gd, selectedTextKey) {
            const activeEditor = gd?.__plotTextEditor;
            if (activeEditor?.editor && activeEditor.key === selectedTextKey && isEditablePlotTextPartialSelection(activeEditor.editor)) {
                const selectionState = getHistogramSelectionInlineState(activeEditor.editor, selectedTextKey);
                if (selectionState) {
                    return {
                        font: {
                            family: getHistogramFontSettings(selectedTextKey).family,
                            size: getHistogramFontSettings(selectedTextKey).size,
                        },
                        style: selectionState,
                    };
                }
            }
            return {
                font: selectedTextKey ? getHistogramFontSettings(selectedTextKey) : getGlobalHistogramFontSettings(),
                style: selectedTextKey ? getHistogramTextStyleState(selectedTextKey) : getGlobalHistogramTextStyleState(),
            };
        }

        function clearHistogramInlineFontStyles(textKeys = []) {
            textKeys.forEach((textKey) => {
                const currentHtml = typeof HISTOGRAM_PLOT_UI[textKey] === 'string' ? HISTOGRAM_PLOT_UI[textKey] : '';
                if (!currentHtml) return;
                let nextHtml = sanitizeHistogramTextMarkup(currentHtml);
                nextHtml = stripHistogramInlineStyleProperty(nextHtml, 'fontFamily');
                nextHtml = stripHistogramInlineStyleProperty(nextHtml, 'fontSize');
                HISTOGRAM_PLOT_UI[textKey] = nextHtml;
            });
        }

        function applyEditorSelectionTag(editor, tagName, options = {}) {
            if (!editor || !tagName) return false;
            const activeSelection = getEditablePlotTextSelection(editor);
            if (!activeSelection) return false;
            const hasSelectedText = !activeSelection.range.collapsed && String(activeSelection.selection.toString() || '').length > 0;
            if (!hasSelectedText) return false;
            const { selection, range } = activeSelection;
            const extracted = range.extractContents();
            const holder = document.createElement('div');
            holder.appendChild(extracted);
            let selectionHtml = sanitizeHistogramTextMarkup(holder.innerHTML);
            if (!selectionHtml) return false;
            if (Array.isArray(options.clearTags) && options.clearTags.length) {
                selectionHtml = stripHistogramMarkupTags(selectionHtml, options.clearTags);
            }
            const shouldRemoveTag = isHistogramSelectionFullyTagged(selectionHtml, tagName);
            const normalizedSelectionHtml = stripHistogramMarkupTags(selectionHtml, [tagName]);
            const unwrapState = unwrapSingleHistogramTag(normalizedSelectionHtml, tagName);
            const finalSelectionHtml = unwrapState.unwrapped ? unwrapState.html : normalizedSelectionHtml;
            const insertionFragment = shouldRemoveTag
                ? buildHistogramFragmentFromHtml(finalSelectionHtml)
                : buildHistogramFragmentFromHtml(finalSelectionHtml, tagName);
            const insertedNodes = Array.from(insertionFragment.childNodes);
            range.insertNode(insertionFragment);
            if (insertedNodes.length) {
                const nextRange = document.createRange();
                nextRange.setStartBefore(insertedNodes[0]);
                nextRange.setEndAfter(insertedNodes[insertedNodes.length - 1]);
                selection.removeAllRanges();
                selection.addRange(nextRange);
            }
            editor.normalize();
            return true;
        }

        function getActiveEditablePlotTextKey(gd = document.getElementById('histogram-plot')) {
            return gd?.__plotTextSelectionKey || gd?.__plotTextEditor?.key || null;
        }

        function getHistogramFontSettings(textKey) {
            if (textKey === 'titleText') {
                return {
                    family: normalizeHistogramFontFamily(HISTOGRAM_PLOT_UI.titleFontFamily, DEFAULT_FONT_FAMILY),
                    size: HISTOGRAM_PLOT_UI.titleFontSize || DEFAULT_TITLE_FONT_SIZE,
                };
            }
            if (textKey === 'xLabelText') {
                return {
                    family: normalizeHistogramFontFamily(HISTOGRAM_PLOT_UI.xLabelFontFamily, normalizeHistogramFontFamily(HISTOGRAM_PLOT_UI.axisFontFamily, DEFAULT_FONT_FAMILY)),
                    size: HISTOGRAM_PLOT_UI.xLabelFontSize || HISTOGRAM_PLOT_UI.axisFontSize || DEFAULT_AXIS_FONT_SIZE,
                };
            }
            if (textKey === 'yLabelText') {
                return {
                    family: normalizeHistogramFontFamily(HISTOGRAM_PLOT_UI.yLabelFontFamily, normalizeHistogramFontFamily(HISTOGRAM_PLOT_UI.axisFontFamily, DEFAULT_FONT_FAMILY)),
                    size: HISTOGRAM_PLOT_UI.yLabelFontSize || HISTOGRAM_PLOT_UI.axisFontSize || DEFAULT_AXIS_FONT_SIZE,
                };
            }
            return {
                family: normalizeHistogramFontFamily(HISTOGRAM_PLOT_UI.titleFontFamily, DEFAULT_FONT_FAMILY),
                size: HISTOGRAM_PLOT_UI.titleFontSize || DEFAULT_TITLE_FONT_SIZE,
            };
        }

        function setHistogramFontSettings(textKey, fontFamily, fontSize) {
            const normalizedFontFamily = normalizeHistogramFontFamily(fontFamily, DEFAULT_FONT_FAMILY);
            const normalizedFontSize = Math.max(8, parseInt(String(fontSize), 10) || DEFAULT_TITLE_FONT_SIZE);
            if (textKey === 'titleText') {
                HISTOGRAM_PLOT_UI.titleFontFamily = normalizedFontFamily;
                HISTOGRAM_PLOT_UI.titleFontSize = normalizedFontSize;
                return;
            }
            if (textKey === 'xLabelText') {
                HISTOGRAM_PLOT_UI.xLabelFontFamily = normalizedFontFamily;
                HISTOGRAM_PLOT_UI.xLabelFontSize = normalizedFontSize;
                return;
            }
            if (textKey === 'yLabelText') {
                HISTOGRAM_PLOT_UI.yLabelFontFamily = normalizedFontFamily;
                HISTOGRAM_PLOT_UI.yLabelFontSize = normalizedFontSize;
            }
        }

        function getPlotFontOptionsCatalog(selectEl = document.getElementById('plot-font-family-input')) {
            if (!selectEl) return [];
            if (!Array.isArray(selectEl.__fontOptionsCatalog)) {
                const options = Array.from(selectEl.querySelectorAll('option'))
                    .map((option) => ({
                        value: normalizeHistogramFontFamily(option.value, DEFAULT_FONT_FAMILY),
                        label: String(option.textContent || '').trim(),
                    }))
                    .filter((option) => option.value && option.label)
                    .filter((option, index, optionsList) => optionsList.findIndex((entry) => entry.value === option.value) === index)
                    .sort((left, right) => left.label.localeCompare(right.label, undefined, { sensitivity: 'base' }));
                selectEl.__fontOptionsCatalog = options;
            }
            return selectEl.__fontOptionsCatalog;
        }

        function trackRecentHistogramFontFamily(fontFamily) {
            const normalizedFontFamily = normalizeHistogramFontFamily(fontFamily, '');
            if (!normalizedFontFamily) return;
            const current = Array.isArray(HISTOGRAM_PLOT_UI.recentFontFamilies) ? HISTOGRAM_PLOT_UI.recentFontFamilies : [];
            HISTOGRAM_PLOT_UI.recentFontFamilies = [normalizedFontFamily]
                .concat(current.filter((value) => value !== normalizedFontFamily))
                .slice(0, HISTOGRAM_RECENT_FONT_LIMIT);
        }

        function trackRecentHistogramColor(value) {
            const normalizedColor = normalizeHistogramPickerColor(value, '');
            if (!normalizedColor) return;
            const current = Array.isArray(HISTOGRAM_PLOT_UI.recentColors) ? HISTOGRAM_PLOT_UI.recentColors : [];
            HISTOGRAM_PLOT_UI.recentColors = [normalizedColor]
                .concat(current.filter((entry) => entry !== normalizedColor))
                .slice(0, HISTOGRAM_RECENT_COLOR_LIMIT);
            saveHistogramPlotUiState();
        }

        function createPlotFontOption(option) {
            const optionEl = document.createElement('option');
            optionEl.value = option.value;
            optionEl.textContent = option.label;
            optionEl.style.fontFamily = option.value;
            return optionEl;
        }

        function renderPlotFontFamilyOptions(selectedFontFamily = null) {
            const selectEl = document.getElementById('plot-font-family-input');
            if (!selectEl) return;
            const catalog = getPlotFontOptionsCatalog(selectEl);
            const selectedValue = normalizeHistogramFontFamily(selectedFontFamily || selectEl.value, DEFAULT_FONT_FAMILY);
            const catalogByValue = new Map(catalog.map((option) => [option.value, option]));
            const recentOptions = (Array.isArray(HISTOGRAM_PLOT_UI.recentFontFamilies) ? HISTOGRAM_PLOT_UI.recentFontFamilies : [])
                .map((value) => catalogByValue.get(normalizeHistogramFontFamily(value, '')))
                .filter((option, index, options) => !!option && options.indexOf(option) === index)
                .slice(0, HISTOGRAM_RECENT_FONT_LIMIT);
            const alphabetizedOptions = catalog;

            selectEl.innerHTML = '';

            recentOptions.forEach((option) => {
                selectEl.appendChild(createPlotFontOption(option));
            });

            if (recentOptions.length && alphabetizedOptions.length) {
                const dividerOption = document.createElement('option');
                dividerOption.disabled = true;
                dividerOption.value = '';
                dividerOption.textContent = '──────────';
                selectEl.appendChild(dividerOption);
            }

            alphabetizedOptions.forEach((option) => {
                selectEl.appendChild(createPlotFontOption(option));
            });

            if (catalogByValue.has(selectedValue)) selectEl.value = selectedValue;
            selectEl.style.fontFamily = catalogByValue.has(selectedValue) ? selectedValue : DEFAULT_FONT_FAMILY;
        }

        class SciPlotterColorPicker {
            constructor(options = {}) {
                this.element = document.getElementById(options.elementId || '');
                this.pickerKey = String(options.pickerKey || '');
                this.normalizeValue = typeof options.normalizeValue === 'function' ? options.normalizeValue : ((value, fallback = '') => value || fallback);
                this.fallbackDisplayColor = options.fallbackDisplayColor || DEFAULT_HISTOGRAM_TEXT_COLOR;
                this.value = this.normalizeValue(options.defaultValue || '', '');
                this.swatches = Array.isArray(options.swatches) ? options.swatches.slice() : HISTOGRAM_COLOR_SWATCHES.slice();
                this.allowClear = options.allowClear === true;
                this.onCommit = typeof options.onCommit === 'function' ? options.onCommit : null;
                this.pickr = null;
                this.recentSection = null;
                this.recentSwatchesEl = null;
            }

            init() {
                if (!this.element || this.pickr || !window.Pickr) return;
                this.element.addEventListener('pointerdown', () => {
                    captureActiveEditablePlotTextSelection();
                });
                this.pickr = window.Pickr.create({
                    el: this.element,
                    useAsButton: true,
                    theme: 'nano',
                    default: this.value || this.fallbackDisplayColor,
                    swatches: this.swatches,
                    comparison: false,
                    components: {
                        preview: true,
                        opacity: true,
                        hue: true,
                        interaction: {
                            input: true,
                            save: true,
                            clear: this.allowClear,
                            cancel: false,
                        },
                    },
                });
                this.pickr.on('init', (instance) => {
                    this.ensureSupplementalSwatchSections(instance);
                    this.renderRecentColors(instance);
                    this.syncOpacityTrack(instance);
                    this.syncActiveSwatchState(instance);
                });
                this.pickr.on('show', () => {
                    this.ensureSupplementalSwatchSections(this.pickr);
                    this.renderRecentColors(this.pickr);
                    this.syncOpacityTrack(this.pickr);
                    if (this.value) this.pickr.setColor(this.value, true);
                    else this.pickr.setColor(this.fallbackDisplayColor, true);
                    this.syncActiveSwatchState(this.pickr);
                });
                this.pickr.on('change', (_color, _source, instance) => {
                    this.syncOpacityTrack(instance);
                    this.syncActiveSwatchState(instance);
                });
                this.pickr.on('save', (color, instance) => {
                    const nextValue = color ? color.toHEXA().toString() : '';
                    this.commitPickerColor(nextValue, instance);
                });
                this.pickr.on('clear', (instance) => {
                    this.commit('');
                    this.renderRecentColors(instance);
                    instance.hide();
                });
                this.updateSwatch();
            }

            ensureSupplementalSwatchSections(instance = this.pickr) {
                const app = instance?.getRoot?.()?.app;
                const swatches = instance?.getRoot?.()?.swatches;
                const interaction = app?.querySelector?.('.pcr-interaction');
                if (!app || !swatches || !interaction) return;
                app.dataset.sciplotterPickerKey = this.pickerKey;
                app.dataset.sciplotterAllowClear = this.allowClear ? 'true' : 'false';
                this.bindPickerDismissal(instance);
                const opacityWrapper = instance?.getRoot?.()?.opacity;
                if (opacityWrapper?.slider) {
                    opacityWrapper.slider.setAttribute('aria-label', 'Opacity slider');
                }
                if (opacityWrapper?.slider?.parentElement) {
                    opacityWrapper.slider.parentElement.setAttribute('data-sciplotter-label', 'Opacity');
                }
                if (swatches.dataset.sciplotterCommitBound !== 'true') {
                    swatches.dataset.sciplotterCommitBound = 'true';
                    swatches.addEventListener('click', (event) => {
                        const target = event.target;
                        const swatchButton = target instanceof Element ? target.closest('button') : null;
                        if (!swatchButton || !swatches.contains(swatchButton)) return;
                        const swatchButtons = Array.from(swatches.children);
                        const swatchIndex = swatchButtons.indexOf(swatchButton);
                        const swatchValue = this.normalizeValue(this.swatches[swatchIndex] || '', '');
                        if (!swatchValue) return;
                        window.setTimeout(() => {
                            instance?.setColor(swatchValue, true);
                            this.commitPickerColor(swatchValue, instance);
                        }, 0);
                    });
                }
                if (!app.querySelector('.sciplotter-color-picker-close')) {
                    const closeButton = document.createElement('button');
                    closeButton.type = 'button';
                    closeButton.className = 'sciplotter-color-picker-close';
                    closeButton.setAttribute('aria-label', 'Close color picker');
                    closeButton.addEventListener('click', () => {
                        if (this.value) instance?.setColor(this.value, true);
                        else instance?.setColor(this.fallbackDisplayColor, true);
                        instance?.hide();
                    });
                    app.insertBefore(closeButton, app.firstChild);
                }
                const saveButton = interaction.querySelector('.pcr-save');
                if (saveButton) {
                    saveButton.classList.add('btn-secondary');
                    saveButton.textContent = 'Save';
                }
                const clearButton = interaction.querySelector('.pcr-clear');
                if (clearButton) {
                    clearButton.textContent = 'Clear';
                }
                if (!swatches.previousElementSibling || !swatches.previousElementSibling.classList.contains('sciplotter-color-picker-section-label')) {
                    const presetLabel = document.createElement('div');
                    presetLabel.className = 'sciplotter-color-picker-section-label';
                    presetLabel.textContent = 'Presets';
                    app.insertBefore(presetLabel, swatches);
                }
                if (!this.recentSection || !this.recentSection.isConnected) {
                    const section = document.createElement('div');
                    section.className = 'sciplotter-color-picker-recent-section';
                    section.innerHTML = '<div class="sciplotter-color-picker-section-label">Recent</div><div class="sciplotter-color-picker-recent-swatches"></div>';
                    app.insertBefore(section, interaction);
                    this.recentSection = section;
                    this.recentSwatchesEl = section.querySelector('.sciplotter-color-picker-recent-swatches');
                }
            }


            bindPickerDismissal(instance = this.pickr) {
                const root = instance?.getRoot?.();
                const app = root?.app;
                const resultInput = root?.interaction?.result;
                if (!app || app.dataset.sciplotterDismissBound === 'true') return;
                const closeWithoutSaving = () => {
                    if (this.value) instance?.setColor(this.value, true);
                    else instance?.setColor(this.fallbackDisplayColor, true);
                    instance?.hide();
                };
                app.dataset.sciplotterDismissBound = 'true';
                app.addEventListener('keydown', (event) => {
                    if (event.key === 'Escape') {
                        event.preventDefault();
                        event.stopPropagation();
                        closeWithoutSaving();
                        return;
                    }
                    if (event.key === 'Enter') {
                        event.preventDefault();
                        event.stopPropagation();
                        const color = instance?.getColor?.();
                        const nextValue = color ? color.toHEXA().toString() : '';
                        this.commitPickerColor(nextValue, instance);
                    }
                });
                document.addEventListener('pointerdown', (event) => {
                    if (!instance?.isOpen?.()) return;
                    const target = event.target;
                    if (!(target instanceof Node)) return;
                    if (app.contains(target) || this.element?.contains(target)) return;
                    closeWithoutSaving();
                }, true);
                if (resultInput) {
                    resultInput.setAttribute('placeholder', '#RRGGBB or rgba(...)');
                }
            }

            syncOpacityTrack(instance = this.pickr) {
                const opacitySlider = instance?.getRoot?.()?.opacity?.slider;
                const color = instance?.getColor?.();
                const rgba = color?.toRGBA?.();
                if (!opacitySlider || !rgba || rgba.length < 3) return;
                const red = Math.round(Number(rgba[0]) || 0);
                const green = Math.round(Number(rgba[1]) || 0);
                const blue = Math.round(Number(rgba[2]) || 0);
                opacitySlider.style.background = [
                    `linear-gradient(to right, rgba(${red}, ${green}, ${blue}, 0), rgba(${red}, ${green}, ${blue}, 1))`,
                    'url("data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2 2"><path fill="white" d="M1,0H2V1H1V0ZM0,1H1V2H0V1Z"/><path fill="%23cbd5e1" d="M0,0H1V1H0V0ZM1,1H2V2H1V1Z"/></svg>")'
                ].join(', ');
                opacitySlider.style.backgroundSize = '100%, 6px 6px';
                opacitySlider.style.backgroundPosition = '0 0, 0 0';
            }

            normalizeSwatchValue(value) {
                return String(this.normalizeValue(value || '', '') || '').trim().toLowerCase();
            }

            getCurrentPickerColorValue(instance = this.pickr) {
                const color = instance?.getColor?.();
                if (color) return this.normalizeSwatchValue(color.toHEXA().toString());
                return this.normalizeSwatchValue(this.value || this.fallbackDisplayColor);
            }

            commitPickerColor(value, instance = this.pickr) {
                const nextValue = this.normalizeValue(value || '', '');
                if (nextValue) trackRecentHistogramColor(nextValue);
                this.commit(nextValue);
                this.renderRecentColors(instance);
                this.syncActiveSwatchState(instance);
                instance?.hide();
            }

            syncActiveSwatchState(instance = this.pickr) {
                const root = instance?.getRoot?.();
                const currentValue = this.getCurrentPickerColorValue(instance);
                Array.from(root?.swatches?.children || []).forEach((button, index) => {
                    const swatchValue = this.normalizeSwatchValue(this.swatches[index] || '');
                    const isActive = !!currentValue && currentValue === swatchValue;
                    button.classList.toggle('is-active', isActive);
                    button.setAttribute('aria-pressed', isActive ? 'true' : 'false');
                });
                Array.from(this.recentSwatchesEl?.children || []).forEach((button) => {
                    const swatchValue = this.normalizeSwatchValue(button.dataset.colorValue || '');
                    const isActive = !!currentValue && currentValue === swatchValue;
                    button.classList.toggle('is-active', isActive);
                    if (!button.classList.contains('is-empty')) {
                        button.setAttribute('aria-pressed', isActive ? 'true' : 'false');
                    }
                });
            }

            renderRecentColors(instance = this.pickr) {
                this.ensureSupplementalSwatchSections(instance);
                if (!this.recentSection || !this.recentSwatchesEl) return;
                const recentColors = (Array.isArray(HISTOGRAM_PLOT_UI.recentColors) ? HISTOGRAM_PLOT_UI.recentColors : []).slice(0, HISTOGRAM_RECENT_COLOR_LIMIT);
                const currentColorValue = this.getCurrentPickerColorValue(instance);
                this.recentSwatchesEl.innerHTML = '';
                this.recentSection.classList.remove('is-empty');
                for (let index = 0; index < HISTOGRAM_RECENT_COLOR_LIMIT; index += 1) {
                    const colorValue = recentColors[index] || '';
                    const button = document.createElement('button');
                    button.type = 'button';
                    button.className = 'sciplotter-color-picker-recent-swatch';
                    if (colorValue) {
                        const normalizedColorValue = this.normalizeSwatchValue(colorValue);
                        button.dataset.colorValue = colorValue;
                        button.style.setProperty('--pcr-color', colorValue);
                        button.setAttribute('aria-label', `Recent color ${colorValue}`);
                        button.setAttribute('aria-pressed', normalizedColorValue === currentColorValue ? 'true' : 'false');
                        button.classList.toggle('is-active', normalizedColorValue === currentColorValue);
                        button.addEventListener('click', () => {
                            instance?.setColor(colorValue, true);
                            this.commitPickerColor(colorValue, instance);
                        });
                    } else {
                        button.classList.add('is-empty');
                        button.disabled = true;
                        button.setAttribute('aria-hidden', 'true');
                    }
                    this.recentSwatchesEl.appendChild(button);
                }
            }

            commit(value) {
                const normalized = this.normalizeValue(value, '');
                this.value = normalized;
                this.updateSwatch();
                if (this.onCommit) this.onCommit(normalized);
            }

            setValue(value) {
                this.value = this.normalizeValue(value, '');
                this.updateSwatch();
                this.syncActiveSwatchState(this.pickr);
            }

            updateSwatch() {
                if (!this.element) return;
                const displayColor = this.value || this.fallbackDisplayColor;
                this.element.style.setProperty('--sciplotter-picker-current-color', displayColor);
                this.element.classList.toggle('is-empty', !this.value);
            }
        }

        const HISTOGRAM_COLOR_PICKER_DEFINITIONS = {
            text: {
                elementId: 'plot-text-color-picker',
                styleKey: 'color',
                normalizeValue: normalizeHistogramColor,
                fallbackDisplayColor: DEFAULT_HISTOGRAM_TEXT_COLOR,
                allowClear: false,
            },
            highlight: {
                elementId: 'plot-highlight-color-picker',
                styleKey: 'highlight',
                normalizeValue: normalizeHistogramHighlightColor,
                fallbackDisplayColor: DEFAULT_HISTOGRAM_HIGHLIGHT_COLOR,
                allowClear: true,
            },
            plot1d: {
                elementId: 'plot-1d-color-picker',
                styleKey: 'plot1dColor',
                normalizeValue: normalizeHistogramColor,
                fallbackDisplayColor: DEFAULT_HISTOGRAM_1D_PLOT_COLOR,
                allowClear: false,
                getValue: () => getHistogramOneDimensionalPlotColor(),
                onCommit: (value) => {
                    applyHistogramOneDimensionalPlotColor(value);

        function createHistogramColorPicker(definition = {}) {
            return new SciPlotterColorPicker({
                pickerKey: definition.styleKey,
                elementId: definition.elementId,
                normalizeValue: definition.normalizeValue,
                fallbackDisplayColor: definition.fallbackDisplayColor,
                allowClear: definition.allowClear,
                swatches: HISTOGRAM_COLOR_SWATCHES,
                onCommit: (value) => {
                    if (typeof definition.onCommit === 'function') {
                        definition.onCommit(value);
                        return;
                    }
                    applySelectedTextColorStyle(definition.styleKey, value);
                },
            });
        }

        function syncHistogramColorPickerState(selectedStyle = {}) {
            const pickerRegistry = window.__sciplotterColorPickers || {};
            Object.entries(HISTOGRAM_COLOR_PICKER_DEFINITIONS).forEach(([pickerKey, definition]) => {
                const pickerValue = typeof definition.getValue === 'function'
                    ? definition.getValue(selectedStyle)
                    : (selectedStyle?.[definition.styleKey] || '');
                pickerRegistry[pickerKey]?.setValue(pickerValue || '');
            });
        }

        function initializeHistogramTextColorPickers() {
            if (!window.Pickr) return;
            const pickerRegistry = {};
            Object.entries(HISTOGRAM_COLOR_PICKER_DEFINITIONS).forEach(([pickerKey, definition]) => {
                const picker = createHistogramColorPicker(definition);
                picker.init();
                pickerRegistry[pickerKey] = picker;
            });
            window.__sciplotterColorPickers = pickerRegistry;
            syncHistogramColorPickerState();
        }

            if (action === 'subscript') setHistogramTextStyleState(selectedTextKey, { script: currentStyle.script === 'sub' ? 'normal' : 'sub' });

            if (editor && selectedTextKey && applyEditorSelectionInlineStyle(editor, styleKey, value)) {
                HISTOGRAM_PLOT_UI[selectedTextKey] = sanitizeHistogramTextMarkup(editor.innerHTML);

            targetKeys.forEach((key) => {

        function applyHistogramLayoutAppearance(layout, mode, xKey, yKey, orientation, histnorm) {
            const texts = getHistogramTextSettings(mode, xKey, yKey, orientation, histnorm);
            const titleFont = getHistogramFontSettings('titleText');
            const xLabelFont = getHistogramFontSettings('xLabelText');
            const yLabelFont = getHistogramFontSettings('yLabelText');
            const titleStyle = getHistogramTextStyleState('titleText');

        function buildSciPlotterNeonWhiteColorscale(reverseRequested) {
            if (!reverseRequested) return HISTOGRAM_CUSTOM_COLOR_SCALES.SciPlotterNeonWhite;
            return [
                [0.0, '#ffffff'],
                [0.015, '#ffffff'],
                [0.12, '#AD47B7'],
                [0.52, '#1B76B3'],
                [1.0, '#021535'],
            ];
        }

        function resolveHistogramColorscale(value, reverseRequested = false) {
            const key = String(value || '').trim();
            if (key === 'SciPlotterNeonWhite') {
                return buildSciPlotterNeonWhiteColorscale(reverseRequested);
            }
            return HISTOGRAM_CUSTOM_COLOR_SCALES[key] || key || 'Viridis';
        }

        function shouldReverseHistogramColorscale(value, reverseRequested) {
            const key = String(value || '').trim();
            if (key === 'SciPlotterNeonWhite') return false;
            return !!reverseRequested;
        }

        function capturePlotTextEdits(ev) {

                if (HISTOGRAM_PLOT_UI[key] === markupValue) return;
                HISTOGRAM_PLOT_UI[key] = markupValue;

            };
            maybeSet('titleText', ev?.['title.text'] ?? ev?.title?.text);
            maybeSet('xLabelText', ev?.['xaxis.title.text'] ?? ev?.xaxis?.title?.text);
            maybeSet('yLabelText', ev?.['yaxis.title.text'] ?? ev?.yaxis?.title?.text);
            if (changed) {
                saveHistogramPlotUiState();
                scheduleHistogramHistoryCommit();
                syncPlotSettingsForm(
                    document.querySelector('input[name="hist-type"]:checked')?.value || '1d',
                    document.getElementById('axis-x')?.value || 'X',
                    document.getElementById('axis-y')?.value || 'Y',
                    document.getElementById('orientation')?.value || 'v',
                    document.getElementById('histnorm')?.value || ''

        async function applyPlotSize(width, height, gd = document.getElementById('histogram-plot')) {
            EXPORT_WIDTH = width;
            EXPORT_HEIGHT = height;
            HISTOGRAM_PLOT_UI.width = width;
            HISTOGRAM_PLOT_UI.height = height;

            applyPlotHostSizing();

        function schedulePlotSizeApply(gd = document.getElementById('histogram-plot')) {
            if (PLOT_SIZE_APPLY_TIMER) window.clearTimeout(PLOT_SIZE_APPLY_TIMER);
            PLOT_SIZE_APPLY_TIMER = window.setTimeout(() => {
