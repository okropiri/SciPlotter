        function normalizeHistogramFontFamily(value, fallback = DEFAULT_FONT_FAMILY) {
            if (typeof value !== 'string') return fallback;
            const trimmed = value.trim();
            if (!trimmed || trimmed === 'Arial, Helvetica, sans-serif') return fallback;
            return trimmed;
        }

        function normalizeHistogramColor(value, fallback = '') {
            if (typeof value !== 'string') return fallback;
            const trimmed = value.trim();
            if (!trimmed) return fallback;
            const probe = document.createElement('span');
            probe.style.color = '';
            probe.style.color = trimmed;
            return probe.style.color || fallback;
        }

        function normalizeHistogramHighlightColor(value, fallback = '') {
            if (typeof value !== 'string') return fallback;
            const trimmed = value.trim();
            if (!trimmed || trimmed.toLowerCase() === 'transparent' || trimmed.toLowerCase() === 'none') return fallback;
            const probe = document.createElement('span');
            probe.style.backgroundColor = '';
            probe.style.backgroundColor = trimmed;
            return probe.style.backgroundColor || fallback;
        }

        function normalizeHistogramPickerColor(value, fallback = '') {
            if (typeof value !== 'string') return fallback;
            const trimmed = value.trim();
            if (!trimmed) return fallback;
            const backgroundColor = normalizeHistogramHighlightColor(trimmed, '');
            if (backgroundColor) return backgroundColor;
            return normalizeHistogramColor(trimmed, fallback);
        }

        function normalizeHistogramFontSize(value, fallback = '') {
            if (typeof value !== 'string' && typeof value !== 'number') return fallback;
            const raw = parseInt(String(value), 10);
            if (!Number.isFinite(raw) || raw <= 0) return fallback;
            return `${Math.max(8, raw)}px`;
        }

        function escapeHistogramHtmlAttribute(value) {
            return String(value || '')
                .replace(/&/g, '&amp;')
                .replace(/"/g, '&quot;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;');
        }

        function buildHistogramInlineStyle(color, highlight, fontFamily = '', fontSize = '') {
            const normalizedColor = normalizeHistogramColor(color, '');
            const normalizedHighlight = normalizeHistogramHighlightColor(highlight, '');
            const normalizedFontFamily = normalizeHistogramFontFamily(fontFamily, '');
            const normalizedFontSize = normalizeHistogramFontSize(fontSize, '');
            const styles = [];
            if (normalizedColor) styles.push(`color: ${normalizedColor}`);
            if (normalizedHighlight) styles.push(`background-color: ${normalizedHighlight}`);
            if (normalizedFontFamily) styles.push(`font-family: ${normalizedFontFamily}`);
            if (normalizedFontSize) styles.push(`font-size: ${normalizedFontSize}`);
            return styles.join('; ');
        }

        function buildHistogramPlotInlineStyle(color, highlight, fontFamily = '', fontSize = '') {
            const normalizedColor = normalizeHistogramColor(color, '');
            const normalizedHighlight = normalizeHistogramHighlightColor(highlight, '');
            const normalizedFontFamily = normalizeHistogramFontFamily(fontFamily, '');
            const normalizedFontSize = normalizeHistogramFontSize(fontSize, '');
            const styles = [];
            if (normalizedColor) {
                styles.push(`color: ${normalizedColor}`);
                styles.push(`fill: ${normalizedColor}`);
            }
            if (normalizedHighlight) {
                styles.push(`text-shadow: -0.18em 0 0 ${normalizedHighlight}, 0.18em 0 0 ${normalizedHighlight}, 0 -0.18em 0 ${normalizedHighlight}, 0 0.18em 0 ${normalizedHighlight}, -0.14em -0.14em 0 ${normalizedHighlight}, 0.14em -0.14em 0 ${normalizedHighlight}, -0.14em 0.14em 0 ${normalizedHighlight}, 0.14em 0.14em 0 ${normalizedHighlight}`);
                styles.push(`stroke: ${normalizedHighlight}`);
                styles.push('stroke-width: 0.42em');
                styles.push('stroke-linejoin: round');
                styles.push('paint-order: stroke fill');
            }
            if (normalizedFontFamily) styles.push(`font-family: ${normalizedFontFamily}`);
            if (normalizedFontSize) styles.push(`font-size: ${normalizedFontSize}`);
            return styles.join('; ');
        }

        function sanitizeHistogramInlineStyle(styleText) {
            if (typeof styleText !== 'string' || !styleText.trim()) return '';
            const probe = document.createElement('span');
            probe.style.cssText = styleText;
            return buildHistogramInlineStyle(probe.style.color, probe.style.backgroundColor, probe.style.fontFamily, probe.style.fontSize);
        }

                    titleFontFamily: normalizeHistogramFontFamily(parsed?.titleFontFamily, fallback.titleFontFamily),
                    axisFontFamily: normalizeHistogramFontFamily(parsed?.axisFontFamily, fallback.axisFontFamily),

        function sanitizeStoredHistogramTextFontStyles() {

                const currentValue = typeof HISTOGRAM_PLOT_UI[textKey] === 'string' ? HISTOGRAM_PLOT_UI[textKey] : '';

                nextValue = stripHistogramInlineStyleProperty(nextValue, 'fontSize');

            });

        sanitizeStoredHistogramTextFontStyles();
        saveHistogramPlotUiState();

        function cloneHistogramHistoryValue(value) {
            if (value == null) return value;
            try {
                return JSON.parse(JSON.stringify(value));
            } catch (_) {
                return null;
            }
        }

        function createHistogramSessionSummaryToken(name = 'summary') {
            return `${String(name || 'summary').slice(0, 80)}::${Date.now()}::${Math.random().toString(36).slice(2, 10)}`;
        }

        function normalizeHistogramHistoryNumber(value) {
            return Number.isFinite(Number(value)) ? Number(value) : null;
        }

        function getHistogramHistoryControlDescriptor(element) {
            if (!(element instanceof HTMLElement)) return null;
            const tagName = element.tagName.toLowerCase();
            const type = String(element.getAttribute('type') || '').toLowerCase();
            if (element.closest('.pcr-app')) return null;
            if (tagName === 'input' && type === 'file') return null;
            const hasStableId = !!element.id;
            const canMatchByGroup = tagName === 'input' && (type === 'radio' || type === 'checkbox') && !!element.getAttribute('name') && !!element.getAttribute('value');
            if (!hasStableId && !canMatchByGroup) return null;
            return {
                id: element.id || '',
                tagName,
                type,
                name: element.getAttribute('name') || '',
                valueAttr: element.getAttribute('value') || '',
            };
        }

        function captureHistogramControlState() {
            return Array.from(document.querySelectorAll('input, select, textarea'))
                .map((element) => {
                    const descriptor = getHistogramHistoryControlDescriptor(element);
                    if (!descriptor) return null;
                    return {
                        ...descriptor,
                        value: 'value' in element ? element.value : '',
                        checked: 'checked' in element ? !!element.checked : null,
                        rawValue: element.dataset?.rawValue || '',
                    };
                })
                .filter(Boolean);
        }

        function findHistogramControlFromState(entry) {
            if (!entry) return null;
            if (entry.id) return document.getElementById(entry.id);
            const canMatchByGroup = entry.tagName === 'input' && (entry.type === 'radio' || entry.type === 'checkbox') && !!entry.name && !!entry.valueAttr;
            if (!canMatchByGroup) return null;
            const candidates = Array.from(document.querySelectorAll(entry.tagName || 'input'));
            return candidates.find((element) => {
                if (!(element instanceof HTMLElement)) return false;
                if ((element.getAttribute('name') || '') !== (entry.name || '')) return false;
                if (entry.type && String(element.getAttribute('type') || '').toLowerCase() !== entry.type) return false;
                if (entry.valueAttr && (element.getAttribute('value') || '') !== entry.valueAttr) return false;
                return true;
            }) || null;
        }

        function applyHistogramControlState(entries) {
            (Array.isArray(entries) ? entries : []).forEach((entry) => {
                const element = findHistogramControlFromState(entry);
                if (!element) return;
                if ('checked' in element && entry.checked != null) element.checked = !!entry.checked;
                if ('value' in element && typeof entry.value === 'string') element.value = entry.value;
                if (entry.rawValue) element.dataset.rawValue = entry.rawValue;
                else if (element.dataset?.rawValue) delete element.dataset.rawValue;
            });
        }

        function captureHistogramSelectionState(gd = document.getElementById('histogram-plot')) {
            if (!gd || !Array.isArray(gd.data)) return [];
            return gd.data
                .map((trace, index) => {
                    if (!trace || !trace._selectionProxy) return null;
                    const selected = Array.isArray(trace.selectedpoints) ? trace.selectedpoints.slice() : null;
                    return selected ? { index, selectedpoints: selected } : null;
                })
                .filter(Boolean);
        }

        async function restoreHistogramSelectionState(selectionState, gd = document.getElementById('histogram-plot')) {
            if (!gd || !window.Plotly || !Array.isArray(gd.data)) return;
            const traceIndexes = (gd.data || [])
                .map((trace, index) => (trace && trace._selectionProxy) ? index : -1)
                .filter((index) => index >= 0);
            if (traceIndexes.length) {
                try {
                    await Plotly.restyle(gd, { selectedpoints: null }, traceIndexes);
                } catch (_) {}
            }
            const entries = Array.isArray(selectionState) ? selectionState : [];
            for (const entry of entries) {
                if (!entry || !Number.isInteger(entry.index) || !Array.isArray(entry.selectedpoints)) continue;
                try {
                    await Plotly.restyle(gd, { selectedpoints: [entry.selectedpoints] }, [entry.index]);
                } catch (_) {}
            }
            syncSelectionProjectionFromCurrentSelection(gd);
        }

        function captureHistogramHistorySnapshot() {
            return {
                controls: captureHistogramControlState(),
                plotUi: cloneHistogramHistoryValue(HISTOGRAM_PLOT_UI) || {},
                localSummaryToken: LOCAL_SUMMARY_TOKEN || null,
                exportWidth: normalizeHistogramHistoryNumber(EXPORT_WIDTH),
                exportHeight: normalizeHistogramHistoryNumber(EXPORT_HEIGHT),
                lastXRange: cloneHistogramHistoryValue(LAST_X_RANGE),
                lastYRange: cloneHistogramHistoryValue(LAST_Y_RANGE),
                markers: cloneHistogramHistoryValue(MARKERS) || [],
                markerIdSeq: normalizeHistogramHistoryNumber(MARKER_ID_SEQ) || 0,
                drawShapes: cloneHistogramHistoryValue(DRAW_SHAPES) || [],
                drawAnnotations: cloneHistogramHistoryValue(DRAW_ANNOTATIONS) || [],
                markerMode: !!MARKER_MODE,
                ellipseSelectionMode: !!ELLIPSE_SELECTION_MODE,
                projectionMode: !!PROJECTION_MODE,
                projectionLocked: !!PROJECTION_LOCKED,
                lastProjectionState: cloneHistogramHistoryValue(LAST_PROJECTION_STATE),
                selectionState: captureHistogramSelectionState(),
                summarySource: document.getElementById('summarySource')?.value || 'auto',
            };
        }

        function areHistogramHistorySnapshotsEqual(left, right) {
            return JSON.stringify(left) === JSON.stringify(right);
        }

        function trimHistogramHistoryStack(stack) {
            while (stack.length > HISTOGRAM_HISTORY_LIMIT) stack.shift();
        }

        function syncHistogramHistoryButtons() {
            const undoButton = document.getElementById('btn-undo');
            const redoButton = document.getElementById('btn-redo');
            if (undoButton) {
                const disabled = HISTOGRAM_HISTORY_UNDO_STACK.length === 0;
                undoButton.disabled = disabled;
                undoButton.setAttribute('aria-disabled', disabled ? 'true' : 'false');
            }
            if (redoButton) {
                const disabled = HISTOGRAM_HISTORY_REDO_STACK.length === 0;
                redoButton.disabled = disabled;
                redoButton.setAttribute('aria-disabled', disabled ? 'true' : 'false');
            }
        }

        function commitHistogramHistorySnapshot() {
            if (HISTOGRAM_HISTORY_IS_APPLYING) return;
            const snapshot = captureHistogramHistorySnapshot();
            if (!HISTOGRAM_HISTORY_CURRENT) {
                HISTOGRAM_HISTORY_CURRENT = snapshot;
                syncHistogramHistoryButtons();
                return;
            }
            if (areHistogramHistorySnapshotsEqual(HISTOGRAM_HISTORY_CURRENT, snapshot)) {
                syncHistogramHistoryButtons();
                return;
            }
            HISTOGRAM_HISTORY_UNDO_STACK.push(cloneHistogramHistoryValue(HISTOGRAM_HISTORY_CURRENT));
            trimHistogramHistoryStack(HISTOGRAM_HISTORY_UNDO_STACK);
            HISTOGRAM_HISTORY_CURRENT = snapshot;
            HISTOGRAM_HISTORY_REDO_STACK = [];
            syncHistogramHistoryButtons();
        }

        function scheduleHistogramHistoryCommit(delay = 220) {
            if (HISTOGRAM_HISTORY_IS_APPLYING) return;
            window.clearTimeout(HISTOGRAM_HISTORY_COMMIT_TIMER);
            HISTOGRAM_HISTORY_COMMIT_TIMER = window.setTimeout(() => {
                HISTOGRAM_HISTORY_COMMIT_TIMER = null;
                commitHistogramHistorySnapshot();
            }, delay);
        }

        async function restoreHistogramHistorySnapshot(snapshot) {
            if (!snapshot) return;
            const gd = document.getElementById('histogram-plot');
            HISTOGRAM_HISTORY_IS_APPLYING = true;
            window.clearTimeout(HISTOGRAM_HISTORY_COMMIT_TIMER);
            HISTOGRAM_HISTORY_COMMIT_TIMER = null;
            try {
                if (gd?.__plotTextEditor) cancelEditablePlotTextEditor(gd);
                const exportMenu = document.getElementById('export-menu');
                const exportToggle = document.getElementById('btn-export');
                if (exportMenu) exportMenu.classList.remove('open');
                if (exportToggle) exportToggle.setAttribute('aria-expanded', 'false');

                LOCAL_SUMMARY_TOKEN = snapshot.localSummaryToken || null;
                LOCAL_SUMMARY = LOCAL_SUMMARY_TOKEN ? (HISTOGRAM_SESSION_SUMMARIES.get(LOCAL_SUMMARY_TOKEN) || null) : null;
                if (LOCAL_SUMMARY) prepareSummaryDataset(LOCAL_SUMMARY);
                CACHED_SUMMARY = null;
                EXPORT_WIDTH = normalizeHistogramHistoryNumber(snapshot.exportWidth);
                EXPORT_HEIGHT = normalizeHistogramHistoryNumber(snapshot.exportHeight);
                LAST_X_RANGE = cloneHistogramHistoryValue(snapshot.lastXRange);
                LAST_Y_RANGE = cloneHistogramHistoryValue(snapshot.lastYRange);
                DRAW_SHAPES = cloneHistogramHistoryValue(snapshot.drawShapes) || [];
                DRAW_ANNOTATIONS = cloneHistogramHistoryValue(snapshot.drawAnnotations) || [];

                Object.keys(HISTOGRAM_PLOT_UI).forEach((key) => {
                    delete HISTOGRAM_PLOT_UI[key];
                });
                Object.assign(HISTOGRAM_PLOT_UI, cloneHistogramHistoryValue(snapshot.plotUi) || {});
                saveHistogramPlotUiState();

                const summarySourceSelect = document.getElementById('summarySource');
                const customOption = document.querySelector('#summarySource option[value="custom"]');
                const customSummaryName = document.getElementById('customSummaryName');
                if (customOption) customOption.disabled = !LOCAL_SUMMARY;
                if (summarySourceSelect) summarySourceSelect.value = snapshot.summarySource || 'auto';
                if (customSummaryName) customSummaryName.textContent = LOCAL_SUMMARY?.name || '';

                const headers = await fetchSummaryHeaders();
                if (headers && headers.length) {
                    restoreOrDefaultFeatureSelections(headers, Array.isArray(LOCAL_SUMMARY?.rows) ? LOCAL_SUMMARY.rows : [], { useCustomDefaults: false });
                    await populateChannelsDynamic();
                }

                applyHistogramControlState(snapshot.controls);

                const mode = document.querySelector('input[name="hist-type"]:checked')?.value || '2d';
                setMode(mode);
                syncFeatureRowVisibility(mode);
                requestAnimationFrame(syncFeatureSelectWidths);
                syncPlotSizeControls();
                summarizeSelection();

                const selectedTextKey = getActiveEditablePlotTextKey(gd);
                const fontFamilySelect = document.getElementById('plot-font-family-input');
                const toolbarFont = getHistogramToolbarState(gd, selectedTextKey).font;
                renderPlotFontFamilyOptions(toolbarFont.family);
                if (fontFamilySelect) fontFamilySelect.style.fontFamily = toolbarFont.family || DEFAULT_FONT_FAMILY;
                syncPlotSettingsForm(
                    mode,
                    document.getElementById('axis-x')?.value || 'X',
                    document.getElementById('axis-y')?.value || 'Y',
                    document.getElementById('orientation')?.value || 'v',
                    document.getElementById('histnorm')?.value || ''
                );

                if (headers && headers.length) await renderHistogram();
                else renderPlaceholder();

                MARKERS = cloneHistogramHistoryValue(snapshot.markers) || [];
                MARKER_ID_SEQ = normalizeHistogramHistoryNumber(snapshot.markerIdSeq) || 0;
                redrawMarkers(gd);

                MARKER_MODE = false;
                setProjectionMode(gd, false, { silent: true });
                setEllipseSelectionMode(gd, false, { silent: true });
                LAST_PROJECTION_STATE = cloneHistogramHistoryValue(snapshot.lastProjectionState);
                renderHistogramProjection();
                if (snapshot.projectionMode) {
                    setProjectionMode(gd, true, { silent: true });
                    if (LAST_PROJECTION_STATE) updateHistogramProjection(LAST_PROJECTION_STATE);
                    setProjectionLocked(!!snapshot.projectionLocked, { silent: true });
                } else if (snapshot.ellipseSelectionMode) {
                    setEllipseSelectionMode(gd, true, { silent: true });
                } else if (snapshot.markerMode) {
                    MARKER_MODE = true;
                    if (gd) gd.style.cursor = 'crosshair';
                    syncActiveToolChrome(gd);
                } else if (gd) {
                    gd.style.cursor = '';
                    syncActiveToolChrome(gd);
                }

                await restoreHistogramSelectionState(snapshot.selectionState, gd);
                syncRightPanelChrome();
                applyHistogramTooltips(gd);
            } finally {
                HISTOGRAM_HISTORY_IS_APPLYING = false;
                HISTOGRAM_HISTORY_CURRENT = captureHistogramHistorySnapshot();
                syncHistogramHistoryButtons();
            }
        }

        async function undoHistogramHistory() {
            if (!HISTOGRAM_HISTORY_UNDO_STACK.length) return;
            const previousSnapshot = HISTOGRAM_HISTORY_UNDO_STACK.pop();
            if (HISTOGRAM_HISTORY_CURRENT) {
                HISTOGRAM_HISTORY_REDO_STACK.push(cloneHistogramHistoryValue(HISTOGRAM_HISTORY_CURRENT));
                trimHistogramHistoryStack(HISTOGRAM_HISTORY_REDO_STACK);
            }
            await restoreHistogramHistorySnapshot(previousSnapshot);
        }

        async function redoHistogramHistory() {
            if (!HISTOGRAM_HISTORY_REDO_STACK.length) return;
            const nextSnapshot = HISTOGRAM_HISTORY_REDO_STACK.pop();
            if (HISTOGRAM_HISTORY_CURRENT) {
                HISTOGRAM_HISTORY_UNDO_STACK.push(cloneHistogramHistoryValue(HISTOGRAM_HISTORY_CURRENT));
                trimHistogramHistoryStack(HISTOGRAM_HISTORY_UNDO_STACK);
            }
            await restoreHistogramHistorySnapshot(nextSnapshot);
        }

        function initializeHistogramHistory() {
            HISTOGRAM_HISTORY_UNDO_STACK = [];
            HISTOGRAM_HISTORY_REDO_STACK = [];
            HISTOGRAM_HISTORY_CURRENT = captureHistogramHistorySnapshot();
            syncHistogramHistoryButtons();
        }

        function isHistogramEditableTarget(target) {
            if (!(target instanceof HTMLElement)) return false;
            if (target.isContentEditable) return true;
            const tagName = target.tagName.toLowerCase();
            return tagName === 'input' || tagName === 'textarea' || tagName === 'select';
        }

        function buildHistogramUndoIcon() {
            const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
            svg.setAttribute('viewBox', '0 0 24 24');
            svg.setAttribute('aria-hidden', 'true');
