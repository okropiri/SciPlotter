            applyOutlineStyles(halo, { halo: true });
            applyOutlineStyles(path);

            if (Array.isArray(ev?.lassoPoints?.x) && Array.isArray(ev?.lassoPoints?.y) && ev.lassoPoints.x.length > 1) {
                const pts = [];
                for (let i = 0; i < ev.lassoPoints.x.length; i++) {
                    const px = xa.l2p(ev.lassoPoints.x[i]) + xa._offset;
                    const py = ya.l2p(ev.lassoPoints.y[i]) + ya._offset;
                    if (Number.isFinite(px) && Number.isFinite(py)) pts.push([px, py]);
                }
                if (pts.length > 1) {
                    const pathData = pts.map((p, idx) => `${idx === 0 ? 'M' : 'L'} ${p[0]} ${p[1]}`).join(' ') + ' Z';
                    halo.setAttribute('d', pathData);
                    path.setAttribute('d', pathData);
                    svg.appendChild(halo);
                    svg.appendChild(path);
                }
                return;
            }

            const xr = ev?.range?.x;
            const yr = ev?.range?.y;
            if (Array.isArray(xr) && xr.length === 2 && Array.isArray(yr) && yr.length === 2) {
                const x0 = xa.l2p(xr[0]) + xa._offset;
                const x1 = xa.l2p(xr[1]) + xa._offset;
                const y0 = ya.l2p(yr[0]) + ya._offset;
                const y1 = ya.l2p(yr[1]) + ya._offset;
                if ([x0, x1, y0, y1].every(Number.isFinite)) {
                    const pathData = `M ${x0} ${y0} L ${x1} ${y0} L ${x1} ${y1} L ${x0} ${y1} Z`;
                    halo.setAttribute('d', pathData);
                    path.setAttribute('d', pathData);
                    svg.appendChild(halo);
                    svg.appendChild(path);
                }
            }
        }

        function clearPlotInteractions(gd) {
            MARKER_MODE = false;
            setProjectionMode(gd, false, { silent: true });
            setEllipseSelectionMode(gd, false, { silent: true });
            if (gd) gd.style.cursor = '';
            syncActiveToolChrome(gd);
            MARKERS = [];
            redrawMarkers(gd);
            clearHistogramProjection();
            clearHistogramSelectionState(gd, {
                selectionPlaceholder: getHistogramSelectionPlaceholder(),
                syncPlotly: true,
                clearMeta: true,
            });
            flashStatus(gd, 'Deleted markers and cleared selections');
            scheduleHistogramHistoryCommit();
        }

        function isHistogramDrawAnnotationTextKey(textKey) {
            return typeof textKey === 'string' && /^drawAnnotation:\d+$/.test(textKey);
        }

        function getHistogramDrawAnnotationIndex(textKey) {
            if (!isHistogramDrawAnnotationTextKey(textKey)) return -1;
            const index = parseInt(String(textKey).split(':')[1], 10);
            return Number.isInteger(index) ? index : -1;
        }

        function getHistogramDrawAnnotationByKey(textKey) {
            const index = getHistogramDrawAnnotationIndex(textKey);
            if (index < 0) return null;
            return DRAW_ANNOTATIONS[index] || null;
        }

        function normalizeHistogramDrawAnnotation(annotation = {}) {
            const showarrow = !!annotation.showarrow;
            return {
                xref: annotation.xref || 'paper',
                yref: annotation.yref || 'paper',
                x: Number.isFinite(annotation.x) ? annotation.x : 0.5,
                y: Number.isFinite(annotation.y) ? annotation.y : 0.5,
                text: sanitizeHistogramTextMarkup(typeof annotation.text === 'string' && annotation.text ? annotation.text : 'Double-click to edit'),
                showarrow,
                arrowhead: showarrow ? (Number.isFinite(annotation.arrowhead) ? annotation.arrowhead : 2) : 0,
                arrowsize: Number.isFinite(annotation.arrowsize) ? annotation.arrowsize : 1,
                arrowwidth: Number.isFinite(annotation.arrowwidth) ? annotation.arrowwidth : 1.6,
                arrowcolor: normalizeHistogramColor(annotation.arrowcolor, '#1B76B3') || '#1B76B3',
                axref: annotation.axref || 'pixel',
                ayref: annotation.ayref || 'pixel',
                ax: Number.isFinite(annotation.ax) ? annotation.ax : (showarrow ? -56 : 0),
                ay: Number.isFinite(annotation.ay) ? annotation.ay : (showarrow ? -52 : 0),
                align: typeof annotation.align === 'string' && annotation.align ? annotation.align : 'center',
                bordercolor: normalizeHistogramColor(annotation.bordercolor, '#cbd5e1') || '#cbd5e1',
                borderwidth: Number.isFinite(annotation.borderwidth) ? annotation.borderwidth : 1,
                borderpad: Number.isFinite(annotation.borderpad) ? annotation.borderpad : 6,
                bgcolor: normalizeHistogramColor(annotation.bgcolor, 'rgba(255, 255, 255, 0.92)') || 'rgba(255, 255, 255, 0.92)',
                opacity: Number.isFinite(annotation.opacity) ? annotation.opacity : 1,
                captureevents: true,
                font: {
                    family: normalizeHistogramFontFamily(annotation.font?.family, DEFAULT_FONT_FAMILY),
                    size: Math.max(10, parseInt(String(annotation.font?.size || DEFAULT_AXIS_FONT_SIZE), 10) || DEFAULT_AXIS_FONT_SIZE),
                    color: normalizeHistogramColor(annotation.font?.color, DEFAULT_HISTOGRAM_TEXT_COLOR) || DEFAULT_HISTOGRAM_TEXT_COLOR,
                },
            };
        }

        function applyHistogramDrawStateToLayout(layout) {
            const baseAnnotations = Array.isArray(layout.annotations) ? layout.annotations.slice() : [];
            layout.annotations = baseAnnotations.concat((DRAW_ANNOTATIONS || []).map((annotation) => normalizeHistogramDrawAnnotation(annotation)));
            layout.shapes = cloneHistogramHistoryValue(DRAW_SHAPES) || [];
            layout.newshape = {
                ...(layout.newshape || {}),
                line: {
                    ...(layout.newshape?.line || {}),
                    color: '#0f766e',
                    width: 2,
                },
                fillcolor: 'rgba(15, 118, 110, 0.08)',
                opacity: 1,
            };
            return baseAnnotations.length;
        }

        function getHistogramPlotBaseAnnotations(gd) {
            const count = Number.isInteger(gd?.__histBaseAnnotationCount) ? gd.__histBaseAnnotationCount : 0;
            if (!Array.isArray(gd?.layout?.annotations)) return [];
            return gd.layout.annotations.slice(0, count);
        }

        function syncHistogramDrawStateFromPlot(gd) {
            if (!gd?.layout) return;
            DRAW_SHAPES = cloneHistogramHistoryValue(gd.layout.shapes) || [];
            const baseCount = Number.isInteger(gd.__histBaseAnnotationCount) ? gd.__histBaseAnnotationCount : 0;
            const annotations = Array.isArray(gd.layout.annotations) ? gd.layout.annotations.slice(baseCount) : [];
            DRAW_ANNOTATIONS = annotations.map((annotation) => normalizeHistogramDrawAnnotation(annotation));
        }

        async function applyHistogramDrawStateToCurrentPlot(gd) {
            if (!gd || !window.Plotly) return;
            const baseAnnotations = getHistogramPlotBaseAnnotations(gd);
            await Plotly.relayout(gd, {
                shapes: cloneHistogramHistoryValue(DRAW_SHAPES) || [],
                annotations: baseAnnotations.concat((DRAW_ANNOTATIONS || []).map((annotation) => normalizeHistogramDrawAnnotation(annotation))),
            });
            syncHistogramDrawStateFromPlot(gd);
        }

        async function addHistogramDrawAnnotation(gd, options = {}) {
            if (!gd || !window.Plotly) return;
            deactivateActiveInteractionTool(gd, { silent: true });
            DRAW_ANNOTATIONS = DRAW_ANNOTATIONS.concat([
                normalizeHistogramDrawAnnotation({
                    x: 0.5,
                    y: 0.5,
                    xref: 'paper',
                    yref: 'paper',
                    text: options.text,
                    showarrow: !!options.showarrow,
                    ax: options.showarrow ? -56 : 0,
                    ay: options.showarrow ? -52 : 0,
                })
            ]);
            await applyHistogramDrawStateToCurrentPlot(gd);
            flashStatus(gd, options.showarrow ? 'Arrow note added' : 'Label added');
            scheduleHistogramHistoryCommit();
            const annotationKey = `drawAnnotation:${DRAW_ANNOTATIONS.length - 1}`;
            requestAnimationFrame(() => {
                const match = findEditablePlotTextByKey(gd, annotationKey);
                if (match) openEditablePlotTextEditor(gd, match);
            });
        }

        async function clearHistogramDrawObjects(gd) {
            DRAW_SHAPES = [];
            DRAW_ANNOTATIONS = [];
            if (gd && window.Plotly) await applyHistogramDrawStateToCurrentPlot(gd);
            flashStatus(gd, 'Deleted drawing objects');
            scheduleHistogramHistoryCommit();
        }

        async function applyEllipseSelection(gd, ellipse) {
            return applyEllipseSelectionWithOptions(gd, ellipse, {});
        }

        function renderActiveEllipseSelection(gd) {
            if (!gd) return;
            if (!(ACTIVE_ELLIPSE_SELECTION && Number.isFinite(ACTIVE_ELLIPSE_SELECTION.cx) && Number.isFinite(ACTIVE_ELLIPSE_SELECTION.cy))) {
                clearSelectionOutline(gd);
                return;
            }
            drawSelectionOutline(gd, { ellipse: ACTIVE_ELLIPSE_SELECTION, ellipseHandlesActive: !!ACTIVE_ELLIPSE_HANDLES_VISIBLE });
        }

        async function applyEllipseSelectionWithOptions(gd, ellipse, options = {}) {
            const bounds = getPlotAreaBounds(gd);
            const context = gd?.__histSelectionContext || {};
            if (!(bounds && ellipse && context.mode === '2d')) return;

            const traceIndexes = (gd.data || [])
                .map((trace, index) => (trace && trace._selectionProxy) ? index : -1)
                .filter((index) => index >= 0);

            const selectedXs = [];
            const selectedYs = [];
            for (const index of traceIndexes) {
                const trace = gd.data[index];
                const xs = Array.isArray(trace?.x) ? trace.x : [];
                const ys = Array.isArray(trace?.y) ? trace.y : [];
                const selected = [];
                for (let i = 0; i < xs.length; i++) {
                    const xv = Number(xs[i]);
                    const yv = Number(ys[i]);
                    if (!Number.isFinite(xv) || !Number.isFinite(yv) || ellipse.rx <= 0 || ellipse.ry <= 0) continue;
                    const px = bounds.xa.l2p(xv) + bounds.xa._offset;
                    const py = bounds.ya.l2p(yv) + bounds.ya._offset;
                    if (!Number.isFinite(px) || !Number.isFinite(py)) continue;
                    const dx = (px - ellipse.cx) / ellipse.rx;
                    const dy = (py - ellipse.cy) / ellipse.ry;
                    if ((dx * dx) + (dy * dy) <= 1) {
                        selected.push(i);
                        selectedXs.push(xv);
                        selectedYs.push(yv);
                    }
                }
                try {
                    await Plotly.restyle(gd, { selectedpoints: [selected] }, [index]);
                } catch (_) {}
            }

            ACTIVE_ELLIPSE_SELECTION = { ...ellipse };
            setActiveHistogramSelection(gd, { type: 'ellipse', ellipse: ACTIVE_ELLIPSE_SELECTION });
            ACTIVE_ELLIPSE_HANDLES_VISIBLE = options.activateHandles !== false;
            renderActiveEllipseSelection(gd);
            const selectionPlaceholder = getHistogramSelectionPlaceholder('2d');
            if (!selectedXs.length || !selectedYs.length) {
                clearSelectionProjection();
                setHistogramSelectionMeta(null, selectionPlaceholder);
                return;
            }
            const summary = formatSelectionSummary(selectedXs, selectedYs, context.xKey, context.yKey);
            updateSelectionProjectionFromValues(gd, selectedXs, selectedYs, context.xKey, context.yKey);
            setHistogramSelectionMeta(summary || null, selectionPlaceholder);
        }

        function wireExportAnchor(gd) {
            const exportMenu = document.getElementById('export-menu');
            const exportToggle = document.getElementById('btn-export');
            const pngB = document.getElementById('btn-png');
            const pdfB = document.getElementById('btn-pdf');
            const closeExportMenu = () => {
                if (!exportMenu) return;
                exportMenu.classList.remove('open');
                if (exportToggle) exportToggle.setAttribute('aria-expanded', 'false');
            };
            if (exportToggle) {
                exportToggle.onclick = (event) => {
                    event.preventDefault();
                    event.stopPropagation();
                    const nextOpen = !exportMenu?.classList.contains('open');
                    if (exportMenu) exportMenu.classList.toggle('open', nextOpen);
                    exportToggle.setAttribute('aria-expanded', nextOpen ? 'true' : 'false');
                    syncRightPanelChrome();
                };
            }
            if (pngB) pngB.onclick = () => { exportPlotPNG(gd); closeExportMenu(); };
            if (pdfB) pdfB.onclick = () => { exportPlotPDF(gd); closeExportMenu(); };
            if (!document.body.dataset.histExportMenuBound) {
                document.addEventListener('click', (event) => {
                    const menu = document.getElementById('export-menu');
                    if (!menu) return;
                    if (menu.contains(event.target)) return;
                    menu.classList.remove('open');
                    const toggle = document.getElementById('btn-export');
                    if (toggle) toggle.setAttribute('aria-expanded', 'false');
                });
                document.body.dataset.histExportMenuBound = '1';
            }
            applyHistogramTooltips(gd);
            ensureHistogramToolbarHydrated(gd);
            syncRightPanelChrome();
        }

        function syncRightPanelChrome() {
            const rightPanel = document.getElementById('right');
            if (!rightPanel) return;
            const exportAnchor = document.getElementById('export-anchor');
            const exportRect = exportAnchor ? exportAnchor.getBoundingClientRect() : null;
            const exportHeight = exportAnchor ? Math.ceil(exportAnchor.getBoundingClientRect().height) : 0;
            rightPanel.style.setProperty('--hist-export-height', `${exportHeight}px`);
            rightPanel.style.setProperty('--hist-modebar-width', '0px');
            rightPanel.style.setProperty('--hist-modebar-height', '0px');
            rightPanel.style.setProperty('--hist-toolbar-offset', '0px');
            rightPanel.dataset.toolbarCompact = '0';
        }

        function syncFeatureSelectWidths() {
            const xSel = document.getElementById('axis-x');
            const ySel = document.getElementById('axis-y');
            const fSel = document.getElementById('axis-f');
            [xSel, ySel, fSel].forEach((selectEl) => {
                if (!selectEl) return;
                selectEl.style.removeProperty('width');
                selectEl.style.removeProperty('min-width');
                selectEl.style.removeProperty('max-width');
                selectEl.style.removeProperty('flex');
            });
        }

        function getEditablePlotTextMatch(target) {
            if (!(target instanceof Element)) return null;
            const mappings = [
                { selectors: ['.g-gtitle', '.gtitle'], key: 'titleText' },
                { selectors: ['.g-xtitle', '.xtitle'], key: 'xLabelText' },
                { selectors: ['.g-ytitle', '.ytitle'], key: 'yLabelText' },
            ];
            for (const mapping of mappings) {
                for (const selector of mapping.selectors) {
                    const container = target.closest(selector);
                    if (!container) continue;
                    const textNode = container.querySelector('text') || container;
                    return { ...mapping, container, textNode };
                }
            }
            const annotationContainer = target.closest('.annotation');
            const gd = document.getElementById('histogram-plot');
            const baseCount = Number.isInteger(gd?.__histBaseAnnotationCount) ? gd.__histBaseAnnotationCount : 0;
            let annotationIndex = parseInt(annotationContainer?.getAttribute('data-index') || '', 10);
            if (annotationContainer && !Number.isInteger(annotationIndex)) {
                const annotations = Array.from(gd?.querySelectorAll('.annotation') || []);
                annotationIndex = annotations.indexOf(annotationContainer);
            }
            if (annotationContainer && Number.isInteger(annotationIndex) && annotationIndex >= baseCount) {
                return {
                    key: `drawAnnotation:${annotationIndex - baseCount}`,
                    container: annotationContainer,
                    textNode: annotationContainer.querySelector('text') || annotationContainer,
                };
            }
            return null;
        }

        function findEditablePlotTextByKey(gd, key) {
            if (!gd || !key) return null;
            if (isHistogramDrawAnnotationTextKey(key)) {
                const annotationIndex = getHistogramDrawAnnotationIndex(key);
                const baseCount = Number.isInteger(gd.__histBaseAnnotationCount) ? gd.__histBaseAnnotationCount : 0;
                let container = gd.querySelector(`.annotation[data-index="${baseCount + annotationIndex}"]`);
                if (!container) {
                    const annotations = Array.from(gd.querySelectorAll('.annotation'));
                    container = annotations[baseCount + annotationIndex] || null;
                }
                if (!container) return null;
                return { key, container, textNode: container.querySelector('text') || container };
            }
            const mapping = {
                titleText: ['.g-gtitle', '.gtitle'],
                xLabelText: ['.g-xtitle', '.xtitle'],
                yLabelText: ['.g-ytitle', '.ytitle'],
            }[key];
            if (!mapping) return null;
            for (const selector of mapping) {
                const container = gd.querySelector(selector);
                if (!container) continue;
                return { key, container, textNode: container.querySelector('text') || container };
            }
            return null;
        }

        function removeEditablePlotTextEditor(gd, options = {}) {
            if (!gd?.__plotTextEditor) return;
            gd.__plotTextEditor.editor.remove();
            gd.__plotTextEditor = null;
            gd.__plotTextSavedSelectionRange = null;
            if (options.clearSelection !== false) {
                gd.__plotTextSelectionKey = null;
                syncPlotSettingsForm(
                    document.querySelector('input[name="hist-type"]:checked')?.value || '1d',
                    document.getElementById('axis-x')?.value || 'X',
                    document.getElementById('axis-y')?.value || 'Y',
                    document.getElementById('orientation')?.value || 'v',
                    document.getElementById('histnorm')?.value || ''
                );
            }
        }

        async function commitEditablePlotTextEditor(gd, options = {}) {
            const activeEditor = gd?.__plotTextEditor;
            if (!activeEditor) return;
            let nextValue = sanitizeHistogramTextMarkup(activeEditor.editor.innerHTML);
            nextValue = stripHistogramInlineStyleProperty(nextValue, 'fontFamily');
            nextValue = stripHistogramInlineStyleProperty(nextValue, 'fontSize');
            const changed = nextValue !== activeEditor.initialValue;
            const key = activeEditor.key;
            removeEditablePlotTextEditor(gd, options);
            if (!changed) return;
            if (isHistogramDrawAnnotationTextKey(key)) {
                const annotationIndex = getHistogramDrawAnnotationIndex(key);
                if (annotationIndex >= 0 && DRAW_ANNOTATIONS[annotationIndex]) {
                    DRAW_ANNOTATIONS[annotationIndex] = {
                        ...DRAW_ANNOTATIONS[annotationIndex],
                        text: nextValue,
                    };
                    await applyHistogramDrawStateToCurrentPlot(gd);
                    scheduleHistogramHistoryCommit();
                }
                return;
            }
            HISTOGRAM_PLOT_UI[key] = nextValue;
            saveHistogramPlotUiState();
            await relayoutHistogramAppearance();
            scheduleHistogramHistoryCommit();
        }

        function cancelEditablePlotTextEditor(gd, options = {}) {
            removeEditablePlotTextEditor(gd, options);
        }

        function measureEditablePlotTextWidth(text, textStyle) {
            const canvas = measureEditablePlotTextWidth.canvas || (measureEditablePlotTextWidth.canvas = document.createElement('canvas'));
            const context = canvas.getContext('2d');
            if (!context) return 0;
            const fontStyle = textStyle?.fontStyle || 'normal';
            const fontVariant = textStyle?.fontVariant || 'normal';
            const fontWeight = textStyle?.fontWeight || '400';
            const fontSize = textStyle?.fontSize || '14px';
            const fontFamily = textStyle?.fontFamily || 'sans-serif';
            context.font = `${fontStyle} ${fontVariant} ${fontWeight} ${fontSize} ${fontFamily}`;
            return Math.ceil(context.measureText(String(text || '')).width);
        }

        function positionEditablePlotTextEditor(gd, editor, match) {
            if (!gd || !editor || !match?.container) return;
            const host = document.getElementById('plot-host') || gd.parentElement || gd;
            if (!host) return;

            const titleRect = match.container.getBoundingClientRect();
            const hostRect = host.getBoundingClientRect();
            if (!titleRect.width && !titleRect.height) return;

            const textStyle = window.getComputedStyle(match.textNode || match.container);
            const textAnchor = String(match.textNode?.getAttribute?.('text-anchor') || '').trim().toLowerCase();
            const baseLeft = titleRect.left - hostRect.left + host.scrollLeft;
            const baseTop = titleRect.top - hostRect.top + host.scrollTop;
            const centerX = baseLeft + (titleRect.width / 2);
            const centerY = baseTop + (titleRect.height / 2);
            const isYLabel = match.key === 'yLabelText';

            let editorWidth = 0;
            let editorHeight = 0;
            let editorLeft = 0;
            let editorTop = 0;
            const editorText = getEditorPlainText(editor);

            if (isYLabel) {
                editorWidth = Math.min(Math.max(Math.ceil(titleRect.height) + 12, measureEditablePlotTextWidth(editorText, textStyle) + 24, 96), Math.max(96, host.clientHeight - 16));
                editorHeight = Math.max(Math.ceil(titleRect.width) + 6, 28);
                editorLeft = centerX - (editorWidth / 2);
                editorTop = centerY - (editorHeight / 2);
                editor.classList.add('is-rotated-y');
                editor.style.transform = 'rotate(-90deg)';
                editor.style.transformOrigin = 'center center';
            } else {
                editorWidth = Math.min(Math.max(Math.ceil(titleRect.width) + 12, measureEditablePlotTextWidth(editorText, textStyle) + 24, 96), Math.max(96, host.clientWidth - 16));
                editorHeight = Math.max(Math.ceil(titleRect.height) + 8, 28);
                editorLeft = textAnchor === 'middle'
                    ? centerX - (editorWidth / 2)
                    : textAnchor === 'end'
                        ? baseLeft + titleRect.width - editorWidth
                        : baseLeft;
                editorTop = centerY - (editorHeight / 2);
                editor.classList.remove('is-rotated-y');
                editor.style.transform = '';
                editor.style.transformOrigin = '';
            }

            const maxLeft = Math.max(8, host.scrollLeft + host.clientWidth - editorWidth - 8);
            const maxTop = Math.max(8, host.scrollTop + host.clientHeight - editorHeight - 8);
            editorLeft = Math.min(Math.max(host.scrollLeft + 8, editorLeft), maxLeft);
            editorTop = Math.min(Math.max(host.scrollTop + 8, editorTop), maxTop);

            editor.style.left = `${editorLeft}px`;
            editor.style.top = `${editorTop}px`;
            editor.style.width = `${editorWidth}px`;
            editor.style.height = `${editorHeight}px`;
            editor.style.fontFamily = textStyle.fontFamily || 'inherit';
            editor.style.fontSize = textStyle.fontSize || '14px';
            editor.style.fontWeight = textStyle.fontWeight || '600';
            editor.style.lineHeight = textStyle.lineHeight && textStyle.lineHeight !== 'normal'
                ? textStyle.lineHeight
                : `${Math.max(editorHeight - 2, 24)}px`;
            editor.style.textAlign = textAnchor === 'middle' ? 'center' : textAnchor === 'end' ? 'right' : 'left';
        }

        function openEditablePlotTextEditor(gd, match) {
            if (!gd || !match?.container) return;
            const host = document.getElementById('plot-host') || gd.parentElement || gd;
            if (!host) return;

            removeEditablePlotTextEditor(gd, { clearSelection: false });

            const currentValue = getHistogramEditorHtml(match.key, (match.textNode?.textContent || '').trim());
            const editor = document.createElement('div');
            editor.className = 'plot-text-inline-editor';
            editor.contentEditable = 'true';
            editor.spellcheck = false;
            editor.innerHTML = currentValue;
            editor.setAttribute('aria-label', 'Edit plot text');
            positionEditablePlotTextEditor(gd, editor, match);

            const commit = async () => {
                if (!gd?.__plotTextEditor?.editor?.isConnected) return;
                await commitEditablePlotTextEditor(gd);
            };
            const cancel = () => cancelEditablePlotTextEditor(gd);
            const syncToolbarState = () => {
                syncPlotSettingsForm(
                    document.querySelector('input[name="hist-type"]:checked')?.value || '1d',
                    document.getElementById('axis-x')?.value || 'X',
                    document.getElementById('axis-y')?.value || 'Y',
                    document.getElementById('orientation')?.value || 'v',
                    document.getElementById('histnorm')?.value || ''
                );
            };

            editor.addEventListener('keydown', async (event) => {
                if (event.key === 'Escape') {
                    event.preventDefault();
                    cancel();
                    return;
                }
                if (event.key === 'Enter') {
                    event.preventDefault();
                    await commit();
                }
            });
            editor.addEventListener('input', () => {
                const refreshedMatch = findEditablePlotTextByKey(gd, match.key) || match;
                positionEditablePlotTextEditor(gd, editor, refreshedMatch);
                syncToolbarState();
            });
            editor.addEventListener('keyup', () => {
                syncToolbarState();
            });
            editor.addEventListener('mouseup', () => {
                requestAnimationFrame(syncToolbarState);
            });
            editor.addEventListener('blur', () => {
                window.setTimeout(() => {
                    const activeEditor = gd?.__plotTextEditor;
                    if (!activeEditor || activeEditor.editor !== editor) return;
                    const nextTarget = document.activeElement;
                    if (isHistogramTextToolInteractionTarget(nextTarget)) return;
                    if (nextTarget === editor) return;
                    commit().catch((error) => console.warn('Inline plot text commit failed', error));
                }, 0);
            });
            editor.addEventListener('dblclick', (event) => {
                event.stopPropagation();
            });
            editor.addEventListener('pointerdown', (event) => {
                event.stopPropagation();
            });

            host.appendChild(editor);
            gd.__plotTextEditor = {
                editor,
                key: match.key,
                initialValue: currentValue,
            };
            gd.__plotTextSelectionKey = match.key;
            syncPlotSettingsForm(
                document.querySelector('input[name="hist-type"]:checked')?.value || '1d',
                document.getElementById('axis-x')?.value || 'X',
                document.getElementById('axis-y')?.value || 'Y',
                document.getElementById('orientation')?.value || 'v',
                document.getElementById('histnorm')?.value || ''
            );

            requestAnimationFrame(() => {
                editor.focus();
                selectAllEditablePlotText(editor);
            });
        }

        function wireEditablePlotText(gd) {
            if (!gd) return;
            removeEditablePlotTextEditor(gd, { clearSelection: false });
            if (gd.__plotTextEditorBound) return;
            const handleDoubleClick = (event) => {
                const match = getEditablePlotTextMatch(event.target);
                if (!match) return;
                event.preventDefault();
                event.stopPropagation();
                openEditablePlotTextEditor(gd, match);
            };
            const handlePointerDown = (event) => {
                const activeEditor = gd.__plotTextEditor;
                if (!activeEditor) return;
                const target = event.target;
                if (target instanceof Element) {
                    if (target.closest('.plot-text-inline-editor')) return;

            grid-template-columns: repeat(auto-fit, minmax(0, 1fr));
            align-items: center;
            gap: 4px 8px;
            width: 100%;
        }

        #channels-row label {
            width: 100%;
            justify-self: stretch;
            justify-content: center;
            box-sizing: border-box;
        }

        /* Dropdowns fill remaining space */
        #summarySource,
        #colorscale,
        #histnorm,
        #orientation {
            flex: 1 1 auto;
            min-width: 0 !important;
        }

        #norm-row select {
            min-width: 0 !important;
        }

        #orient-cum-row,
        #norm-row,
        #merge-row,
        #autoscale-row {
            display: grid;
            grid-template-columns: 66px minmax(0, 1fr) auto;
            align-items: center;
        }

        #norm-row,
        #autoscale-row,
        #merge-row {
            grid-template-columns: 66px minmax(0, 1fr);
        }

        #gray-out-1d-row,
        #log-row {
            display: grid;
            grid-template-columns: 66px minmax(0, 1fr) minmax(0, 1fr);
            align-items: center;
        }

        #orient-cum-row {
            grid-template-columns: 66px minmax(0, 1fr) minmax(0, 1fr);
        }

        #orient-cum-row > :not(:first-child),
        #norm-row > :not(:first-child),
        #merge-row > :not(:first-child),
        #autoscale-row > :not(:first-child),
        #left .row[role="radiogroup"] > :not(:first-child),
        #gray-out-1d-row > :not(:first-child),
        #log-row > :not(:first-child) {
            justify-self: stretch;
        }

        /* Filter rows - 3-column grid */
        #x-filter-row,
        #y-filter-row {
            display: grid;
            grid-template-columns: 66px 1fr 1fr;
            gap: 5px;
            align-items: center;
        }

        #f-filter-row {
            display: grid;
            grid-template-columns: 66px 1fr 1fr;
            gap: 5px;
            align-items: center;
        }

        #x-filter-row input,
        #y-filter-row input,
        #f-filter-row input {
            width: auto !important;
            min-width: 0;
        }

        .control-canonical-row {
            display: grid;
            gap: 5px 6px;
            align-items: center;
            justify-content: start;
        }

        .control-canonical-row--single {
            grid-template-columns: var(--control-label-width) var(--control-box-width);
        }

        .control-canonical-row--double {
            grid-template-columns: var(--control-label-width) var(--control-box-width) var(--control-label-width) var(--control-box-width);
            position: relative;
        }

        .control-canonical-row--double-split::before {
            content: '';
            position: absolute;
            left: calc(var(--control-label-width) + var(--control-box-width) + 9px);
            top: 1px;
            bottom: 1px;
            width: var(--panel-divider-width);
            background: var(--panel-divider-bg);
            pointer-events: none;
        }

        .control-canonical-row--double-split > .control-canonical-box:nth-child(2) {
            margin-left: -12px;
        }

        .control-canonical-row--double-split > .control-canonical-label:nth-child(3) {
            padding-left: 18px;
        }

        .control-canonical-row--wide {
            grid-template-columns: var(--control-label-width) var(--control-box-wide-width);
        }

        .control-canonical-row--text-dropdown {
            width: 100%;
            justify-content: stretch;
            grid-template-columns: var(--control-dropdown-label-width) minmax(0, 1fr);
        }

        .control-canonical-row--textticktick {
            grid-template-columns: var(--control-label-width) var(--control-box-width) var(--control-label-width) var(--control-box-width);
        }

        .control-canonical-row--toggles {
            grid-template-columns: var(--control-label-width) max-content max-content;
        }

        .control-canonical-label,
        .control-canonical-row > label,
        .control-canonical-row > .row-label {
            display: block;
            font-weight: 600;
            color: #6b7280;
            white-space: nowrap;
            justify-self: start;
            text-align: left;
            padding-left: 0;
        }

        .control-canonical-label--text-dropdown {
            min-width: var(--control-dropdown-label-width) !important;
            max-width: var(--control-dropdown-label-width);
        }

        #x-row.control-canonical-row--text-dropdown > :not(:first-child),
        #y-row.control-canonical-row--text-dropdown > :not(:first-child),
        #f-row.control-canonical-row--text-dropdown > :not(:first-child) {
            justify-self: stretch;
        }

        #log-row.control-canonical-row--textticktick label,
        #colorscale-toggles-row.control-canonical-row--textticktick label {
            padding: 0;
            border: 0;
            background: transparent;
            border-radius: 0;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            justify-self: start;
        }

        #log-row.control-canonical-row--textticktick,
        #colorscale-toggles-row.control-canonical-row--textticktick {
            grid-template-columns: var(--control-label-width) var(--control-box-width) var(--control-label-width) var(--control-box-width);
        }

        #log-row.control-canonical-row--textticktick > .control-canonical-tick-option,
        #colorscale-toggles-row.control-canonical-row--textticktick > .control-canonical-tick-option {
            justify-self: start;
        }

        .control-canonical-tick-option--first {
            grid-column: 2;
                transform: translateX(-12px);
        }

        .control-canonical-tick-option--second {
            grid-column: 4;
        }

        .control-canonical-tick-option {
            min-height: 26px;
            display: inline-flex;
            align-items: center;
            justify-self: start;
            gap: 6px;
            white-space: nowrap;
        }

        .control-canonical-box {
            min-width: 0;
            width: 100% !important;
            max-width: 100%;
            height: 26px;
            min-height: 26px;
            padding: 3px 4px 3px 8px;
            font-size: 12px;
            font-family: inherit;
            color: var(--text-strong);
            background: #fff;
            border: 1px solid rgba(194, 207, 221, 0.9);
            border-radius: 4px;
            box-shadow: inset 0 1px 1px rgba(15, 23, 42, 0.03);
            box-sizing: border-box;
        }

        .control-canonical-box--number {
            appearance: auto;
            -webkit-appearance: auto;
            -moz-appearance: auto;
            text-align: center;
        }

        .control-canonical-select {
            appearance: none;
            -webkit-appearance: none;
            -moz-appearance: none;
            padding-right: 24px;
            background-image: linear-gradient(45deg, transparent 50%, #6b7280 50%), linear-gradient(135deg, #6b7280 50%, transparent 50%);
            background-position: calc(100% - 14px) 11px, calc(100% - 9px) 11px;
            background-size: 5px 5px, 5px 5px;
            background-repeat: no-repeat;
        }

        .control-canonical-select--text-dropdown {
            width: 100% !important;
            min-width: 0 !important;
            max-width: 100%;
        }

        .control-canonical-box:focus,
        .control-canonical-select:focus {
            outline: none;
            border-color: rgba(20, 90, 136, 0.38);
            box-shadow: 0 0 0 3px rgba(27, 118, 179, 0.14);
        }

        /* Phase shift row */
        #phase-shift-row {
            display: grid;
            grid-template-columns: 66px minmax(0, 1fr);
            align-items: center;
            gap: 5px;
        }

        #phase-shift-controls {
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
            align-items: center;
            justify-content: stretch;
            gap: 8px;
            min-width: 0;
            width: 100%;
        }

        #phaseShiftNs {
            width: 100% !important;
            max-width: 90px;
            justify-self: stretch;
        }

        #phase-shift-row .phase-shift-toggle {
            justify-self: start;
            margin-left: 0 !important;
            white-space: nowrap;
        }

        #phase-shift-row .row-label {
            text-transform: none;
            letter-spacing: 0;
        }

        /* Fixed-width number inputs */
        #c3WindowNs {
            width: 36px !important;
        }

        /* dt-adv-row: allow wrap (many checkboxes) */
        #dt-adv-row {
            flex-wrap: wrap;
            align-items: flex-start;
            gap: 3px 10px;
        }

        #colorscale-row > :not(:first-child) {
            justify-self: stretch;
        }

        #colorscale-row label[style*="margin-left"] {
            margin-left: 0 !important;
        }

        /* Button rows */
        #left .action-button-row {
            display: flex;
            width: 100%;
            justify-content: center;
            gap: 52px;
            flex-wrap: nowrap;
            padding-top: 4px;
        }

        #left .action-button-row button {
            flex: 0 0 112px;
            min-width: 112px;
            width: 112px;
        }

        #render-behavior-section + .section .row:not(#hist-action-row) {
            gap: 5px;
            padding-top: 2px;

        #type-display-section .row + .row,
        #feature-section .row + .row,
        #channels-section .row + .row,
        #binning-section .row + .row,
        #plotly-section .row + .row,
        #colors-section .row + .row,

        #feature-section .row:last-of-type,
        #channels-section .row:last-of-type,
        #binning-section .row:last-of-type,

        @media (max-width: 980px) {

            #x-filter-row,

            #f-filter-row,

            #summary-source-row,
            #orient-cum-row,
            #x-row,
            #y-row,
            #f-row,
            #norm-row,
            #left .row[role="radiogroup"],
            #gray-out-1d-row,
            #log-row,
            #autoscale-row,
            #merge-row {
                grid-template-columns: 1fr;
            }

            .control-canonical-row {
                grid-template-columns: 1fr;
            }

            #summary-source-row > label:first-child,
            #left .row > label:first-child,
            #left .section .row > label[for] {
                min-width: 0 !important;
                max-width: none;
            }

            #customSummaryName {
                grid-column: auto;
            }
        }

        /* Plot and meta on the right side */
        #right {
            position: relative;
            display: flex;
            flex-direction: column;
            --hist-toolbar-top: 20px;

        }
        #plot-layout {

            padding-top: 0;
            box-sizing: border-box;
            align-items: stretch;
        }

        #plot-toolbar-row {
            display: flex;
            width: 100%;
        }

        #plot-toolbar-inner {
            width: 100%;

        }
        #plot-host {

        #plot-host.has-custom-size {
            align-items: flex-start;
        }
        #histogram-plot {
            --hist-selection-stroke: #1B76B3;
            --hist-selection-fill: rgba(27, 118, 179, 0.06);

            width: 100%;
            height: calc(100vh - var(--header-height) - 196px);

            flex: 0 0 auto;

        .hist-plot-frame-divider {
            position: absolute;
            pointer-events: none;

        .hist-plot-frame-divider--top {
            height: var(--panel-divider-width);
            background: linear-gradient(90deg, rgba(148, 163, 184, 0.08) 0%, rgba(148, 163, 184, 0.34) 50%, rgba(148, 163, 184, 0.08) 100%);

        .hist-plot-frame-divider--right {
            width: var(--panel-divider-width);
            background: var(--panel-divider-bg);
        }

        .hist-stats-overlay {
            position: absolute;
            top: 0;
            left: 0;
            z-index: 14;
            min-width: 148px;
            max-width: min(248px, calc(100% - 28px));

        .hist-stats-overlay-section + .hist-stats-overlay-section {

        .hist-stats-overlay-rule::before {
            content: '';

            mask-image: linear-gradient(to right, #000 0%, #000 72%, rgba(0, 0, 0, 0.62) 86%, transparent 100%);

        .hist-stats-overlay-row {

            margin-top: 2px;

        .hist-stats-overlay-label {

        /*
         * Toolbar section layout — generalized equal-gap approach.
         *
         * Wrapper containers (.hist-toolbar-tools) use display:contents so
         * ALL .hist-tool-section elements share a single flex context.
         * Each section gets flex:1 1 0 + min-width:max-content, which
         * means:  remaining whitespace = container − ΣcontentWidths.
         * That whitespace is divided equally among N sections.  Content
         * is left-aligned, so the extra space appears as a uniform gap
         * between each section's last tool and the next divider line.
         */

        #export-anchor .export-group {
            display: grid;
            gap: 5px;
            align-content: start;
            justify-items: start;
            background: transparent;
            padding-top: 0;
            padding-right: 0;
            padding-bottom: 0;
            border: 0;
            border-radius: 0;
            max-width: 100%;
            box-shadow: none;

            min-height: 0;
            position: relative;
            padding-left: 0;

        #export-group-files::before {

            display: inline-flex;

        /* Hide explicit divider elements — sections carry their own ::before pseudo-dividers */
        #export-anchor > .toolbar-divider {
            display: none;

        .toolbar-divider {
            flex: 0 0 var(--panel-divider-width);
            width: var(--panel-divider-width);
            align-self: stretch;
            background: var(--panel-divider-bg);
        }

        /* Flatten wrapper containers so inner sections join the parent flex row */
        .hist-toolbar-tools {
            display: contents;

        /* Each section: content-sized; space-between on the parent
           distributes leftover space into equal gaps between sections */
        .hist-tool-section {
            display: grid;
            gap: 5px;
            align-content: start;
            flex: 0 0 auto;
            position: relative;
            padding-left: 14px;

        .hist-tool-section::before {

            position: absolute;

    <script>
        let CACHED_SUMMARY = null; // { headers: string[], rows: object[] }
        let LOCAL_SUMMARY = null;   // { headers: string[], rows: object[], name?: string }
        let LOCAL_SUMMARY_TOKEN = null;
        let CACHED_EVENT_TO_EVENT_DT_RAW = null;
        const HISTOGRAM_SESSION_SUMMARIES = new Map();
        const SUMMARY_RUNTIME_KEY = '__summaryRuntime';
        const SUMMARY_ROW_INDEX_KEY = '__summaryRowIndex';
        const LARGE_HISTOGRAM_POINT_THRESHOLD = 120000;
        const LARGE_HEATMAP_POINT_THRESHOLD = 180000;
        // Persisted zoom ranges for 2D plots
        let LAST_X_RANGE = null; // [min, max] or null
        let LAST_Y_RANGE = null; // [min, max] or null
        // When true, next render will preserve current ranges regardless of autoscale toggle
        let PRESERVE_ON_NEXT_RENDER = false;
        let LAST_META_MAIN = '';
        let LAST_META_SELECTION = null;
        let LAST_META_SELECTION_PLACEHOLDER = 'Use lasso/select on the 2D plot to inspect a subset.';

        function parseHistogramNumericValue(value) {
            if (value === null || value === undefined) return NaN;
            const raw = typeof value === 'string' ? value.trim() : value;
            if (raw === '') return NaN;
            const parsed = Number(raw);
            return Number.isFinite(parsed) ? parsed : NaN;
        }

        function setSummaryRowIndex(row, index) {
            if (!row || typeof row !== 'object') return;
            const current = row[SUMMARY_ROW_INDEX_KEY];
            if (current === index) return;
            Object.defineProperty(row, SUMMARY_ROW_INDEX_KEY, {
                value: index,
                writable: true,
                configurable: true,
                enumerable: false,
            });
        }

        function createEmptySummaryRuntime(headers = []) {
            const columns = Object.create(null);
            const minMax = Object.create(null);
            headers.forEach((header) => {
                columns[header] = new Float64Array(0);
                minMax[header] = null;
            });
            return {
                columns,
                minMax,
                periodCache: Object.create(null),
            };
        }

        function attachSummaryRuntime(dataset, builders = null, minMaxSeed = null) {
            if (!dataset || !Array.isArray(dataset.headers) || !Array.isArray(dataset.rows)) {
                return { headers: [], rows: [] };
            }

            const headers = dataset.headers;
            const rows = dataset.rows;
            if (!headers.length || !rows.length) {
                Object.defineProperty(dataset, SUMMARY_RUNTIME_KEY, {
                    value: createEmptySummaryRuntime(headers),
                    writable: true,
                    configurable: true,
                    enumerable: false,
                });
                return dataset;
            }

            const runtime = {
                columns: Object.create(null),
                minMax: Object.create(null),
                periodCache: Object.create(null),
            };

            const localBuilders = builders || Object.create(null);
            if (!builders) {
                headers.forEach((header) => {
                    localBuilders[header] = new Array(rows.length);
                    runtime.minMax[header] = { min: Infinity, max: -Infinity, count: 0 };
                });
                for (let rowIndex = 0; rowIndex < rows.length; rowIndex++) {
                    const row = rows[rowIndex] || {};
                    setSummaryRowIndex(row, rowIndex);
                    for (const header of headers) {
                        const value = parseHistogramNumericValue(row[header]);
                        localBuilders[header][rowIndex] = Number.isFinite(value) ? value : NaN;
                        if (!Number.isFinite(value)) continue;
                        const stats = runtime.minMax[header];
                        stats.count += 1;
                        if (value < stats.min) stats.min = value;
                        if (value > stats.max) stats.max = value;
                    }
                }
            } else {
                for (let rowIndex = 0; rowIndex < rows.length; rowIndex++) {
                    setSummaryRowIndex(rows[rowIndex], rowIndex);
                }
                headers.forEach((header) => {
                    const seeded = minMaxSeed && minMaxSeed[header] ? minMaxSeed[header] : null;
                    runtime.minMax[header] = seeded && seeded.count
                        ? { min: seeded.min, max: seeded.max, count: seeded.count }
                        : { min: Infinity, max: -Infinity, count: 0 };
                });
            }

            headers.forEach((header) => {
                const source = Array.isArray(localBuilders[header]) ? localBuilders[header] : [];
                runtime.columns[header] = Float64Array.from(source);
                const stats = runtime.minMax[header];
                runtime.minMax[header] = (stats && stats.count)
                    ? { min: stats.min, max: stats.max, count: stats.count }
                    : null;
            });

            Object.defineProperty(dataset, SUMMARY_RUNTIME_KEY, {
                value: runtime,
                writable: true,
                configurable: true,
                enumerable: false,
            });
            runtime._indicesSet = true;
            return dataset;
        }

        function prepareSummaryDataset(dataset) {
            if (!dataset || !Array.isArray(dataset.headers) || !Array.isArray(dataset.rows)) {
                return { headers: [], rows: [] };
            }
            const runtime = dataset[SUMMARY_RUNTIME_KEY];
            if (runtime && runtime.columns) {
                // Only set row indices once (avoids O(n²) when called per-row)
                if (!runtime._indicesSet) {
                    for (let rowIndex = 0; rowIndex < dataset.rows.length; rowIndex++) {
                        setSummaryRowIndex(dataset.rows[rowIndex], rowIndex);
                    }
                    runtime._indicesSet = true;
                }
                return dataset;
            }
            return attachSummaryRuntime(dataset);
        }

        function getSummaryRuntime(dataset) {
            // Fast path: if runtime already attached, use it directly
            const rt = dataset?.[SUMMARY_RUNTIME_KEY];
            if (rt && rt.columns) return rt;
            return prepareSummaryDataset(dataset)[SUMMARY_RUNTIME_KEY] || createEmptySummaryRuntime(dataset?.headers || []);
        }

        function getSummaryColumn(dataset, key) {
            // Inline runtime access to avoid prepareSummaryDataset overhead in hot loops
            const rt = dataset?.[SUMMARY_RUNTIME_KEY];
            if (rt && rt.columns) return rt.columns[key] || null;
            const runtime = getSummaryRuntime(dataset);
            return runtime.columns?.[key] || null;
        }

        function getSummaryNumericValue(dataset, row, key) {
            // Hot path: inline runtime+column access (avoids O(n²) indirection)
            const rt = dataset?.[SUMMARY_RUNTIME_KEY];
            const column = rt ? (rt.columns?.[key] || null) : getSummaryColumn(dataset, key);
            if (!column) return NaN;
            const rowIndex = row?.[SUMMARY_ROW_INDEX_KEY];
            if (typeof rowIndex !== 'number' || rowIndex < 0 || rowIndex >= column.length) return NaN;
            const value = column[rowIndex];
            return Number.isFinite(value) ? value : NaN;
        }

        function getSummaryNumericValueByIndex(dataset, rowIndex, key) {
            const rt = dataset?.[SUMMARY_RUNTIME_KEY];
            const column = rt ? (rt.columns?.[key] || null) : getSummaryColumn(dataset, key);
            if (!column || typeof rowIndex !== 'number' || rowIndex < 0 || rowIndex >= column.length) return NaN;
            const value = column[rowIndex];
            return Number.isFinite(value) ? value : NaN;
        }

        function getSummaryColumnBounds(dataset, key, rows = null) {
            if (!dataset || !key) return null;
            const runtime = getSummaryRuntime(dataset);
            if (!rows || rows === dataset.rows) return runtime.minMax?.[key] || null;
            let min = Infinity;
            let max = -Infinity;
            let count = 0;
            for (const row of rows) {
                const value = getSummaryNumericValue(dataset, row, key);
                if (!Number.isFinite(value)) continue;
                if (value < min) min = value;
                if (value > max) max = value;
                count += 1;
            }
            if (!count) return null;
            return { min, max, count };
        }

        function shouldUsePreBinned1D(pointCount) {
            return pointCount >= LARGE_HISTOGRAM_POINT_THRESHOLD;
        }

        function shouldUsePreBinned2D(pointCount) {
            return pointCount >= LARGE_HEATMAP_POINT_THRESHOLD;
        }

        function normalizeHistogramBinCounts(counts, histnorm, binSize) {
            const out = counts.slice();
            const total = out.reduce((sum, value) => sum + value, 0);
            if (!histnorm || !total) return out;
            if (histnorm === 'probability') return out.map((value) => value / total);
            if (histnorm === 'percent') return out.map((value) => (value / total) * 100);
            if (histnorm === 'density') {
                const safeSize = Number.isFinite(binSize) && binSize > 0 ? binSize : 1;
                return out.map((value) => value / (total * safeSize));
            }
            return out;
        }

        function applyCumulativeHistogramCounts(counts) {
            const out = counts.slice();
            for (let index = 1; index < out.length; index++) out[index] += out[index - 1];
            return out;
        }

        function buildPreBinned1DTrace(values, options = {}) {
            const {
                start,
                end,
                bins,
                orientation = 'v',
                color = '#1f77b4',
                opacity = 1,
                name = '',
                histnorm = '',
                cumulative = false,
                showlegend = true,
            } = options;
            if (!Array.isArray(values) || !values.length || !Number.isFinite(start) || !Number.isFinite(end) || start === end) return null;
            const safeBins = Math.max(1, bins | 0);
            const size = (end - start) / safeBins;
            const counts = new Array(safeBins).fill(0);
            for (const value of values) {
                if (!Number.isFinite(value) || value < start || value > end) continue;
                let index = Math.floor((value - start) / size);
                if (index === safeBins) index = safeBins - 1;
                if (index < 0 || index >= safeBins) continue;
                counts[index] += 1;
            }
            let measure = normalizeHistogramBinCounts(counts, histnorm, size);
            if (cumulative) measure = applyCumulativeHistogramCounts(measure);
            const centers = Array.from({ length: safeBins }, (_, index) => start + ((index + 0.5) * size));
            const edges = Array.from({ length: safeBins }, (_, index) => [start + (index * size), start + ((index + 1) * size)]);
            const trace = {
                type: 'bar',
                name,
                opacity,
                showlegend,
                marker: { color },
                customdata: edges,
                hovertemplate: orientation === 'h'
                    ? 'Bin %{customdata[0]:.6g} to %{customdata[1]:.6g}<br>Value %{x}<extra></extra>'
                    : 'Bin %{customdata[0]:.6g} to %{customdata[1]:.6g}<br>Value %{y}<extra></extra>',
            };
            if (orientation === 'h') {
                trace.orientation = 'h';
                trace.x = measure;
                trace.y = centers;
                trace.width = size;
            } else {
                trace.orientation = 'v';
                trace.x = centers;
                trace.y = measure;
                trace.width = size;
            }
            return trace;
        }

        // ── Fast split-based CSV parser for clean scientific data (no quoted fields) ──
        function parseCSVFast(source, name) {
            // Use native split operations (~10-20× faster than char-by-char for 48MB+)
            const lines = source.split('\n');
            if (!lines.length) return prepareSummaryDataset({ headers: [], rows: [], name });

            // Parse headers from first line
            let headerLine = lines[0];
            if (headerLine.charCodeAt(headerLine.length - 1) === 13) headerLine = headerLine.slice(0, -1);
            const headers = headerLine.split(',');
            const numCols = headers.length;
            for (let h = 0; h < numCols; h++) headers[h] = headers[h].trim();

            // Pre-allocate builder arrays with estimated capacity
            const estRows = lines.length - 1;
            const numericBuilders = Object.create(null);
            const minMax = Object.create(null);
            for (let h = 0; h < numCols; h++) {
                const hdr = headers[h];
                numericBuilders[hdr] = new Array(estRows);
                minMax[hdr] = { min: Infinity, max: -Infinity, count: 0 };
            }

            const rows = new Array(estRows);
            let rowCount = 0;

            for (let i = 1; i < lines.length; i++) {
                let line = lines[i];
                if (line.charCodeAt(line.length - 1) === 13) line = line.slice(0, -1);
                if (line.length === 0) continue;

                const fields = line.split(',');
                const obj = {};
                for (let j = 0; j < numCols; j++) {
                    const hdr = headers[j];
                    const raw = j < fields.length ? fields[j] : '';
                    // Parse with unary +  (fastest numeric conversion)
                    const numeric = +raw;
                    const valid = raw.length > 0 && Number.isFinite(numeric);
                    numericBuilders[hdr][rowCount] = valid ? numeric : NaN;
                    obj[hdr] = raw;
                    if (valid) {
                        const stats = minMax[hdr];
                        stats.count++;
                        if (numeric < stats.min) stats.min = numeric;
                        if (numeric > stats.max) stats.max = numeric;
                    }
                }
                rows[rowCount++] = obj;
            }

            // Trim pre-allocated arrays to actual size
            rows.length = rowCount;
            for (let h = 0; h < numCols; h++) {
                numericBuilders[headers[h]].length = rowCount;
            }

            return attachSummaryRuntime({ headers, rows, name }, numericBuilders, minMax);
        }

        // ── Fallback: char-by-char CSV parser for quoted/complex fields ──
        function parseCSVQuoted(source, name) {
            let headers = null;
            const rows = [];
            const numericBuilders = Object.create(null);
            const minMax = Object.create(null);
            let field = '';
            let row = [];
            let inQuotes = false;

            function initHeaders(headerRow) {
                headers = headerRow.map((header) => String(header).trim());
                headers.forEach((header) => {
                    numericBuilders[header] = [];
                    minMax[header] = { min: Infinity, max: -Infinity, count: 0 };
                });
            }

            function pushRow(values) {
                if (!headers) { initHeaders(values); return; }
                if (!values.length || (values.length === 1 && String(values[0]).trim() === '')) return;
                const obj = {};
                for (let index = 0; index < headers.length; index++) {
                    const header = headers[index];
                    const raw = values[index] !== undefined ? String(values[index]).trim() : '';
                    obj[header] = raw;
                    const numeric = parseHistogramNumericValue(raw);
                    numericBuilders[header].push(Number.isFinite(numeric) ? numeric : NaN);
                    if (!Number.isFinite(numeric)) continue;
                    const stats = minMax[header];
                    stats.count += 1;
                    if (numeric < stats.min) stats.min = numeric;
                    if (numeric > stats.max) stats.max = numeric;
                }
                rows.push(obj);
            }

            for (let index = 0; index < source.length; index++) {
                const char = source[index];
                if (inQuotes) {
                    if (char === '"') {
                        const next = source[index + 1];
                        if (next === '"') { field += '"'; index += 1; }
                        else inQuotes = false;
                    } else { field += char; }
                    continue;
                }
                if (char === '"') inQuotes = true;
                else if (char === ',') { row.push(field); field = ''; }
                else if (char === '\r') continue;
                else if (char === '\n') { row.push(field); pushRow(row); row = []; field = ''; }
                else field += char;
            }
            row.push(field);
            if (row.length > 1 || (row.length === 1 && row[0] !== '')) pushRow(row);

            return attachSummaryRuntime({ headers: headers || [], rows, name }, numericBuilders, minMax);
        }

        // Robust CSV parser: fast path for clean scientific data, fallback for quoted fields
        function parseCSV(text, name = '') {
            if (typeof text !== 'string') return prepareSummaryDataset({ headers: [], rows: [], name });
            const source = text.charCodeAt(0) === 0xFEFF ? text.slice(1) : text;
            // Fast path: no quotes means no escaped commas/newlines — use split-based parser
            if (source.indexOf('"') === -1) return parseCSVFast(source, name);
            return parseCSVQuoted(source, name);
        }

        // Advanced features available in the UI (rendered in dropdowns as bold)
        const ADVANCED_FEATURES = [
            { key: 'Event_to_event_dt', label: 'Event_to_event_dt' }, // synthetic from delta_t_ns (ns)
            { key: 'Event_to_event_dt_raw', label: 'Event_to_event_dt_raw' }, // offline neighbor Δt CSV
        ];

        // Helper to find the channel column key in headers (case-insensitive for known variants)
        function getChannelKey(headers) {
            if (!Array.isArray(headers)) return null;
            // Prefer exact common cases, then broader scan
            if (headers.includes('channel')) return 'channel';
            if (headers.includes('Channel')) return 'Channel';
            if (headers.includes('CHANNEL')) return 'CHANNEL';
            // Fallback: case-insensitive match of a header that equals 'channel'
            for (const h of headers) {
                if (String(h).trim().toLowerCase() === 'channel') return h;
            }
            return null;
        }

        // Stable color mapping for channels so toggling doesn't reshuffle colors
        const CHANNEL_FIXED_COLORS = {
            '0': '#1f77b4',   // default/merged color also used for channel "0"
            'C2': '#1f77b4',  // blue
            'C3': '#ff7f0e',  // orange
            'C4': '#2ca02c',  // green
        };
        const CHANNEL_COLOR_PALETTE = ['#1f77b4','#ff7f0e','#2ca02c','#d62728','#9467bd','#8c564b','#e377c2','#7f7f7f','#bcbd22','#17becf'];
        function hashStringStable(s) {
            let h = 2166136261; // FNV-1a 32-bit offset basis
            for (let i = 0; i < s.length; i++) {
                h ^= s.charCodeAt(i);
                h = (h + ((h << 1) + (h << 4) + (h << 7) + (h << 8) + (h << 24))) >>> 0; // * 16777619 (approx via shifts)
            }
            return h >>> 0;
        }
        function getChannelColor(ch) {
            const key = String(ch || '').trim().toUpperCase();
            if (CHANNEL_FIXED_COLORS[key]) return CHANNEL_FIXED_COLORS[key];
            const idx = hashStringStable(key) % CHANNEL_COLOR_PALETTE.length;
            return CHANNEL_COLOR_PALETTE[idx];
        }

        // Populate the Channels checkbox row with unique channel values from the dataset
        async function populateChannelsDynamic() {
            const row = document.getElementById('channels-row');

                const chanKey = getChannelKey(headers);
                if (!chanKey) {

                for (const r of rows) {

                }
                if (!uniq.size) {
                    renderChannelsRowOptions(buildDefaultChannelMarkup());

                // Sort keys naturally
                const keys = Array.from(uniq.keys()).sort((a,b)=> a.localeCompare(b, undefined, { numeric: true }));
                renderChannelsRowOptions(keys.map((key) => ({ value: key, label: uniq.get(key), checked: true })));

        function isDtFeature(key) {
            return key === 'Event_to_event_dt' || key === 'Event_to_event_dt_raw';

        // Build allowed C4 event_ids that have a C3 within ±windowNs in the same trace (absolute time)
        function buildC3AllowedEventIds(headers, rows, windowNs, dataset = null) {
            const summaryDataset = dataset || prepareSummaryDataset({ headers, rows });
            const chanKey = getChannelKey(headers);
            const eidCandidates = ['event_id', 'EventID', 'Event_Id', 'id', 'Id'];
            const eidKey = eidCandidates.find(k => headers.includes(k)) || null;
            const eventStartCandidates = ['event_start_time_ns', 'EventStartTime', 'event_time_ns', 'EventTime', 'peak_time_ns'];
            const startKey = eventStartCandidates.find(k => headers.includes(k)) || null;
            const cycleCandidates = ['cycle_start_time_s', 'timeslice_start_time_s', 'TimesliceStartTime', 'timeslice_start_ns', 'TimesliceStartNs'];
            const cycleKey = cycleCandidates.find(k => headers.includes(k)) || null;
            const traceCandidates = ['trace_id', 'TraceID', 'trace', 'Trace', 'file', 'File', 'filename', 'basename', 'source_file', 'source', 'run', 'Run', 'segment', 'Segment', 'cycle_id', 'CycleID', 'cycle', 'TimesliceID', 'timeslice_id'];
            let traceKey = traceCandidates.find(k => headers.includes(k)) || null;
            // If no explicit trace id, fall back to file name or cycle start time to scope matching within a stream
            if (!traceKey) traceKey = (headers.includes('filename') ? 'filename' : (headers.includes('basename') ? 'basename' : (headers.includes('file') ? 'file' : (cycleKey || null))));
            if (!chanKey || !startKey || !eidKey || !traceKey) return new Set();

            // Determine unit multipliers
            function isNsKey(k) { return /ns$/i.test(k) || /StartNs$/i.test(k); }
            const cycleIsNs = cycleKey ? isNsKey(cycleKey) : false;

            // Group by trace; within each, split by channel and sort by time
            const byTrace = new Map();
            for (const r of rows) {
                const ch = String(r[chanKey] || '').trim().toUpperCase();
                if (ch !== 'C3' && ch !== 'C4') continue;
                const tr = String(r[traceKey] || '').trim();
                const cyc = cycleKey ? getSummaryNumericValue(summaryDataset, r, cycleKey) : 0;
                let tns = startKey ? getSummaryNumericValue(summaryDataset, r, startKey) : NaN;
                // Fallback to delta_t_ns if event start is missing
                if (!Number.isFinite(tns)) {
                    const dKey = headers.includes('delta_t_ns') ? 'delta_t_ns' : (headers.includes('deltaT_ns') ? 'deltaT_ns' : null);
                    if (dKey) {
                        const dv = getSummaryNumericValue(summaryDataset, r, dKey);
                        if (Number.isFinite(dv)) tns = dv + 0; // will add cycleNs below
                    }
                }
                const eid = String(r[eidKey] || '').trim();
                if (!tr || !Number.isFinite(tns) || !eid) continue;
                const cycleNs = cycleKey ? (cycleIsNs ? cyc : (cyc * 1e9)) : 0;
                if (cycleKey && !Number.isFinite(cyc)) continue;
                const abs = cycleNs + tns;
                let g = byTrace.get(tr);
                if (!g) { g = { C3: [], C4: [] }; byTrace.set(tr, g); }
                g[ch].push({ t: abs, id: eid });
            }
            const allowed = new Set();
            const wnd = Math.abs(windowNs || 80);
            byTrace.forEach(g => {
                // Sort by time for two-pointer sweep
                g.C3.sort((a, b) => a.t - b.t);
                g.C4.sort((a, b) => a.t - b.t);
                let j = 0; // lower bound index into C3
                for (let i = 0; i < g.C4.length; i++) {
                    const t4 = g.C4[i].t;
                    // advance j to first C3 with time >= t4 - wnd
                    while (j < g.C3.length && g.C3[j].t < t4 - wnd) j++;
                    let pass = false;
                    // check C3 at j
                    if (j < g.C3.length && Math.abs(g.C3[j].t - t4) <= wnd) pass = true;
                    // also check the immediate previous (j-1) if exists
                    if (!pass && j > 0 && Math.abs(g.C3[j - 1].t - t4) <= wnd) pass = true;
                    if (pass) allowed.add(g.C4[i].id);
                }
            });
            return allowed;
        }

        // Cache for C4-C3 pairs data
        // Guardrail for heavy Event_to_event_dt computations (default storage limit)
        const DEFAULT_DT_LIMIT_NS = 320; // keep |Δt| <= 320 ns by default

        function showLoading() {
