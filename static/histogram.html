        // --- Marker-aware export helpers ---
        function hasCustomSelectionOverlay(gd) {
            const overlay = gd?.querySelector('#selection-outline-svg');
            return !!(overlay && overlay.childNodes && overlay.childNodes.length);
        }

        async function drawCustomSelectionOverlayToCanvas(ctx, gd, w, h) {
            const overlay = gd?.querySelector('#selection-outline-svg');
            if (!(overlay && overlay.childNodes && overlay.childNodes.length)) return;
            const width = Math.max(1, gd.clientWidth || gd.offsetWidth || 1);
            const height = Math.max(1, gd.clientHeight || gd.offsetHeight || 1);
            const clone = overlay.cloneNode(true);
            clone.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
            clone.setAttribute('width', String(width));
            clone.setAttribute('height', String(height));
            clone.setAttribute('viewBox', `0 0 ${width} ${height}`);
            clone.style.width = `${width}px`;
            clone.style.height = `${height}px`;
            const serialized = new XMLSerializer().serializeToString(clone);
            const dataUrl = `data:image/svg+xml;charset=utf-8,${encodeURIComponent(serialized)}`;
            await new Promise((resolve, reject) => {
                const img = new Image();
                img.onload = () => { ctx.drawImage(img, 0, 0, w, h); resolve(); };
                img.onerror = reject;
                img.src = dataUrl;
            });
        }

        function drawRoundedRectPath(ctx, x, y, width, height, radius) {
            const safeRadius = Math.max(0, Math.min(radius, width / 2, height / 2));
            ctx.beginPath();
            ctx.moveTo(x + safeRadius, y);
            ctx.lineTo(x + width - safeRadius, y);
            ctx.quadraticCurveTo(x + width, y, x + width, y + safeRadius);
            ctx.lineTo(x + width, y + height - safeRadius);
            ctx.quadraticCurveTo(x + width, y + height, x + width - safeRadius, y + height);
            ctx.lineTo(x + safeRadius, y + height);
            ctx.quadraticCurveTo(x, y + height, x, y + height - safeRadius);
            ctx.lineTo(x, y + safeRadius);
            ctx.quadraticCurveTo(x, y, x + safeRadius, y);
            ctx.closePath();
        }

        function drawStatsOverlayRuleToCanvas(ctx, x, y, width, height, opacity) {
            if (!(width > 0 && height > 0)) return;
            const gradient = ctx.createLinearGradient(x, y, x + width, y);
            gradient.addColorStop(0, `rgba(107, 114, 128, ${opacity})`);
            gradient.addColorStop(0.72, `rgba(107, 114, 128, ${opacity})`);
            gradient.addColorStop(0.88, `rgba(107, 114, 128, ${opacity * 0.62})`);
            gradient.addColorStop(1, 'rgba(107, 114, 128, 0)');
            ctx.save();
            ctx.beginPath();
            ctx.moveTo(x, y + height * 0.38);
            ctx.lineTo(x + width * 0.76, y + height * 0.38);
            ctx.lineTo(x + width * 0.88, y + height * 0.30);
            ctx.lineTo(x + width * 0.95, y + height * 0.22);
            ctx.lineTo(x + width, y + height * 0.50);
            ctx.lineTo(x + width * 0.95, y + height * 0.78);
            ctx.lineTo(x + width * 0.88, y + height * 0.70);
            ctx.lineTo(x + width * 0.76, y + height * 0.62);
            ctx.lineTo(x, y + height * 0.62);
            ctx.closePath();
            ctx.fillStyle = gradient;
            ctx.fill();
            ctx.restore();
        }

        async function drawStatsOverlayToCanvas(ctx, gd, w, h) {
            const sections = buildStatsOverlaySections();
            if (!sections.length || !gd) return;
            const size = gd?._fullLayout?._size;
            if (!size || !Number.isFinite(size.l) || !Number.isFinite(size.t) || !Number.isFinite(size.w)) return;

            const currentWidth = Math.max(1, gd.clientWidth || gd.offsetWidth || w || 1);
            const currentHeight = Math.max(1, gd.clientHeight || gd.offsetHeight || h || 1);
            const scaleX = w / currentWidth;
            const scaleY = h / currentHeight;
            const scale = Math.sqrt(scaleX * scaleY);

            const paddingX = 10 * scale;
            const paddingTop = 8 * scale;
            const paddingBottom = 9 * scale;
            const sectionGap = 7 * scale;
            const rowGap = 2 * scale;
            const rowColumnGap = 10 * scale;
            const dividerWidth = 0.84;
            const dividerHeight = Math.max(2, 4 * scale);
            const dividerMarginTop = 4 * scale;
            const dividerMarginBottom = 6 * scale;
            const sectionDividerMargin = 7 * scale;
            const minWidth = 148 * scale;
            const maxWidth = Math.min(248 * scale, w - (28 * scaleX));
            const radius = 4 * scale;
            const desiredGapX = 14 * scaleX;
            const desiredGapY = 14 * scaleY;
            const borderWidth = Math.max(1, scale);
            const titleFontSize = 10 * scale;
            const rowFontSize = 11 * scale;
            const titleLineHeight = titleFontSize * 1.15;
            const rowLineHeight = rowFontSize * 1.25;

            ctx.save();
            ctx.textBaseline = 'top';

            ctx.font = `700 ${titleFontSize}px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace`;
            const titleWidths = sections.map((section) => ctx.measureText(section.title).width);

            ctx.font = `${rowFontSize}px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace`;
            let maxLabelWidth = 0;
            let maxValueWidth = 0;
            sections.forEach((section) => {
                section.rows.forEach((row) => {
                    maxLabelWidth = Math.max(maxLabelWidth, ctx.measureText(row.label).width);
                    ctx.font = `600 ${rowFontSize}px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace`;
                    maxValueWidth = Math.max(maxValueWidth, ctx.measureText(row.value).width);
                    ctx.font = `${rowFontSize}px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace`;
                });
            });

            const measuredSectionWidth = Math.max(...titleWidths, maxLabelWidth + rowColumnGap + maxValueWidth);
            const overlayWidth = Math.max(minWidth, Math.min(maxWidth, measuredSectionWidth + paddingX * 2));

            let overlayHeight = paddingTop + paddingBottom;
            sections.forEach((section, index) => {
                if (index > 0) overlayHeight += sectionDividerMargin * 2 + dividerHeight;
                overlayHeight += titleLineHeight + dividerMarginTop + dividerHeight + dividerMarginBottom;
                overlayHeight += section.rows.length * rowLineHeight;
                if (section.rows.length > 1) overlayHeight += (section.rows.length - 1) * rowGap;
            });

            const plotRight = (size.l + size.w) * scaleX;
            const overlayLeft = Math.max(8 * scaleX, plotRight - overlayWidth - desiredGapX);
            const overlayTop = Math.max(8 * scaleY, (size.t * scaleY) + desiredGapY);

            ctx.shadowColor = 'rgba(15, 23, 42, 0.08)';
            ctx.shadowBlur = 10 * scale;
            ctx.shadowOffsetX = 0;
            ctx.shadowOffsetY = 4 * scale;
            drawRoundedRectPath(ctx, overlayLeft, overlayTop, overlayWidth, overlayHeight, radius);
            ctx.fillStyle = 'rgba(255, 255, 255, 0.78)';
            ctx.fill();

            ctx.shadowColor = 'transparent';
            drawRoundedRectPath(ctx, overlayLeft, overlayTop, overlayWidth, overlayHeight, radius);
            ctx.lineWidth = borderWidth;
            ctx.strokeStyle = 'rgba(203, 213, 225, 0.84)';
            ctx.stroke();

            let cursorY = overlayTop + paddingTop;
            sections.forEach((section, sectionIndex) => {
                if (sectionIndex > 0) {
                    drawStatsOverlayRuleToCanvas(ctx, overlayLeft + paddingX, cursorY + sectionDividerMargin, (overlayWidth - (paddingX * 2)) * dividerWidth, dividerHeight, 0.16);
                    cursorY += sectionDividerMargin * 2 + dividerHeight;
                }

                ctx.font = `700 ${titleFontSize}px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace`;
                ctx.fillStyle = '#6b7280';
                ctx.fillText(section.title, overlayLeft + paddingX, cursorY);
                cursorY += titleLineHeight;

                drawStatsOverlayRuleToCanvas(ctx, overlayLeft + paddingX, cursorY + dividerMarginTop, (overlayWidth - (paddingX * 2)) * dividerWidth, dividerHeight, 0.22);
                cursorY += dividerMarginTop + dividerHeight + dividerMarginBottom;

                section.rows.forEach((row, rowIndex) => {
                    ctx.font = `${rowFontSize}px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace`;
                    ctx.fillStyle = '#475569';
                    ctx.fillText(row.label, overlayLeft + paddingX, cursorY);

                    ctx.font = `600 ${rowFontSize}px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace`;
                    ctx.fillStyle = '#1e293b';
                    const valueWidth = ctx.measureText(row.value).width;
                    ctx.fillText(row.value, overlayLeft + overlayWidth - paddingX - valueWidth, cursorY);

                    cursorY += rowLineHeight;
                    if (rowIndex < section.rows.length - 1) cursorY += rowGap;
                });
            });

            ctx.restore();
        }

        async function drawHistogramPlotFrameDividersToCanvas(ctx, gd, w, h) {
            if (!gd) return;
            const size = gd?._fullLayout?._size;
            if (!size || !Number.isFinite(size.l) || !Number.isFinite(size.t) || !Number.isFinite(size.w) || !Number.isFinite(size.h)) return;

            const currentWidth = Math.max(1, gd.clientWidth || gd.offsetWidth || w || 1);
            const currentHeight = Math.max(1, gd.clientHeight || gd.offsetHeight || h || 1);
            const scaleX = w / currentWidth;
            const scaleY = h / currentHeight;
            const topLeft = size.l * scaleX;
            const topY = size.t * scaleY;
            const topWidth = size.w * scaleX;
            const rightX = (size.l + size.w) * scaleX;
            const rightHeight = size.h * scaleY;
            const dividerWidth = Math.max(1, Math.min(scaleX, scaleY));

            ctx.save();

            const topGradient = ctx.createLinearGradient(topLeft, topY, topLeft + topWidth, topY);
            topGradient.addColorStop(0, 'rgba(148, 163, 184, 0.08)');
            topGradient.addColorStop(0.5, 'rgba(148, 163, 184, 0.34)');
            topGradient.addColorStop(1, 'rgba(148, 163, 184, 0.08)');
            ctx.fillStyle = topGradient;
            ctx.fillRect(topLeft, topY, topWidth, dividerWidth);

            const rightGradient = ctx.createLinearGradient(rightX, topY, rightX, topY + rightHeight);
            rightGradient.addColorStop(0, 'rgba(148, 163, 184, 0.10)');
            rightGradient.addColorStop(0.5, 'rgba(148, 163, 184, 0.42)');
            rightGradient.addColorStop(1, 'rgba(148, 163, 184, 0.10)');
            ctx.fillStyle = rightGradient;
            ctx.fillRect(rightX, topY, dividerWidth, rightHeight);

            ctx.restore();
        }

        async function buildCompositeImageWithMarkers(gd, w, h){
            // Base plot image from Plotly
            const baseDataUrl = await Plotly.toImage(gd, { format:'png', width:w, height:h, scale:1 });
            // If no markers or custom selection overlays exist, return original quickly
            const hasStatsOverlay = buildStatsOverlaySections().length > 0;
            const hasPlotFrameDividers = !!gd?._fullLayout?._size;
            if((!Array.isArray(MARKERS) || MARKERS.length===0) && !hasCustomSelectionOverlay(gd) && !hasStatsOverlay && !hasPlotFrameDividers){
                return baseDataUrl;
            }
            // Create canvas
            const canvas = document.createElement('canvas');
            canvas.width = w; canvas.height = h;
            const ctx = canvas.getContext('2d');
            // Draw base image first
            await new Promise((resolve,reject)=>{
                const img = new Image();
                img.onload=()=>{ ctx.drawImage(img,0,0,w,h); resolve(); };
                img.onerror=reject; img.src=baseDataUrl;
            });
            await drawHistogramPlotFrameDividersToCanvas(ctx, gd, w, h);
            await drawCustomSelectionOverlayToCanvas(ctx, gd, w, h);
            await drawStatsOverlayToCanvas(ctx, gd, w, h);
            // Helper to format numbers like existing labels
            const fmt = v => (typeof v==='number' ? v.toFixed(2) : v);
            // Draw each marker (lines + label box + text)
            for(const m of MARKERS){
                const anchor = dataPointPixels(gd, m.x, m.y);
                if(!anchor) continue;
                // Derive label DOM to measure size & text lines
                const labelDiv = gd.querySelector(`.user-marker[data-marker-id="${m.id}"] .marker-label`);
                // Rebuild text lines (fallback if DOM missing)
                const textLines = [];
                textLines.push(`x: ${fmt(m.x)}`);
                if(typeof m.y==='number') textLines.push(`y: ${fmt(m.y)}`);
                if(typeof m.z==='number') textLines.push(`z: ${fmt(m.z)}`);
                // Position
                const labelLeft = anchor.x + (typeof m.offset_dx==='number'? m.offset_dx : 6);
                const labelTop  = anchor.y + (typeof m.offset_dy==='number'? m.offset_dy : -40);
                // Approximate dimensions (use DOM if present)
                let labelW = 0, labelH = 0;
                if(labelDiv){
                    labelW = labelDiv.offsetWidth;
                    labelH = labelDiv.offsetHeight;
                } else {
                    ctx.font = '11px sans-serif';
                    labelW = Math.max(...textLines.map(t=>ctx.measureText(t).width)) + 12; // padding
                    labelH = textLines.length * 13 + 8; // lineHeight + padding
                }
                const padX = 6, padY = 4, lineHeight = 13;
                // Connector line (to bottom-left corner of label box)
                ctx.strokeStyle = '#ff9800';
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.moveTo(anchor.x, anchor.y);
                ctx.lineTo(labelLeft, labelTop + labelH);
                ctx.stroke();
                // Label background (rounded rectangle)
                const r = 4;
                ctx.beginPath();
                ctx.moveTo(labelLeft + r, labelTop);
                ctx.lineTo(labelLeft + labelW - r, labelTop);
                ctx.quadraticCurveTo(labelLeft + labelW, labelTop, labelLeft + labelW, labelTop + r);
                ctx.lineTo(labelLeft + labelW, labelTop + labelH - r);
                ctx.quadraticCurveTo(labelLeft + labelW, labelTop + labelH, labelLeft + labelW - r, labelTop + labelH);
                ctx.lineTo(labelLeft + r, labelTop + labelH);
                ctx.quadraticCurveTo(labelLeft, labelTop + labelH, labelLeft, labelTop + labelH - r);
                ctx.lineTo(labelLeft, labelTop + r);
                ctx.quadraticCurveTo(labelLeft, labelTop, labelLeft + r, labelTop);
                ctx.closePath();
                ctx.fillStyle = 'rgba(0,0,0,0.75)';
                ctx.fill();
                // Text
                ctx.font = '11px sans-serif';
                ctx.fillStyle = '#ffffff';
                ctx.textBaseline = 'top';
                textLines.forEach((ln,i)=>{
                    ctx.fillText(ln, labelLeft + padX, labelTop + padY + i*lineHeight);
                });
            }
            return canvas.toDataURL('image/png');
        }

        async function exportPlotPNG(gd) {
            if (!gd) return;
            const w = EXPORT_WIDTH || gd._fullLayout.width || 1000;
            const h = EXPORT_HEIGHT || gd._fullLayout.height || 600;
            try {
                const dataUrl = await buildCompositeImageWithMarkers(gd, w, h);
                const a = document.createElement('a');
                a.href = dataUrl;
                a.download = 'histogram.png';
                document.body.appendChild(a); a.click(); a.remove();
            } catch (e) { console.error('PNG export failed', e); }
        }

        // --- Robust dynamic loading for jsPDF / svg2pdf with fallbacks ---
        let _jsPdfPromise = null;
        function ensureJsPdf() {
            if (_jsPdfPromise) return _jsPdfPromise;
            const candidates = [
                'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js',
                'https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js',
                'https://unpkg.com/jspdf@2.5.1/dist/jspdf.umd.min.js'
            ];
            _jsPdfPromise = new Promise((resolve, reject) => {
                let idx = 0;
                const tryNext = () => {
                    if (idx >= candidates.length) { reject(new Error('All jsPDF sources failed')); return; }
                    const src = candidates[idx++];
                    const s = document.createElement('script');
                    s.src = src; s.onload = () => resolve(); s.onerror = tryNext; document.head.appendChild(s);
                }; tryNext();
            });
            return _jsPdfPromise;
        }

        let _svg2pdfPromise = null;
        function ensureSvg2Pdf() {
            if (_svg2pdfPromise) return _svg2pdfPromise;
            const candidates = [
                'https://cdnjs.cloudflare.com/ajax/libs/svg2pdf.js/2.2.1/svg2pdf.min.js',
                'https://cdn.jsdelivr.net/npm/svg2pdf.js@2.2.1/dist/svg2pdf.min.js',
                'https://unpkg.com/svg2pdf.js@2.2.1/dist/svg2pdf.min.js'
            ];
            _svg2pdfPromise = new Promise((resolve, reject) => {
                let idx = 0;
                const tryNext = () => {
                    if (idx >= candidates.length) { reject(new Error('All svg2pdf sources failed')); return; }
                    const src = candidates[idx++];
                    const s = document.createElement('script');
                    s.src = src; s.onload = () => resolve(); s.onerror = tryNext; document.head.appendChild(s);
                }; tryNext();
            });
            return _svg2pdfPromise;
        }

        async function exportPlotPDF(gd) {
            if (!gd) return;
            try { await ensureJsPdf(); } catch (e) { alert('jsPDF failed to load: ' + e.message); return; }
            const wPx = EXPORT_WIDTH || gd._fullLayout.width || 1000;
            const hPx = EXPORT_HEIGHT || gd._fullLayout.height || 600;
            const pxToPt = 0.75; // 1px ≈ 0.75pt
            const wPt = wPx * pxToPt;
            const hPt = hPx * pxToPt;
            const { jsPDF } = window.jspdf || {};
            if (!jsPDF) { alert('jsPDF not available after load'); return; }
            const pdf = new jsPDF({ orientation: wPx >= hPx ? 'landscape' : 'portrait', unit: 'pt', format: [wPt, hPt] });
            try {
                const composite = await buildCompositeImageWithMarkers(gd, wPx, hPx);
                pdf.addImage(composite, 'PNG', 0, 0, wPt, hPt);
            } catch(e){
                alert('PDF generation failed: '+ e.message);
                return;
            }
            pdf.save('histogram.pdf');
        }

        function renderHistogramToolbarActions(gd) {
            const leadingContainer = document.getElementById('hist-toolbar-tools-leading');
            const trailingContainer = document.getElementById('hist-toolbar-tools-trailing');
            if (!(leadingContainer && trailingContainer)) return 0;
            leadingContainer.innerHTML = '';
            trailingContainer.innerHTML = '';
            let missingActionCount = 0;

            HISTOGRAM_TOOLBAR_SECTIONS.forEach((section) => {
                const sectionEl = document.createElement('section');
                sectionEl.className = 'hist-tool-section';

                const labelEl = document.createElement('div');
                labelEl.className = 'hist-tool-section-label';
                labelEl.textContent = section.label;

                const buttonsEl = document.createElement('div');
                buttonsEl.className = 'hist-tool-section-buttons';

                section.actions.forEach((action) => {
                    const sourceButton = findModebarButton(gd, action.modebarLabel);

                    const button = document.createElement('button');
                    button.type = 'button';
                    button.className = 'hist-tool-btn';
                    button.dataset.modebarLabel = action.modebarLabel;
                    const title = String(sourceButton?.getAttribute('title') || sourceButton?.getAttribute('aria-label') || action.label).trim();
                    button.title = title;
                    button.setAttribute('aria-label', title);
                    const iconWrap = document.createElement('span');
                    iconWrap.className = 'hist-tool-btn-icon';
                    if (!sourceButton) {
                        missingActionCount += 1;
                        button.classList.add('is-placeholder');
                        button.disabled = true;
                    } else if (action.modebarLabel === 'zoom') {
                        iconWrap.appendChild(buildToolbarLensIcon());
                    } else {
                        const sourceSvg = sourceButton.querySelector('svg');
                        if (sourceSvg) iconWrap.appendChild(sourceSvg.cloneNode(true));
                    }
                    button.appendChild(iconWrap);
                    if (sourceButton) {
                        button.addEventListener('click', (event) => {
                            event.preventDefault();
                            sourceButton.click();
                            requestAnimationFrame(() => syncHistogramToolbarButtons(gd));
                        });
                    }
                    buttonsEl.appendChild(button);
                });

                sectionEl.appendChild(labelEl);
                sectionEl.appendChild(buttonsEl);
                const targetContainer = section.placement === 'before-plot' ? leadingContainer : trailingContainer;
                targetContainer.appendChild(sectionEl);
            });

            if (gd) syncHistogramToolbarButtons(gd);
            return missingActionCount;
        }

                swapNumericInputValues('xMax', 'yMax');
                swapCheckboxValues('logX', 'logY');
                swapNumericInputValues('binsX', 'binsY');
                [LAST_X_RANGE, LAST_Y_RANGE] = [LAST_Y_RANGE, LAST_X_RANGE];
                swapHistogramUiTextSetting('xLabelText', 'yLabelText');
                rememberFeatureSelectionPreference('x', xSel.value);
                rememberFeatureSelectionPreference('y', ySel.value);
            } else {
                if (orientation) orientation.value = orientation.value === 'h' ? 'v' : 'h';
                swapNumericInputValues('xMin', 'yMin');
                swapNumericInputValues('xMax', 'yMax');
                swapCheckboxValues('logX', 'logY');
                [LAST_X_RANGE, LAST_Y_RANGE] = [LAST_Y_RANGE, LAST_X_RANGE];
                swapHistogramUiTextSetting('xLabelText', 'yLabelText');
            }

            saveHistogramPlotUiState();
            syncFeatureRowVisibility(mode);
            requestAnimationFrame(syncFeatureSelectWidths);

            const xKey = document.getElementById('axis-x')?.value || 'X';
            const yKey = document.getElementById('axis-y')?.value || 'Y';
            const phaseShiftRow = document.getElementById('phase-shift-row');
            if (phaseShiftRow) {
                const showPhaseShift = isPhaseShiftableKey(xKey) || (mode === '2d' && isPhaseShiftableKey(yKey));
                phaseShiftRow.style.display = showPhaseShift ? 'grid' : 'none';
            }

            await rerenderHistogramFromUpdate({ preserveRanges: false, captureRanges: false });
            await applyHistogramAutofit(gd || document.getElementById('histogram-plot'));
            flashStatus(gd || document.getElementById('histogram-plot'), mode === '2d' ? 'Axes swapped' : 'Orientation swapped');
            scheduleHistogramHistoryCommit();
        }

        function expandAxisBounds(minValue, maxValue, isLog = false) {
            if (!(Number.isFinite(minValue) && Number.isFinite(maxValue))) return null;
            if (isLog) {
                if (!(minValue > 0 && maxValue > 0)) return null;
                if (minValue === maxValue) return [Math.log10(minValue / 1.25), Math.log10(maxValue * 1.25)];
                return [Math.log10(minValue / 1.08), Math.log10(maxValue * 1.08)];
            }
            if (minValue === maxValue) {
                const pad = Math.abs(minValue || 1) * 0.08 || 1;
                return [minValue - pad, maxValue + pad];
            }
            const span = maxValue - minValue;
            const pad = span * 0.04;
            return [minValue - pad, maxValue + pad];
        }

        function collectTraceBounds(values, axisType = 'linear') {
            if (!Array.isArray(values) || !values.length) return null;
            let minValue = Infinity;
            let maxValue = -Infinity;
            for (const raw of values) {
                const value = Number(raw);
                if (!Number.isFinite(value)) continue;
                if (axisType === 'log' && value <= 0) continue;
                if (value < minValue) minValue = value;
                if (value > maxValue) maxValue = value;
            }
            if (!Number.isFinite(minValue) || !Number.isFinite(maxValue)) return null;
            return [minValue, maxValue];
        }

        function mergeBounds(currentBounds, nextBounds) {
            if (!nextBounds) return currentBounds;
            if (!currentBounds) return nextBounds.slice();
            return [Math.min(currentBounds[0], nextBounds[0]), Math.max(currentBounds[1], nextBounds[1])];
        }

        function getHistogramAutofitBounds(gd) {
            const full = gd?._fullLayout;
            if (!full || !Array.isArray(gd?.data)) return null;
            const xAxisType = full.xaxis?.type || 'linear';
            const yAxisType = full.yaxis?.type || 'linear';
            let xBounds = null;
            let yBounds = null;

            for (const trace of gd.data) {
                if (!trace || trace._selectionProxy || trace._markerTrace || trace._autofitExclude) continue;

                if (trace.xbins && Number.isFinite(Number(trace.xbins.start)) && Number.isFinite(Number(trace.xbins.end))) {
                    const start = Number(trace.xbins.start);
                    const end = Number(trace.xbins.end);
                    const next = axisTypeIsUsable(start, end, xAxisType);
                    xBounds = mergeBounds(xBounds, next);
                } else {
                    xBounds = mergeBounds(xBounds, collectTraceBounds(trace.x, xAxisType));
                }

                if (trace.ybins && Number.isFinite(Number(trace.ybins.start)) && Number.isFinite(Number(trace.ybins.end))) {
                    const start = Number(trace.ybins.start);
                    const end = Number(trace.ybins.end);
                    const next = axisTypeIsUsable(start, end, yAxisType);
                    yBounds = mergeBounds(yBounds, next);
                } else {
                    yBounds = mergeBounds(yBounds, collectTraceBounds(trace.y, yAxisType));
                }
            }

            return { x: xBounds, y: yBounds, xAxisType, yAxisType };
        }

        function axisTypeIsUsable(start, end, axisType) {
            if (!(Number.isFinite(start) && Number.isFinite(end))) return null;
            if (axisType === 'log' && (!(start > 0) || !(end > 0))) return null;
            return [Math.min(start, end), Math.max(start, end)];
        }

        async function applyHistogramAutofit(gd, options = {}) {
            if (!gd || !window.Plotly) return;
            const bounds = getHistogramAutofitBounds(gd);
            if (!bounds) return;

            const fitX = options.fitX !== false;
            const fitY = options.fitY !== false;

            if (fitX) LAST_X_RANGE = null;
            if (fitY) LAST_Y_RANGE = null;

            const xRange = bounds.x ? expandAxisBounds(bounds.x[0], bounds.x[1], bounds.xAxisType === 'log') : null;
            const yRange = bounds.y ? expandAxisBounds(bounds.y[0], bounds.y[1], bounds.yAxisType === 'log') : null;
            const updates = {};

            if (fitX) {
                if (xRange) updates['xaxis.range'] = xRange;
                else updates['xaxis.autorange'] = true;
            }

            if (fitY) {
                if (yRange) updates['yaxis.range'] = yRange;
                else updates['yaxis.autorange'] = true;
            }

            const bgTraceIndex = gd.data.findIndex((trace) => trace && trace._autofitExclude);
            if (bgTraceIndex >= 0 && bounds.x && bounds.y && (fitX || fitY)) {
                await Plotly.restyle(gd, {
                    x: [[fitX ? bounds.x[0] : gd._fullLayout?.xaxis?.range?.[0], fitX ? bounds.x[1] : gd._fullLayout?.xaxis?.range?.[1]]],
                    y: [[fitY ? bounds.y[0] : gd._fullLayout?.yaxis?.range?.[0], fitY ? bounds.y[1] : gd._fullLayout?.yaxis?.range?.[1]]],
                    z: [[[0, 0], [0, 0]]],
                }, [bgTraceIndex]);
            }

            if (!Object.keys(updates).length) return;
            await Plotly.relayout(gd, updates);
            requestAnimationFrame(() => centerPlot(gd));
            flashStatus(gd, 'Autofit applied');
        }

        function deactivateActiveInteractionTool(gd, options = {}) {
            if (!gd || !(ELLIPSE_SELECTION_MODE || MARKER_MODE || PROJECTION_MODE)) return false;
            MARKER_MODE = false;
            setProjectionMode(gd, false, { silent: true });
            setEllipseSelectionMode(gd, false, { silent: true });
            gd.style.cursor = '';
            syncActiveToolChrome(gd);
            if (!options.silent) flashStatus(gd, 'Interaction tool: OFF');
            return true;
        }

        function toggleMarkerMode(gd){
            if (!gd) return;
            if (!MARKER_MODE) {
                setEllipseSelectionMode(gd, false, { silent: true });
                setProjectionMode(gd, false, { silent: true });
            }
            MARKER_MODE = !MARKER_MODE;
            if (MARKER_MODE) setNativeDragMode(gd, false);
            gd.style.cursor = MARKER_MODE ? 'crosshair' : '';
            syncActiveToolChrome(gd);
            flashStatus(gd, MARKER_MODE ? 'Marker mode: ON' : 'Marker mode: OFF');
        }

        function flashStatus(gd, msg){
            let box = gd.querySelector('.marker-status');
            if(!box){
                box = document.createElement('div');
                box.className='marker-status';
                Object.assign(box.style,{position:'absolute',top:'6px',left:'50%',transform:'translateX(-50%)',background:'rgba(0,0,0,0.55)',color:'#fff',padding:'2px 8px',fontSize:'12px',borderRadius:'4px',zIndex:70,pointerEvents:'none'});
                gd.appendChild(box);
            }
            box.textContent=msg;
            box.style.opacity='1';
            setTimeout(()=>{box.style.transition='opacity 0.6s';box.style.opacity='0';},600);
        }

        function histogramHoverTemplate(orientation, histnorm){
            const valueField = orientation === 'h' ? '%{y}' : '%{x}';
            const measureField = orientation === 'h' ? '%{x}' : '%{y}';
            const measureLabel = histnorm ? histnorm : 'Count';
            return `Value: ${valueField}<br>${measureLabel}: ${measureField}<extra></extra>`;
        }

        function histogram2dHoverTemplate(){
            return 'X: %{x}<br>Y: %{y}<br>Bin: %{z}<extra></extra>';
        }

        function addMarker(gd,x,y,z){
            MARKERS.push({x,y,z,id:++MARKER_ID_SEQ});
            redrawMarkers(gd);
        }

        function removeMarker(gd,id){
            MARKERS = MARKERS.filter(m=>m.id!==id);
            redrawMarkers(gd);
        }

        function redrawMarkers(gd){
            // Clear existing HTML markers and lines
            gd.querySelectorAll('.user-marker').forEach(n=>n.remove());
            let svg = gd.querySelector('#marker-svg');
            if(!svg){
                svg = document.createElementNS('http://www.w3.org/2000/svg','svg');
                svg.setAttribute('id','marker-svg');
                Object.assign(svg.style,{position:'absolute',left:0,top:0,width:'100%',height:'100%',pointerEvents:'none',zIndex:55});
                gd.appendChild(svg);
            }
            svg.querySelectorAll('line').forEach(l=>l.remove());
            const scatterX=[], scatterY=[];
            for(const m of MARKERS){
                scatterX.push(m.x); scatterY.push(m.y);
                const div=document.createElement('div');
                div.className='user-marker';
                div.dataset.markerId = m.id;
                Object.assign(div.style,{position:'absolute',zIndex:60,fontFamily:'sans-serif',pointerEvents:'auto'});
                const label=document.createElement('div');
                label.className='marker-label';
                Object.assign(label.style,{background:'rgba(0,0,0,0.75)',color:'#fff',padding:'4px 6px 4px 6px',fontSize:'11px',lineHeight:'1.2',borderRadius:'4px',position:'relative',boxShadow:'0 2px 4px rgba(0,0,0,0.3)',pointerEvents:'auto',whiteSpace:'nowrap',cursor:'move'});
                const fmt=v=> (typeof v==='number' ? v.toFixed(2) : v);
                let lines = [`x: ${fmt(m.x)}`];
                if(typeof m.y !== 'undefined' && m.y !== null) lines.push(`y: ${fmt(m.y)}`);
                if(typeof m.z !== 'undefined' && m.z !== null) lines.push(`z: ${fmt(m.z)}`);
                label.innerHTML = lines.map(l=>`<div>${l}</div>`).join('');
                const cross=document.createElement('div');
                cross.textContent='×';
                cross.className='marker-close';
                Object.assign(cross.style,{position:'absolute',top:'2px',right:'2px',cursor:'pointer',background:'#fff',border:'1px solid #666',borderRadius:'50%',width:'16px',height:'16px',fontSize:'12px',display:'flex',alignItems:'center',justifyContent:'center',color:'#333',boxShadow:'0 1px 3px rgba(0,0,0,0.4)'});
                cross.title='Delete marker';
                cross.onclick=(e)=>{e.stopPropagation(); removeMarker(gd,m.id);};
                div.appendChild(label); div.appendChild(cross);
                gd.appendChild(div);
                const anchor=dataPointPixels(gd,m.x,m.y);
                if(!anchor) continue;
                if(typeof m.offset_dx !== 'number' || typeof m.offset_dy !== 'number'){
                    // temporary position to measure
                    div.style.left = anchor.x + 'px';
                    div.style.top  = anchor.y + 'px';
                    const h = div.offsetHeight;
                    m.offset_dx = 6; m.offset_dy = -h - 6;
                }
                div.style.left = (anchor.x + m.offset_dx) + 'px';
                div.style.top  = (anchor.y + m.offset_dy) + 'px';
                drawMarkerLine(svg,m,anchor,div);
                enableMarkerDrag(gd,div,m,svg);
            }
            const traceIndex = (gd.data||[]).findIndex(t=>t && t._markerTrace);
            const markerTrace = { x: scatterX, y: scatterY, mode:'markers', type:'scatter', marker:{color:'#ff9800', size:8, line:{color:'#fff',width:1}}, name:'markers', _markerTrace:true, hoverinfo:'skip' };
            if(traceIndex>=0){
                Plotly.restyle(gd,{x:[markerTrace.x],y:[markerTrace.y]},[traceIndex]);
            } else if (scatterX.length){
                Plotly.addTraces(gd,[markerTrace]);
            }
            if(!scatterX.length && traceIndex>=0){
                Plotly.deleteTraces(gd,[traceIndex]);
            }
        }

        function dataPointPixels(gd,x,y){
            const full=gd._fullLayout; if(!full) return null;
            const xa=full.xaxis, ya=full.yaxis; if(!(xa&&ya)) return null;
            return {x: xa.l2p(x)+xa._offset, y: ya.l2p(y)+ya._offset};
        }

        function drawMarkerLine(svg, marker, anchor, div){
            const line = document.createElementNS('http://www.w3.org/2000/svg','line');
            const lblBLX = parseFloat(div.style.left);
            const lblBLY = parseFloat(div.style.top) + div.offsetHeight;
            line.setAttribute('x1', anchor.x);
            line.setAttribute('y1', anchor.y);
            line.setAttribute('x2', lblBLX);
            line.setAttribute('y2', lblBLY);
            line.setAttribute('stroke','#ff9800');
            line.setAttribute('stroke-width','1.5');
            line.setAttribute('stroke-linecap','round');
            line.setAttribute('data-marker-id', marker.id);
            svg.appendChild(line);
        }

        function updateMarkerPositionAndLine(gd, marker){
            const div = gd.querySelector(`.user-marker[data-marker-id="${marker.id}"]`);
            const svg = gd.querySelector('#marker-svg');
            if(!div||!svg) return;
            const anchor = dataPointPixels(gd, marker.x, marker.y); if(!anchor) return;
            div.style.left = (anchor.x + marker.offset_dx)+'px';
            div.style.top  = (anchor.y + marker.offset_dy)+'px';
            const line = svg.querySelector(`line[data-marker-id="${marker.id}"]`);
            if(line){
                const lblBLX = parseFloat(div.style.left);
                const lblBLY = parseFloat(div.style.top) + div.offsetHeight;
                line.setAttribute('x1', anchor.x); line.setAttribute('y1', anchor.y);
                line.setAttribute('x2', lblBLX);  line.setAttribute('y2', lblBLY);
            }
        }

        function enableMarkerDrag(gd, div, marker, svg){
            const label = div.querySelector('.marker-label');
            const cross = div.querySelector('.marker-close');
            if(!label) return;
            let dragging=false,startX=0,startY=0,startLeft=0,startTop=0;
            function onMouseDown(e){
                if(e.target===cross) return;
                dragging=true;
                startX=e.clientX; startY=e.clientY;
                startLeft=parseFloat(div.style.left); startTop=parseFloat(div.style.top);
                document.addEventListener('mousemove',onMouseMove);
                document.addEventListener('mouseup',onMouseUp);
                e.preventDefault();
            }
            function onMouseMove(e){
                if(!dragging) return;
                const dx=e.clientX-startX, dy=e.clientY-startY;
                const newLeft=startLeft+dx, newTop=startTop+dy;
                div.style.left=newLeft+'px'; div.style.top=newTop+'px';
                const anchor=dataPointPixels(gd,marker.x,marker.y); if(!anchor) return;
                marker.offset_dx=newLeft-anchor.x; marker.offset_dy=newTop-anchor.y;
                const line = svg.querySelector(`line[data-marker-id="${marker.id}"]`);
                if(line){
                    const lblBLX=newLeft; const lblBLY=newTop+div.offsetHeight;
                    line.setAttribute('x2',lblBLX); line.setAttribute('y2',lblBLY);
                }
            }
            function onMouseUp(){
                dragging=false;
                document.removeEventListener('mousemove',onMouseMove);
                document.removeEventListener('mouseup',onMouseUp);
            }
            label.addEventListener('mousedown',onMouseDown);
        }

        function bindMarkerInteractions(gd){
            /* Rebind every render (Plotly.newPlot replaces internal emitter) */
            if(gd.__markerClickHandler){
                gd.removeListener('plotly_click', gd.__markerClickHandler);
            }
            if(gd.__markerRelayoutHandler){
                gd.removeListener('plotly_relayout', gd.__markerRelayoutHandler);
            }
            const clickHandler = ev => {
                if(!MARKER_MODE) return;
                if(!(ev && ev.points && ev.points.length)) return;
                const p=ev.points[0];
                addMarker(gd,p.x,p.y, typeof p.z !== 'undefined' ? p.z : undefined);
            };
            const relayoutHandler = ()=>{
                for(const m of MARKERS){
                    updateMarkerPositionAndLine(gd,m);
                }
            };
            gd.on('plotly_click', clickHandler);
            gd.on('plotly_relayout', relayoutHandler);
            gd.__markerClickHandler = clickHandler;
            gd.__markerRelayoutHandler = relayoutHandler;
        }

        function getSelectionOutlineSvg(gd) {
            if (!gd) return null;
            syncHistogramSelectionTheme(gd);
            let svg = gd.querySelector('#selection-outline-svg');
            if (!svg) {
                svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
                svg.setAttribute('id', 'selection-outline-svg');
                Object.assign(svg.style, {
                    position: 'absolute',
                    left: 0,
                    top: 0,
                    width: '100%',
                    height: '100%',
                    pointerEvents: 'none',
                    zIndex: 54,
                });
                gd.appendChild(svg);
            }
            return svg;
        }

        function clearSelectionOutline(gd) {
            const svg = gd?.querySelector('#selection-outline-svg');
            if (svg) svg.innerHTML = '';
        }

        function syncHistogramSelectionTheme(gd) {
            if (!gd) return;
            gd.style.setProperty('--hist-selection-stroke', HISTOGRAM_SELECTION_THEME.strokeHex);
            gd.style.setProperty('--hist-selection-fill', `rgba(${HISTOGRAM_SELECTION_THEME.strokeRgb}, ${HISTOGRAM_SELECTION_THEME.fillOpacity})`);
            gd.style.setProperty('--hist-selection-stroke-width', `${HISTOGRAM_SELECTION_THEME.strokeWidth}px`);
            gd.style.setProperty('--hist-selection-dash', HISTOGRAM_SELECTION_THEME.dash);
        }

        function getHistogramSelectionPlaceholder(mode = document.querySelector('input[name="hist-type"]:checked')?.value || '1d') {
            return mode === '2d'
                ? 'Use lasso/select/ellipse on the 2D plot to inspect a subset.'
                : 'Selection statistics are available for 2D lasso/select/ellipse.';
        }

        function getHistogramSelectionTraceIndexes(gd) {
            if (!gd || !Array.isArray(gd.data)) return [];
            return (gd.data || [])
                .map((trace, index) => (trace && trace._selectionProxy) ? index : -1)
                .filter((index) => index >= 0);
        }

        function cloneActiveHistogramSelection(selection) {
            if (!selection || typeof selection !== 'object') return null;
            return JSON.parse(JSON.stringify(selection));
        }

        function setActiveHistogramSelection(gd, selection) {
            if (!gd) return;
            gd.__histActiveSelection = cloneActiveHistogramSelection(selection);
        }

        function getActiveHistogramSelection(gd) {
            return gd?.__histActiveSelection || null;
        }

        function pointInPolygon(point, polygon) {
            if (!(point && Array.isArray(polygon) && polygon.length >= 3)) return false;
            let inside = false;
            for (let i = 0, j = polygon.length - 1; i < polygon.length; j = i++) {
                const xi = polygon[i][0];
                const yi = polygon[i][1];
                const xj = polygon[j][0];
                const yj = polygon[j][1];
                const intersects = ((yi > point.y) !== (yj > point.y))
                    && (point.x < ((xj - xi) * (point.y - yi)) / ((yj - yi) || Number.EPSILON) + xi);
                if (intersects) inside = !inside;
            }
            return inside;
        }

        function isPointInsideActiveHistogramSelection(gd, point) {
            const selection = getActiveHistogramSelection(gd);
            const full = gd?._fullLayout;
            const xa = full?.xaxis;
            const ya = full?.yaxis;
            if (!(selection && point && xa && ya)) return false;

            if (selection.type === 'ellipse') {
                const ellipse = selection.ellipse;
                if (!(ellipse && ellipse.rx > 0 && ellipse.ry > 0)) return false;
                const dx = (point.x - ellipse.cx) / ellipse.rx;
                const dy = (point.y - ellipse.cy) / ellipse.ry;
                return ((dx * dx) + (dy * dy)) <= 1;
            }

            if (selection.type === 'range') {
                const xr = selection.range?.x;
                const yr = selection.range?.y;
                if (!(Array.isArray(xr) && xr.length === 2 && Array.isArray(yr) && yr.length === 2)) return false;
                const x0 = xa.l2p(xr[0]) + xa._offset;
                const x1 = xa.l2p(xr[1]) + xa._offset;
                const y0 = ya.l2p(yr[0]) + ya._offset;
                const y1 = ya.l2p(yr[1]) + ya._offset;
                if (![x0, x1, y0, y1].every(Number.isFinite)) return false;
                return point.x >= Math.min(x0, x1) && point.x <= Math.max(x0, x1)
                    && point.y >= Math.min(y0, y1) && point.y <= Math.max(y0, y1);
            }

            if (selection.type === 'lasso') {
                const xs = selection.lassoPoints?.x;
                const ys = selection.lassoPoints?.y;
                if (!(Array.isArray(xs) && Array.isArray(ys) && xs.length === ys.length && xs.length >= 3)) return false;
                const polygon = [];
                for (let i = 0; i < xs.length; i++) {
                    const px = xa.l2p(xs[i]) + xa._offset;
                    const py = ya.l2p(ys[i]) + ya._offset;
                    if (!Number.isFinite(px) || !Number.isFinite(py)) return false;
                    polygon.push([px, py]);
                }
                return pointInPolygon(point, polygon);
            }

            return false;
        }

        function clearHistogramSelectionState(gd, options = {}) {
            if (!gd) return;
            ACTIVE_ELLIPSE_SELECTION = null;
            ACTIVE_ELLIPSE_HANDLES_VISIBLE = false;
            setActiveHistogramSelection(gd, null);
            clearSelectionOutline(gd);
            clearSelectionProjection();
            if (options.syncPlotly !== false && window.Plotly) {
                const selectionTraceIndexes = getHistogramSelectionTraceIndexes(gd);
                if (selectionTraceIndexes.length) {
                    try { Plotly.restyle(gd, { selectedpoints: null }, selectionTraceIndexes); } catch (_) {}
                }
                try {
                    Plotly.relayout(gd, {
                        selections: [],
                        'activeselection.fillcolor': 'rgba(0,0,0,0)',
                    });
                } catch (_) {}
            }
            if (options.clearMeta !== false) {
                setHistogramSelectionMeta(null, options.selectionPlaceholder || getHistogramSelectionPlaceholder());
            }
            if (options.scheduleHistory) scheduleHistogramHistoryCommit(options.historyDelay || 180);
        }

        function computeHistogram2DGrid(xs, ys, binsX, binsY, xRange, yRange) {
            if (!Array.isArray(xs) || !Array.isArray(ys) || !xs.length || xs.length !== ys.length) return null;
            const x0 = Number(xRange?.[0]);
            const x1 = Number(xRange?.[1]);
            const y0 = Number(yRange?.[0]);
            const y1 = Number(yRange?.[1]);
            if (![x0, x1, y0, y1].every(Number.isFinite) || x1 === x0 || y1 === y0) return null;

            const xStep = (x1 - x0) / Math.max(1, binsX);
            const yStep = (y1 - y0) / Math.max(1, binsY);
            const matrix = Array.from({ length: binsY }, () => Array.from({ length: binsX }, () => 0));
            const xEdges = Array.from({ length: binsX + 1 }, (_, idx) => x0 + idx * xStep);
            const yEdges = Array.from({ length: binsY + 1 }, (_, idx) => y0 + idx * yStep);
            const xCenters = Array.from({ length: binsX }, (_, idx) => x0 + (idx + 0.5) * xStep);
            const yCenters = Array.from({ length: binsY }, (_, idx) => y0 + (idx + 0.5) * yStep);

            for (let i = 0; i < xs.length; i++) {
                const xv = Number(xs[i]);
                const yv = Number(ys[i]);
                if (!Number.isFinite(xv) || !Number.isFinite(yv)) continue;
                if (xv < x0 || xv > x1 || yv < y0 || yv > y1) continue;
                let xi = Math.floor((xv - x0) / xStep);
                let yi = Math.floor((yv - y0) / yStep);
                if (xi === binsX) xi = binsX - 1;
                if (yi === binsY) yi = binsY - 1;
                if (xi < 0 || xi >= binsX || yi < 0 || yi >= binsY) continue;
                matrix[yi][xi] += 1;
            }

            return { matrix, xEdges, yEdges, xCenters, yCenters, binsX, binsY };
        }

        function getProjectionGrid(gd) {
            return gd?.__projectionGrid || null;
        }

        function getBinIndex(value, edges) {
            if (!Array.isArray(edges) || edges.length < 2 || !Number.isFinite(value)) return -1;
            const last = edges.length - 2;
            if (value < edges[0] || value > edges[edges.length - 1]) return -1;
            for (let idx = 0; idx <= last; idx++) {
                const lo = edges[idx];
                const hi = edges[idx + 1];
                const inBin = idx === last ? (value >= lo && value <= hi) : (value >= lo && value < hi);
                if (inBin) return idx;
            }
            return -1;
        }

        function pointToProjectionBins(gd, point) {
            const bounds = getPlotAreaBounds(gd);
            const grid = getProjectionGrid(gd);
            if (!(bounds && grid && point)) return null;
            const localX = point.x - bounds.xa._offset;
            const localY = point.y - bounds.ya._offset;
            const xValue = bounds.xa.p2l(localX);
            const yValue = bounds.ya.p2l(localY);
            const xIndex = getBinIndex(xValue, grid.xEdges);
            const yIndex = getBinIndex(yValue, grid.yEdges);
            if (xIndex < 0 || yIndex < 0) return null;
            return { xIndex, yIndex };
        }

        function getVisibleProjectionRange(gd, axisName, edges) {
            const axis = gd?._fullLayout?.[axisName];
            if (!axis || !Array.isArray(edges) || edges.length < 2) return null;
            const rawRange = Array.isArray(axis.range) && axis.range.length === 2
                ? axis.range.map((value) => Number(value))
                : null;
            const edgeMin = Number(edges[0]);
            const edgeMax = Number(edges[edges.length - 1]);
            if (!Number.isFinite(edgeMin) || !Number.isFinite(edgeMax)) return null;
            if (!rawRange || !rawRange.every(Number.isFinite)) {
                return { min: edgeMin, max: edgeMax };
            }
            const min = Math.max(edgeMin, Math.min(rawRange[0], rawRange[1]));
            const max = Math.min(edgeMax, Math.max(rawRange[0], rawRange[1]));
            if (!Number.isFinite(min) || !Number.isFinite(max) || max <= min) return null;
            return { min, max };
        }

        function getVisibleProjectionBinWindow(edges, visibleRange) {
            if (!Array.isArray(edges) || edges.length < 2 || !visibleRange) return null;
            let startIndex = -1;
            let endIndex = -1;
            for (let idx = 0; idx < edges.length - 1; idx++) {
                const lo = Number(edges[idx]);
                const hi = Number(edges[idx + 1]);
                if (!Number.isFinite(lo) || !Number.isFinite(hi)) continue;
                const overlaps = hi > visibleRange.min && lo < visibleRange.max;
                if (!overlaps) continue;
                if (startIndex < 0) startIndex = idx;
                endIndex = idx;
            }
            if (startIndex < 0 || endIndex < 0) return null;
            return {
                startIndex,
                endIndex,
                range: [visibleRange.min, visibleRange.max],
            };
        }

        function buildProjectionState(gd, axis, startIndex, endIndex) {
            const grid = getProjectionGrid(gd);
            const context = gd?.__histSelectionContext || {};
            if (!grid || context.mode !== '2d') return null;
            const visibleXRange = getVisibleProjectionRange(gd, 'xaxis', grid.xEdges);
            const visibleYRange = getVisibleProjectionRange(gd, 'yaxis', grid.yEdges);
            const visibleXWindow = getVisibleProjectionBinWindow(grid.xEdges, visibleXRange);
            const visibleYWindow = getVisibleProjectionBinWindow(grid.yEdges, visibleYRange);
            if (!visibleXWindow || !visibleYWindow) return null;

            const lo = Math.max(0, Math.min(startIndex, endIndex));
            const hi = Math.max(startIndex, endIndex);

            if (axis === 'column') {
                const loClamped = Math.max(visibleXWindow.startIndex, lo);
                const hiClamped = Math.min(visibleXWindow.endIndex, hi);
                if (hiClamped < loClamped) return null;
                const counts = [];
                const centers = [];
                for (let yi = visibleYWindow.startIndex; yi <= visibleYWindow.endIndex; yi++) {
                    let total = 0;
                    for (let xi = loClamped; xi <= hiClamped; xi++) total += grid.matrix[yi][xi] || 0;
                    counts.push(total);
                    centers.push(grid.yCenters[yi]);
                }
                return {
                    axis,
                    startIndex: loClamped,
                    endIndex: hiClamped,
                    counts,
                    centers,
                    xKey: context.xKey,
                    yKey: context.yKey,
                    highlightRange: {
                        x: [grid.xEdges[loClamped], grid.xEdges[hiClamped + 1]],
                        y: visibleYWindow.range,
                    },
                };
            }

            const loClamped = Math.max(visibleYWindow.startIndex, lo);
            const hiClamped = Math.min(visibleYWindow.endIndex, hi);
            if (hiClamped < loClamped) return null;
            const counts = [];
            const centers = [];
            for (let xi = visibleXWindow.startIndex; xi <= visibleXWindow.endIndex; xi++) {
                let total = 0;
                for (let yi = loClamped; yi <= hiClamped; yi++) total += grid.matrix[yi][xi] || 0;
                counts.push(total);
                centers.push(grid.xCenters[xi]);
            }
            return {
                axis,
                startIndex: loClamped,
                endIndex: hiClamped,
                counts,
                centers,
                xKey: context.xKey,
                yKey: context.yKey,
                highlightRange: {
                    x: visibleXWindow.range,
                    y: [grid.yEdges[loClamped], grid.yEdges[hiClamped + 1]],

            };

        function previewProjectionSelection(gd, axis, startIndex, endIndex) {
            const state = buildProjectionState(gd, axis, startIndex, endIndex);

        function getProjectionSelectionLayer(gd) {
            if (!gd) return null;

                Object.assign(layer.style, {
                    position: 'absolute',
                    inset: 0,
                    zIndex: 55,
                    display: 'none',
                    pointerEvents: 'none',
                    cursor: 'crosshair',
                    background: 'transparent',

            }
            if (!layer.dataset.bound) {
                let dragState = null;
                let lastPoint = null;
                let hoverAxis = 'column';
                const toLocalPoint = (event) => {
                    const rect = gd.getBoundingClientRect();

                    const dominanceRatio = 1.45;

                        return 'row';

                    if (absDy >= switchThresholdPx && absDy >= absDx * dominanceRatio) return 'row';
                    return 'column';

                    if (!PROJECTION_MODE || PROJECTION_LOCKED) return;

                        if (!bins) return;

                        const dy = point.y - dragState.startPoint.y;
                        dragState.moved = dragState.moved || Math.abs(dx) > 4 || Math.abs(dy) > 4;
                        dragState.axis = axisFromDelta(dx, dy, dragState.axis);

                        const startIndex = dragState.axis === 'column' ? dragState.startXIndex : dragState.startYIndex;

                    const dx = point.x - dragState.startPoint.x;
                    const dy = point.y - dragState.startPoint.y;
                    const moved = dragState.moved || Math.abs(dx) > 4 || Math.abs(dy) > 4;
                    if (!moved) {
                        if (PROJECTION_LOCKED) {
                            setProjectionLocked(false);
                            dragState = null;
                            return;
                        }
                        const axis = LAST_PROJECTION_STATE?.axis || hoverAxis;
                        const index = axis === 'column' ? bins.xIndex : bins.yIndex;
                        previewProjectionSelection(gd, axis, index, index);
                        setProjectionLocked(true);
                        dragState = null;
                        return;
                    }
                    const axis = Math.abs(dy) > Math.abs(dx) ? 'row' : 'column';
                    const startIndex = axis === 'column' ? dragState.startXIndex : dragState.startYIndex;
                    const endIndex = axis === 'column' ? bins.xIndex : bins.yIndex;
                    previewProjectionSelection(gd, axis, startIndex, endIndex);
                    setProjectionLocked(true);
                    dragState = null;
                }, true);
                layer.dataset.bound = '1';
            }
            return layer;
        }

        function setProjectionMode(gd, enabled, options = {}) {

                return;
            }
            PROJECTION_MODE = !!enabled;
            const layer = getProjectionSelectionLayer(gd);
            if (layer) {
                layer.style.display = PROJECTION_MODE ? 'block' : 'none';

            if (PROJECTION_MODE) {

                clearHistogramProjection();

        }

        function toggleProjectionMode(gd) {
            if (!gd) return;
            if (!PROJECTION_MODE) {

                MARKER_MODE = false;
            }
            setProjectionMode(gd, !PROJECTION_MODE);
        }

        function getPlotAreaBounds(gd) {
            const full = gd?._fullLayout;
            const xa = full?.xaxis;
            const ya = full?.yaxis;
            if (!(xa && ya)) return null;
            const left = Number(xa._offset);
            const top = Number(ya._offset);
            const width = Number(xa._length);
            const height = Number(ya._length);
            if (![left, top, width, height].every(Number.isFinite)) return null;
            return { left, top, width, height, right: left + width, bottom: top + height, xa, ya };
        }

        function updateEllipseModebarButton(gd) {
            const button = findModebarButton(gd, 'ellipse select');
            if (button) button.classList.toggle('is-ellipse-active', !!ELLIPSE_SELECTION_MODE);
        }

        function getEllipseSelectionLayer(gd) {
            if (!gd) return null;
            let layer = gd.querySelector('#ellipse-selection-layer');
            if (!layer) {
                layer = document.createElement('div');
                layer.id = 'ellipse-selection-layer';
                Object.assign(layer.style, {
                    position: 'absolute',
                    inset: 0,
                    zIndex: 55,
                    display: 'none',
                    pointerEvents: 'none',
                    cursor: 'crosshair',
                    background: 'transparent',
                });
                gd.appendChild(layer);
            }
            if (!layer.dataset.bound) {
                let dragState = null;
                const toLocalPoint = (event) => {
                    const rect = gd.getBoundingClientRect();
                    return { x: event.clientX - rect.left, y: event.clientY - rect.top };
                };
                const isPointInsideEllipse = (ellipse, point) => {
                    if (!(ellipse && point) || ellipse.rx <= 0 || ellipse.ry <= 0) return false;
                    const dx = (point.x - ellipse.cx) / ellipse.rx;
                    const dy = (point.y - ellipse.cy) / ellipse.ry;

                    if (!ellipse) return [];

                        { key: 'west', x: ellipse.cx - ellipse.rx, y: ellipse.cy },
                        { key: 'north', x: ellipse.cx, y: ellipse.cy - ellipse.ry },
                        { key: 'south', x: ellipse.cx, y: ellipse.cy + ellipse.ry },
                    ];
                };
                const hitEllipseHandle = (ellipse, point, tolerance = 10) => {
                    for (const handle of getEllipseHandles(ellipse)) {
                        if (Math.hypot(handle.x - point.x, handle.y - point.y) <= tolerance) return handle.key;
                    }
                    return null;
                };
                const getEllipseCursor = (point) => {
                    if (!ELLIPSE_SELECTION_MODE) return '';
                    const currentEllipse = ACTIVE_ELLIPSE_SELECTION;
                    if (!(ACTIVE_ELLIPSE_HANDLES_VISIBLE && currentEllipse && point)) return 'crosshair';
                    const handle = hitEllipseHandle(currentEllipse, point);
                    if (handle === 'east' || handle === 'west') return 'ew-resize';
                    if (handle === 'north' || handle === 'south') return 'ns-resize';
                    if (isPointInsideEllipse(currentEllipse, point)) return 'move';
                    return 'crosshair';
                };
                const syncLayerCursor = (point = null) => {
                    const cursor = getEllipseCursor(point);
                    layer.style.cursor = cursor || 'crosshair';
                };
                const clampToBounds = (point) => {
                    const bounds = getPlotAreaBounds(gd);
                    if (!bounds) return null;
                    return {
                        x: Math.min(bounds.right, Math.max(bounds.left, point.x)),
                        y: Math.min(bounds.bottom, Math.max(bounds.top, point.y)),
                    };
                };
                const updateDrag = (point) => {
                    const next = clampToBounds(point);
                    if (!dragState || !next) return;
                    dragState.current = next;
                    if (dragState.mode === 'move') {
                        const base = dragState.baseEllipse;
                        const bounds = getPlotAreaBounds(gd);
                        if (!(base && bounds)) return;
                        const dx = next.x - dragState.start.x;
                        const dy = next.y - dragState.start.y;
                        const cx = Math.min(bounds.right - base.rx, Math.max(bounds.left + base.rx, base.cx + dx));
                        const cy = Math.min(bounds.bottom - base.ry, Math.max(bounds.top + base.ry, base.cy + dy));

                        const base = dragState.baseEllipse;

                        }
                        if (dragState.handle === 'north' || dragState.handle === 'south') {
                            ellipse.ry = Math.max(4, Math.abs(next.y - base.cy));
                        }
                        dragState.ellipse = ellipse;
                        drawSelectionOutline(gd, { ellipse: dragState.ellipse, ellipseHandlesActive: true });
                        return;
                    }
                    const cx = (dragState.start.x + next.x) / 2;
                    const cy = (dragState.start.y + next.y) / 2;
                    const rx = Math.abs(next.x - dragState.start.x) / 2;
                    const ry = Math.abs(next.y - dragState.start.y) / 2;

                });
                layer.addEventListener('mousedown', (event) => {
                    if (!ELLIPSE_SELECTION_MODE || event.button !== 0) return;

                    if (!bounds) return;
                    const start = toLocalPoint(event);
                    if (start.x < bounds.left || start.x > bounds.right || start.y < bounds.top || start.y > bounds.bottom) return;
                    const currentEllipse = ACTIVE_ELLIPSE_SELECTION;

                        dragState = { mode: 'move', start: clampToBounds(start), current: clampToBounds(start), baseEllipse: { ...currentEllipse }, ellipse: { ...currentEllipse } };
                        syncLayerCursor(start);
                        event.preventDefault();
                        event.stopPropagation();
                        document.addEventListener('mousemove', onMove, true);
                        document.addEventListener('mouseup', onUp, true);
                        return;
                    }
                    if (ACTIVE_ELLIPSE_HANDLES_VISIBLE) {
                        ACTIVE_ELLIPSE_HANDLES_VISIBLE = false;
                        renderActiveEllipseSelection(gd);
                        syncLayerCursor(start);
                        event.preventDefault();
                        event.stopPropagation();
                        return;
                    }
                    if (currentEllipse && isPointInsideEllipse(currentEllipse, start)) {
                        ACTIVE_ELLIPSE_HANDLES_VISIBLE = true;
                        renderActiveEllipseSelection(gd);
                        syncLayerCursor(start);
                        event.preventDefault();
                        event.stopPropagation();
                        return;
                    }
                    dragState = { mode: 'draw', start: clampToBounds(start), current: clampToBounds(start), ellipse: null };
                    syncLayerCursor(start);
                    event.preventDefault();
                    event.stopPropagation();
                    document.addEventListener('mousemove', onMove, true);
                    document.addEventListener('mouseup', onUp, true);
                });
                syncLayerCursor();
                layer.dataset.bound = '1';
            }

        }

        function setEllipseSelectionMode(gd, enabled, options = {}) {
            if (!gd) return;

            }
            if (!ELLIPSE_SELECTION_MODE) {
                ACTIVE_ELLIPSE_HANDLES_VISIBLE = false;

            }
            gd.style.cursor = (ELLIPSE_SELECTION_MODE || PROJECTION_MODE || MARKER_MODE) ? 'crosshair' : '';

        function toggleEllipseSelectionMode(gd) {

            const full = gd._fullLayout;
            const xa = full?.xaxis;
            const ya = full?.yaxis;
            if (!(xa && ya)) return;

            const applyOutlineStyles = (node, options = {}) => {

                node.setAttribute('fill', fill);
                node.setAttribute('stroke', isHalo ? HISTOGRAM_SELECTION_THEME.haloStroke : HISTOGRAM_SELECTION_THEME.strokeHex);
                node.setAttribute('stroke-width', isHalo ? String(HISTOGRAM_SELECTION_THEME.haloWidth) : String(HISTOGRAM_SELECTION_THEME.strokeWidth));
                node.setAttribute('stroke-dasharray', HISTOGRAM_SELECTION_THEME.dash);

            };

            const ellipse = ev?.ellipse;
            if (ellipse && Number.isFinite(ellipse.cx) && Number.isFinite(ellipse.cy) && Number.isFinite(ellipse.rx) && Number.isFinite(ellipse.ry)) {
                const halo = document.createElementNS('http://www.w3.org/2000/svg', 'ellipse');
                halo.setAttribute('cx', ellipse.cx);
                halo.setAttribute('cy', ellipse.cy);
                halo.setAttribute('rx', ellipse.rx);
                halo.setAttribute('ry', ellipse.ry);
                applyOutlineStyles(halo, { halo: true, noFill: true });

                const shape = document.createElementNS('http://www.w3.org/2000/svg', 'ellipse');
                shape.setAttribute('cx', ellipse.cx);
                shape.setAttribute('cy', ellipse.cy);
                shape.setAttribute('rx', ellipse.rx);

                    [
                        { x: ellipse.cx + ellipse.rx, y: ellipse.cy },
                        { x: ellipse.cx - ellipse.rx, y: ellipse.cy },
                        { x: ellipse.cx, y: ellipse.cy - ellipse.ry },
                        { x: ellipse.cx, y: ellipse.cy + ellipse.ry },

                        marker.setAttribute('cy', handle.y);
