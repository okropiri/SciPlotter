        // Simple statistics helper for numeric arrays
        function stats(arr) {
            if (!Array.isArray(arr)) return null;
            const values = [];
            let n = 0;
            let min = Infinity;
            let max = -Infinity;
            let sum = 0;
            let sumSq = 0;
            for (const v of arr) {
                const x = Number(v);
                if (!Number.isFinite(x)) continue;
                values.push(x);
                if (x < min) min = x;
                if (x > max) max = x;
                sum += x;
                sumSq += x * x;
                n++;
            }
            if (n === 0 || !Number.isFinite(min) || !Number.isFinite(max)) return null;
            values.sort((a, b) => a - b);
            const mean = sum / n;
            const mid = Math.floor(n / 2);
            const median = (n % 2 === 0) ? ((values[mid - 1] + values[mid]) / 2) : values[mid];
            const variance = Math.max(0, (sumSq / n) - (mean * mean));
            const rms = Math.sqrt(sumSq / n);
            return { n, min, max, mean, median, stdDev: Math.sqrt(variance), rms };
        }

        function isStructuredMetaContent(content) {
            return !!content && typeof content === 'object' && content.kind === 'stats-grid';
        }

        function normalizeMetaContent(content) {
            if (isStructuredMetaContent(content)) return content;
            if (Array.isArray(content)) return content.filter(Boolean).join('\n');
            if (content === null || content === undefined) return '';
            return String(content);
        }

        function hasMetaContent(content) {
            if (isStructuredMetaContent(content)) {
                return (Array.isArray(content.series) && content.series.length > 0)
                    || (Array.isArray(content.notes) && content.notes.some(Boolean));
            }
            return !!String(content || '').trim();
        }

        function formatMetaNumber(value) {
            return Number.isFinite(value) ? value.toFixed(3) : 'n/a';
        }

        function formatMetaCount(value) {
            return Number.isFinite(value) ? new Intl.NumberFormat('en-US').format(value) : 'n/a';
        }

        function buildStatsSeries(label, statBlock) {
            if (!statBlock) return null;
            return {
                label,
                n: statBlock.n,
                min: statBlock.min,
                max: statBlock.max,
                mean: statBlock.mean,
                median: statBlock.median,
                stdDev: statBlock.stdDev,
                rms: statBlock.rms,
            };
        }

        function buildStatsMetaPayload(series, notes = []) {
            return {
                kind: 'stats-grid',
                series: Array.isArray(series) ? series.filter(Boolean) : [],
                notes: Array.isArray(notes) ? notes.filter(Boolean) : [],
            };
        }

        function appendMetaTextRow(container, parts) {
            const validParts = parts.filter(Boolean);
            if (!validParts.length) return;
            const row = document.createElement('div');
            row.className = 'meta-text-row';
            row.innerHTML = validParts.join(' ');
            container.appendChild(row);
        }

        function formatMetaPair(label, value) {
            return `<strong>${label}:</strong> ${formatMetaNumber(value)}`;
        }

        function renderStructuredMetaBody(container, content, fallbackText) {
            const series = Array.isArray(content?.series) ? content.series.filter(Boolean) : [];
            const notes = Array.isArray(content?.notes) ? content.notes.filter(Boolean) : [];

            if (!series.length && !notes.length) {
                container.classList.remove('has-grid');
                container.textContent = fallbackText;
                return;
            }

            const cardKey = container.dataset.metaBody || 'main';
            const overlayOn = !!STATS_OVERLAY[cardKey];

            container.classList.add('has-grid');
            container.replaceChildren();

            if (series.length) {
                const grid = document.createElement('div');
                grid.className = 'meta-stats-grid';
                grid.dataset.columns = String(Math.min(Math.max(series.length, 1), 2));

                series.forEach((entry) => {
                    const column = document.createElement('div');
                    column.className = 'meta-stats-column';

                    if (entry.label) {
                        const seriesLabel = document.createElement('div');
                        seriesLabel.className = 'meta-stats-series-label';
                        seriesLabel.textContent = entry.label;
                        column.appendChild(seriesLabel);
                    }

                    [
                        ['Count', formatMetaCount(entry.n)],
                        ['Min', formatMetaNumber(entry.min)],
                        ['Max', formatMetaNumber(entry.max)],
                        ['Mean', formatMetaNumber(entry.mean)],
                        ['Median', formatMetaNumber(entry.median)],
                        ['Std dev', formatMetaNumber(entry.stdDev)],
                        ['RMS', formatMetaNumber(entry.rms)],
                    ].forEach(([label, value]) => {
                        const row = document.createElement('div');
                        row.className = 'meta-stat-row';

                        if (overlayOn) {
                            row.classList.add('has-overlay-cb');
                            const cbKey = cardKey + ':' + (entry.label || '') + ':' + label;
                            const cb = document.createElement('input');
                            cb.type = 'checkbox';
                            cb.className = 'meta-stat-overlay-cb';
                            const wasChecked = !!STATS_OVERLAY.checked[cbKey];
                            cb.checked = wasChecked;
                            if (wasChecked) {
                                STATS_OVERLAY.checked[cbKey] = { label, value, series: entry.label || '', card: cardKey };
                            }
                            cb.dataset.overlayKey = cbKey;
                            cb.dataset.overlayLabel = label;
                            cb.dataset.overlayValue = value;
                            cb.dataset.overlayCard = cardKey;
                            cb.dataset.overlaySeries = entry.label || '';
                            cb.addEventListener('change', onStatsOverlayCbChange);
                            row.appendChild(cb);
                        }

                        const labelEl = document.createElement('span');
                        labelEl.className = 'meta-stat-label';
                        labelEl.textContent = label;

                        const valueEl = document.createElement('span');
                        valueEl.className = 'meta-stat-value';
                        valueEl.textContent = value;

                        row.append(labelEl, valueEl);
                        column.appendChild(row);
                    });

                    grid.appendChild(column);
                });

                container.appendChild(grid);
            }

            notes.forEach((note) => {
                const noteEl = document.createElement('div');
                noteEl.className = 'meta-note';
                noteEl.textContent = String(note);
                container.appendChild(noteEl);
            });
        }

        function renderMetaBody(container, content, fallbackText) {
            if (isStructuredMetaContent(content)) {
                renderStructuredMetaBody(container, content, fallbackText);
                return;
            }
            container.classList.remove('has-grid');
            container.textContent = normalizeMetaContent(content).trim() || fallbackText;
        }

        /* --- Stats overlay: toggle, checkbox handlers, annotation sync --- */

        function onStatsOverlayToggle(e) {
            const input = e.currentTarget.querySelector('input[data-overlay-toggle]');
            if (!input) return;
            const cardKey = input.dataset.overlayToggle;
            STATS_OVERLAY[cardKey] = input.checked;
            if (!input.checked) {
                Object.keys(STATS_OVERLAY.checked).forEach((k) => {
                    if (k.startsWith(cardKey + ':')) delete STATS_OVERLAY.checked[k];
                });
            }
            renderHistogramMeta();
            scheduleStatsOverlaySync();
        }

        function onStatsOverlayCbChange(e) {
            const cb = e.currentTarget;
            const key = cb.dataset.overlayKey;
            if (cb.checked) {
                STATS_OVERLAY.checked[key] = {
                    label: cb.dataset.overlayLabel,
                    value: cb.dataset.overlayValue,
                    series: cb.dataset.overlaySeries,
                    card: cb.dataset.overlayCard,
                };
            } else {
                delete STATS_OVERLAY.checked[key];
            }
            scheduleStatsOverlaySync();
        }

        function scheduleStatsOverlaySync() {
            cancelAnimationFrame(_statsOverlaySyncTimer);
            _statsOverlaySyncTimer = requestAnimationFrame(() => syncStatsOverlayToPlot());
        }

        function formatStatsOverlayDisplayValue(value) {
            const raw = String(value ?? '').trim();
            if (!raw) return '';
            const numeric = Number(raw.replace(/,/g, ''));
            if (!Number.isFinite(numeric)) return raw;
            return new Intl.NumberFormat('en-US', {
                minimumFractionDigits: 1,
                maximumFractionDigits: 1,
            }).format(numeric);
        }

        function getStatsOverlayEntriesInPanelOrder() {
            const orderedInputs = Array.from(document.querySelectorAll('.meta-stat-overlay-cb:checked'));
            if (orderedInputs.length) {
                return orderedInputs.map((input) => ({
                    label: input.dataset.overlayLabel || '',
                    value: input.dataset.overlayValue || '',
                    series: input.dataset.overlaySeries || '',
                    card: input.dataset.overlayCard || '',
                }));
            }
            return Object.values(STATS_OVERLAY.checked);
        }

        function buildStatsOverlaySections() {
            const entries = getStatsOverlayEntriesInPanelOrder();
            if (!entries.length) return [];
            const toRows = (cardName) => entries
                .filter((entry) => entry.card === cardName)
                .map((entry) => ({
                    label: `${entry.series ? entry.series + ' ' : ''}${entry.label}`,
                    value: formatStatsOverlayDisplayValue(entry.value),
                }));
            const mainRows = toRows('main');
            const selRows = toRows('selection');
            return [
                mainRows.length ? { title: 'Plot Stats', rows: mainRows } : null,
                selRows.length ? { title: 'Selection Stats', rows: selRows } : null,
            ].filter(Boolean);
        }

        function getHistogramStatsOverlayElement(gd) {
            if (!gd) return null;
            let overlay = gd.querySelector('.hist-stats-overlay');
            if (overlay) return overlay;
            overlay = document.createElement('div');
            overlay.className = 'hist-stats-overlay is-hidden';
            overlay.setAttribute('aria-hidden', 'true');
            gd.appendChild(overlay);
            bindHistogramOverlayPositioning(gd);
            return overlay;
        }

        function getHistogramPlotFrameDividers(gd) {
            if (!gd) return null;
            let top = gd.querySelector('.hist-plot-frame-divider--top');
            let right = gd.querySelector('.hist-plot-frame-divider--right');
            if (!top) {
                top = document.createElement('div');
                top.className = 'hist-plot-frame-divider hist-plot-frame-divider--top';
                gd.appendChild(top);
            }
            if (!right) {
                right = document.createElement('div');
                right.className = 'hist-plot-frame-divider hist-plot-frame-divider--right';
                gd.appendChild(right);
            }
            bindHistogramOverlayPositioning(gd);
            return { top, right };
        }

        function bindHistogramOverlayPositioning(gd) {
            if (!gd || gd.__histOverlayPositioningBound || typeof gd.on !== 'function') return;
            const reposition = () => {
                requestAnimationFrame(() => {
                    const currentOverlay = gd.querySelector('.hist-stats-overlay');
                    if (currentOverlay && !currentOverlay.classList.contains('is-hidden')) {
                        positionHistogramStatsOverlay(gd, currentOverlay);
                    }
                    positionHistogramPlotFrameDividers(gd);
                });
            };
            gd.on('plotly_relayout', reposition);
            gd.on('plotly_afterplot', reposition);
            gd.__histOverlayPositioningBound = true;
        }

        function positionHistogramStatsOverlay(gd, overlay) {
            if (!gd || !overlay) return;
            const size = gd?._fullLayout?._size;
            if (!size || !Number.isFinite(size.l) || !Number.isFinite(size.t) || !Number.isFinite(size.w)) return;
            const plotRight = size.l + size.w;
            const desiredGap = 14;
            const overlayWidth = overlay.offsetWidth || 0;
            const left = Math.max(8, plotRight - overlayWidth - desiredGap);
            const top = Math.max(8, size.t + desiredGap);
            overlay.style.left = `${left}px`;
            overlay.style.top = `${top}px`;
        }

        function positionHistogramPlotFrameDividers(gd) {
            if (!gd) return;
            const size = gd?._fullLayout?._size;
            const dividers = getHistogramPlotFrameDividers(gd);
            if (!size || !dividers || !Number.isFinite(size.l) || !Number.isFinite(size.t) || !Number.isFinite(size.w) || !Number.isFinite(size.h)) return;
            dividers.top.style.left = `${size.l}px`;
            dividers.top.style.top = `${size.t}px`;
            dividers.top.style.width = `${size.w}px`;
            dividers.right.style.left = `${size.l + size.w}px`;
            dividers.right.style.top = `${size.t}px`;
            dividers.right.style.height = `${size.h}px`;
        }

        function buildStatsOverlayHtml(sections) {
            return sections.map((section, index) => {
                const rowsHtml = section.rows.map((row) => (
                    '<div class="hist-stats-overlay-row">'
                    + '<div class="hist-stats-overlay-label">' + escapeHistogramTextHtml(row.label) + '</div>'
                    + '<div class="hist-stats-overlay-value">' + escapeHistogramTextHtml(row.value) + '</div>'
                    + '</div>'
                )).join('');
                const sectionDivider = index > 0 ? '<div class="hist-stats-overlay-rule hist-stats-overlay-rule--section" aria-hidden="true"></div>' : '';
                return sectionDivider
                    + '<div class="hist-stats-overlay-section">'
                    + '<div class="hist-stats-overlay-title">' + escapeHistogramTextHtml(section.title) + '</div>'
                    + '<div class="hist-stats-overlay-rule" aria-hidden="true"></div>'
                    + rowsHtml
                    + '</div>';
            }).join('');
        }

        function syncStatsOverlayToPlot() {
            const gd = document.getElementById('histogram-plot');
            if (!gd) return;
            const overlay = getHistogramStatsOverlayElement(gd);
            if (!overlay) return;
            const sections = buildStatsOverlaySections();
            if (!sections.length) {
                overlay.classList.add('is-hidden');
                overlay.innerHTML = '';
                return;
            }
            overlay.innerHTML = buildStatsOverlayHtml(sections);
            overlay.classList.remove('is-hidden');
            requestAnimationFrame(() => positionHistogramStatsOverlay(gd, overlay));
        }

        function clearHistogramProjection() {
            PROJECTION_LOCKED = false;
            LAST_PROJECTION_STATE = null;
            renderHistogramProjection();
        }

        function updateHistogramProjection(state) {
            LAST_PROJECTION_STATE = state || null;
            renderHistogramProjection();
        }

        function setProjectionLocked(locked, options = {}) {
            PROJECTION_LOCKED = !!locked;
            renderHistogramProjection();
            if (!options.silent) {
                const gd = document.getElementById('histogram-plot');
                if (gd && PROJECTION_MODE) flashStatus(gd, PROJECTION_LOCKED ? 'Projection fixed' : 'Projection active');
            }
        }

        function getProjectionAxisKind(state) {
            if (!state) return 'x';
            if (state.projectionAxis === 'y' || state.projectionAxis === 'x') return state.projectionAxis;
            return state.axis === 'column' ? 'y' : 'x';
        }

        function getProjectionStateTitle(state) {
            if (!state) return 'Projection';
            const axisKind = getProjectionAxisKind(state);
            return axisKind === 'y' ? `${state.yKey} Projection` : `${state.xKey} Projection`;
        }

        function buildProjectionSeriesFromValues(values, edges, centers, visibleWindow) {
            if (!Array.isArray(values) || !Array.isArray(edges) || !Array.isArray(centers) || !visibleWindow) return null;
            const startIndex = visibleWindow.startIndex;
            const endIndex = visibleWindow.endIndex;
            if (!Number.isInteger(startIndex) || !Number.isInteger(endIndex) || endIndex < startIndex) return null;
            const counts = Array.from({ length: endIndex - startIndex + 1 }, () => 0);
            for (const rawValue of values) {
                const value = Number(rawValue);
                if (!Number.isFinite(value)) continue;
                const index = getBinIndex(value, edges);
                if (!Number.isInteger(index) || index < startIndex || index > endIndex) continue;
                counts[index - startIndex] += 1;
            }
            return {
                counts,
                centers: centers.slice(startIndex, endIndex + 1),
                startIndex,
                endIndex,
            };
        }

        function buildSelectionProjectionPanelState(gd, xs, ys, xKey, yKey) {
            const grid = getProjectionGrid(gd);
            if (!grid) return null;
            const visibleXRange = getVisibleProjectionRange(gd, 'xaxis', grid.xEdges);
            const visibleYRange = getVisibleProjectionRange(gd, 'yaxis', grid.yEdges);
            const visibleXWindow = getVisibleProjectionBinWindow(grid.xEdges, visibleXRange);
            const visibleYWindow = getVisibleProjectionBinWindow(grid.yEdges, visibleYRange);
            const xSeries = buildProjectionSeriesFromValues(xs, grid.xEdges, grid.xCenters, visibleXWindow);
            const ySeries = buildProjectionSeriesFromValues(ys, grid.yEdges, grid.yCenters, visibleYWindow);
            if (!(xSeries && ySeries)) return null;
            const selectedCount = Math.min(Array.isArray(xs) ? xs.length : 0, Array.isArray(ys) ? ys.length : 0);
            return {
                mode: 'selection',
                selectedCount,
                items: [
                    {
                        projectionAxis: 'x',
                        counts: xSeries.counts,
                        centers: xSeries.centers,
                        xKey,
                        yKey,
                        startIndex: xSeries.startIndex,
                        endIndex: xSeries.endIndex,
                    },
                    {
                        projectionAxis: 'y',
                        counts: ySeries.counts,
                        centers: ySeries.centers,
                        xKey,
                        yKey,
                        startIndex: ySeries.startIndex,
                        endIndex: ySeries.endIndex,
                    },
                ],
            };
        }

        function updateSelectionProjectionFromValues(gd, xs, ys, xKey, yKey) {
            LAST_SELECTION_PROJECTION_STATE = buildSelectionProjectionPanelState(gd, xs, ys, xKey, yKey);
            renderHistogramProjection();
        }

        function clearSelectionProjection() {
            LAST_SELECTION_PROJECTION_STATE = null;
            renderHistogramProjection();
        }

        function collectCurrentSelectionValues(gd) {
            const xs = [];
            const ys = [];
            if (!gd || !Array.isArray(gd.data)) return { xs, ys };
            for (const trace of gd.data) {
                if (!(trace && trace._selectionProxy && Array.isArray(trace.selectedpoints))) continue;
                const traceXs = Array.isArray(trace.x) ? trace.x : [];
                const traceYs = Array.isArray(trace.y) ? trace.y : [];
                for (const index of trace.selectedpoints) {
                    const xv = Number(traceXs[index]);
                    const yv = Number(traceYs[index]);
                    if (!Number.isFinite(xv) || !Number.isFinite(yv)) continue;
                    xs.push(xv);
                    ys.push(yv);
                }
            }
            return { xs, ys };
        }

        function syncSelectionProjectionFromCurrentSelection(gd) {
            const context = gd?.__histSelectionContext || {};
            const { xs, ys } = collectCurrentSelectionValues(gd);
            if (!xs.length || !ys.length) {
                clearSelectionProjection();
                return;
            }
            updateSelectionProjectionFromValues(gd, xs, ys, context.xKey, context.yKey);
        }

        function getProjectionSummaryText(state) {
            if (!state) return 'Enable Projection Tool in 2D mode to inspect rows or columns of the current histogram bins.';
            const countTotal = Array.isArray(state.counts) ? state.counts.reduce((acc, value) => acc + (Number(value) || 0), 0) : 0;
            const axisLabel = state.axis === 'column' ? state.xKey : state.yKey;
            const projectedLabel = state.axis === 'column' ? state.yKey : state.xKey;
            const startBin = Math.min(state.startIndex, state.endIndex) + 1;
            const endBin = Math.max(state.startIndex, state.endIndex) + 1;
            const binLabel = startBin === endBin ? `${axisLabel} bin ${startBin}` : `${axisLabel} bins ${startBin}-${endBin}`;
            const lockLabel = PROJECTION_LOCKED ? 'locked' : 'live';
            return `${binLabel} projected onto ${projectedLabel} (total counts: ${countTotal}, ${lockLabel})`;
        }

        function getProjectionPlotSpec(state, options = {}) {
            const axisKind = getProjectionAxisKind(state);
            const isYAxisProjection = axisKind === 'y';
            const width = options.width || null;
            const height = options.height || 180;
            const hasTitle = !!options.title;
            const isCompact = !!options.compact;
            const countValues = Array.isArray(state.counts) ? state.counts.map((value) => Number(value)).filter(Number.isFinite) : [];
            const countMax = countValues.length ? Math.max(...countValues, 0) : 0;
            const countUpper = countMax > 0 ? countMax * 1.06 : 1;
            const trace = isYAxisProjection
                ? {
                    type: 'bar',
                    orientation: 'h',
                    x: state.counts,
                    y: state.centers,
                    marker: { color: 'rgba(27, 118, 179, 0.78)' },
                    hovertemplate: `${state.yKey}: %{y}<br>Count: %{x}<extra></extra>`,
                }
                : {
                    type: 'bar',
                    x: state.centers,
                    y: state.counts,
                    marker: { color: 'rgba(27, 118, 179, 0.78)' },
                    hovertemplate: `${state.xKey}: %{x}<br>Count: %{y}<extra></extra>`,
                };
            const layout = {
                margin: {
                    l: isCompact ? 54 : (isYAxisProjection ? 92 : 58),
                    r: 22,
                    t: hasTitle ? (isCompact ? 28 : 56) : 18,
                    b: isCompact ? 52 : 72,
                },
                paper_bgcolor: 'rgba(0,0,0,0)',
                plot_bgcolor: '#ffffff',
                height,
                width,
                title: options.title ? {
                    text: options.title,
                    x: 0.5,
                    xanchor: 'center',
                    font: { family: CONTROL_TEXT_FONT_FAMILY, size: isCompact ? 13 : 20, color: '#0f172a' },
                } : undefined,
                xaxis: {
                    title: {
                        text: isYAxisProjection ? 'Count' : state.xKey,
                        standoff: isYAxisProjection ? 8 : 10,
                    },
                    gridcolor: 'rgba(148, 163, 184, 0.18)',
                    zeroline: false,
                    tickfont: { family: CONTROL_NUMBER_FONT_FAMILY, size: isCompact ? 10 : 12, color: '#475569' },
                    automargin: true,
                    autorange: !isYAxisProjection,
                    range: isYAxisProjection ? [0, countUpper] : undefined,
                    rangemode: isYAxisProjection ? 'tozero' : 'normal',
                },
                yaxis: {
                    title: {
                        text: isCompact ? '' : (isYAxisProjection ? state.yKey : 'Count'),
                        standoff: isYAxisProjection ? 4 : 8,
                    },
                    gridcolor: 'rgba(148, 163, 184, 0.18)',
                    zeroline: false,
                    tickfont: { family: CONTROL_NUMBER_FONT_FAMILY, size: isCompact ? 10 : 12, color: '#475569' },
                    automargin: true,
                    autorange: isYAxisProjection,
                    range: isYAxisProjection ? undefined : [0, countUpper],
                    rangemode: isYAxisProjection ? 'normal' : 'tozero',
                },
                showlegend: false,
            };
            const config = {
                displayModeBar: !!options.displayModeBar,
                responsive: options.responsive !== false,
                staticPlot: !!options.staticPlot,
                displaylogo: false,
            };
            return { data: [trace], layout, config };
        }

        async function renderProjectionPlotInto(container, state, options = {}) {
            if (!container || !state || !window.Plotly) return;
            const spec = getProjectionPlotSpec(state, options);
            await Plotly.newPlot(container, spec.data, spec.layout, spec.config);
        }

        function getProjectionMiniPlotYAxisLabel(state) {
            return getProjectionAxisKind(state) === 'y' ? state.yKey : 'Count';
        }

        async function withProjectionExportPlot(state, task) {
            if (!state || !window.Plotly || typeof task !== 'function') return;
            const mount = document.createElement('div');
            Object.assign(mount.style, {
                position: 'fixed',
                left: '-2000px',
                top: '0',
                width: `${PROJECTION_EXPORT_WIDTH}px`,
                height: `${PROJECTION_EXPORT_HEIGHT}px`,
                background: '#fff',
                zIndex: -1,
            });
            document.body.appendChild(mount);
            try {
                await renderProjectionPlotInto(mount, state, {
                    width: PROJECTION_EXPORT_WIDTH,
                    height: PROJECTION_EXPORT_HEIGHT,
                    compact: false,
                    responsive: false,
                    staticPlot: true,
                    title: `${state.axis === 'column' ? state.yKey : state.xKey} Projection`,
                });
                await task(mount);
            } finally {
                try { Plotly.purge(mount); } catch (_) {}
                mount.remove();
            }
        }

        async function exportProjectionPNG(state) {
            await withProjectionExportPlot(state, async (mount) => {
                const dataUrl = await Plotly.toImage(mount, {
                    format: 'png',
                    width: PROJECTION_EXPORT_WIDTH,
                    height: PROJECTION_EXPORT_HEIGHT,
                    scale: 1,
                });
                const a = document.createElement('a');
                a.href = dataUrl;
                a.download = 'projection.png';
                document.body.appendChild(a);
                a.click();
                a.remove();
            });
        }

        async function exportProjectionPDF(state) {
            if (!state) return;
            try { await ensureJsPdf(); } catch (e) { alert('jsPDF failed to load: ' + e.message); return; }
            await withProjectionExportPlot(state, async (mount) => {
                const dataUrl = await Plotly.toImage(mount, {
                    format: 'png',
                    width: PROJECTION_EXPORT_WIDTH,
                    height: PROJECTION_EXPORT_HEIGHT,
                    scale: 1,
                });
                const pxToPt = 0.75;
                const { jsPDF } = window.jspdf || {};
                if (!jsPDF) return;
                const pdf = new jsPDF({ orientation: 'landscape', unit: 'pt', format: [PROJECTION_EXPORT_WIDTH * pxToPt, PROJECTION_EXPORT_HEIGHT * pxToPt] });
                pdf.addImage(dataUrl, 'PNG', 0, 0, PROJECTION_EXPORT_WIDTH * pxToPt, PROJECTION_EXPORT_HEIGHT * pxToPt);
                pdf.save('projection.pdf');
            });
        }

        function openProjectionPopup(state) {
            if (!state || !window.Plotly) return;
            const popup = window.open('', 'histogram-projection-view', 'popup=yes,width=1040,height=860,resizable=yes,scrollbars=yes');
            if (!popup) {
                alert('Popup was blocked. Allow popups for this page to expand the projection plot.');
                return;
            }
            const title = getProjectionStateTitle(state);
            popup.document.open();
            popup.document.write(`<!doctype html><html><head><meta charset="utf-8"><title>${title}</title><style>body{margin:0;padding:20px;font-family:Segoe UI,Arial,sans-serif;background:#f8fafc;color:#0f172a}#projection-popup-shell{width:1000px;margin:0 auto}#projection-popup-root{width:1000px;height:800px;border:1px solid #e5e7eb;border-radius:8px;background:#fff;box-shadow:0 12px 28px rgba(15,23,42,.12)}</style></head><body><div id="projection-popup-shell"><div id="projection-popup-root"></div></div></body></html>`);
            popup.document.close();
            const mount = popup.document.getElementById('projection-popup-root');
            if (!mount) return;
            const spec = getProjectionPlotSpec(state, {
                width: PROJECTION_EXPORT_WIDTH,
                height: PROJECTION_EXPORT_HEIGHT,
                compact: false,
                responsive: false,
                staticPlot: false,
                displayModeBar: false,
                title,
            });
            popup.Plotly = window.Plotly;
            popup.Plotly.newPlot(mount, spec.data, spec.layout, spec.config);
        }

        function getProjectionPanelState() {
            if (LAST_SELECTION_PROJECTION_STATE?.items?.length) return LAST_SELECTION_PROJECTION_STATE;
            if (LAST_PROJECTION_STATE) {
                return {
                    mode: 'tool',
                    items: [LAST_PROJECTION_STATE],
                };
            }
            return null;
        }

        function getProjectionPanelSummaryText(panelState) {
            if (!panelState) return 'Enable Projection Tool in 2D mode to inspect rows or columns of the current histogram bins.';

        function renderHistogramMeta() {
            const refs = ensureHistogramMetaLayout();
            if (!refs) return;
            const mainContent = normalizeMetaContent(LAST_META_MAIN);
            const selectionContent = normalizeMetaContent(LAST_META_SELECTION);
            const selectionPlaceholder = String(normalizeMetaContent(LAST_META_SELECTION_PLACEHOLDER) || '').trim() || 'Use lasso/select on the 2D plot to inspect a subset.';

            renderMetaBody(refs.mainBody, mainContent, 'No statistics available yet.');
            renderMetaBody(refs.selectionBody, selectionContent, selectionPlaceholder);
            refs.mainCard.classList.toggle('is-empty', !hasMetaContent(mainContent));
            refs.selectionCard.classList.toggle('is-empty', !hasMetaContent(selectionContent));
            renderHistogramProjection();
            if (Object.keys(STATS_OVERLAY.checked).length) scheduleStatsOverlaySync();
        }

        function setHistogramMeta(mainContent, selectionContent = null, selectionPlaceholder = LAST_META_SELECTION_PLACEHOLDER) {
            LAST_META_MAIN = normalizeMetaContent(mainContent);
            LAST_META_SELECTION = selectionContent === null ? null : normalizeMetaContent(selectionContent);
            LAST_META_SELECTION_PLACEHOLDER = normalizeMetaContent(selectionPlaceholder) || LAST_META_SELECTION_PLACEHOLDER;
            renderHistogramMeta();
        }

        function setHistogramSelectionMeta(selectionContent, selectionPlaceholder = LAST_META_SELECTION_PLACEHOLDER) {
            LAST_META_SELECTION = selectionContent === null ? null : normalizeMetaContent(selectionContent);
            LAST_META_SELECTION_PLACEHOLDER = normalizeMetaContent(selectionPlaceholder) || LAST_META_SELECTION_PLACEHOLDER;
            renderHistogramMeta();
        }

        function formatSelectionSummary(xs, ys, xKey, yKey) {
            const sx = stats(xs);
            const sy = stats(ys);
            if (!sx || !sy) return null;
            return buildStatsMetaPayload([
                buildStatsSeries('X', sx),
                buildStatsSeries('Y', sy),
            ], [xKey && yKey ? `${xKey} vs ${yKey}` : '']);
        }

        function wireHistogramSelection(gd, mode, xKey, yKey) {
            if (!gd) return;
            gd.__histSelectionContext = { mode, xKey, yKey };
            syncHistogramSelectionTheme(gd);
            if (gd.__histSelectionHandler) gd.removeListener('plotly_selected', gd.__histSelectionHandler);
            if (gd.__histDeselectHandler) gd.removeListener('plotly_deselect', gd.__histDeselectHandler);
            if (gd.__histModeChangeHandler) gd.removeListener('plotly_relayout', gd.__histModeChangeHandler);
            if (gd.__histSelectionDoubleClickHandler) gd.removeEventListener('dblclick', gd.__histSelectionDoubleClickHandler, true);
            clearSelectionOutline(gd);

            const selectionPlaceholder = getHistogramSelectionPlaceholder(mode);
            setHistogramSelectionMeta(null, selectionPlaceholder);
            clearHistogramProjection();

            if (mode !== '2d') {
                setActiveHistogramSelection(gd, null);
                setProjectionMode(gd, false, { silent: true });
                setEllipseSelectionMode(gd, false, { silent: true });
                return;
            }

            syncActiveToolChrome(gd);

            const selectedHandler = (ev) => {
                const isNativeRangeSelection = Array.isArray(ev?.range?.x) && Array.isArray(ev?.range?.y);
                const isNativeLassoSelection = Array.isArray(ev?.lassoPoints?.x) && Array.isArray(ev?.lassoPoints?.y);
                if (!(isNativeRangeSelection || isNativeLassoSelection)) return;
                clearSelectionOutline(gd);
                const points = (ev?.points || []).filter((p) => {
                    const trace = p?.data || gd.data?.[p?.curveNumber];
                    return !!trace?._selectionProxy;
                });
                if (!points.length) {
                    clearHistogramSelectionState(gd, { selectionPlaceholder, syncPlotly: false, clearMeta: true });
                    return;
                }
                setActiveHistogramSelection(gd, isNativeRangeSelection
                    ? { type: 'range', range: { x: ev.range.x.slice(), y: ev.range.y.slice() } }
                    : { type: 'lasso', lassoPoints: { x: ev.lassoPoints.x.slice(), y: ev.lassoPoints.y.slice() } });
                const xs = points.map((p) => Number(p.x)).filter(Number.isFinite);
                const ys = points.map((p) => Number(p.y)).filter(Number.isFinite);
                const summary = formatSelectionSummary(xs, ys, xKey, yKey);
                updateSelectionProjectionFromValues(gd, xs, ys, xKey, yKey);
                setHistogramSelectionMeta(summary || null, selectionPlaceholder);
            };

            const deselectHandler = () => {
                clearHistogramSelectionState(gd, { selectionPlaceholder, syncPlotly: false, clearMeta: true });
            };

            const doubleClickHandler = (event) => {
                const selection = getActiveHistogramSelection(gd);
                if (!selection) return;
                const bounds = getPlotAreaBounds(gd);
                if (!bounds) return;
                const rect = gd.getBoundingClientRect();
                const point = { x: event.clientX - rect.left, y: event.clientY - rect.top };
                if (point.x < bounds.left || point.x > bounds.right || point.y < bounds.top || point.y > bounds.bottom) return;
                if (isPointInsideActiveHistogramSelection(gd, point)) return;
                event.preventDefault();
                event.stopPropagation();
                clearHistogramSelectionState(gd, {
                    selectionPlaceholder,
                    syncPlotly: true,
                    clearMeta: true,
                    scheduleHistory: true,
                });
            };

            const modeChangeHandler = (ev) => {
                if (!ev || typeof ev.dragmode !== 'string') return;
                if (['zoom', 'pan', 'select', 'lasso'].includes(ev.dragmode)) {
                    deactivateActiveInteractionTool(gd, { silent: true });
                }
            };

            gd.on('plotly_selected', selectedHandler);
            gd.on('plotly_deselect', deselectHandler);
            gd.on('plotly_relayout', modeChangeHandler);
            gd.addEventListener('dblclick', doubleClickHandler, true);
            gd.__histSelectionHandler = selectedHandler;
            gd.__histDeselectHandler = deselectHandler;
            gd.__histModeChangeHandler = modeChangeHandler;
            gd.__histSelectionDoubleClickHandler = doubleClickHandler;
        }

        // Infer numeric columns from sample rows to pick sensible defaults
        function inferNumericColumns(headers, rows, maxCheck = 200) {
            const counts = new Map();
            const total = Math.min(rows.length, maxCheck);
            for (const h of headers) counts.set(h, 0);
            for (let i = 0; i < total; i++) {
                const r = rows[i];
                for (const h of headers) {
                    const v = parseFloat(r[h]);
                    if (Number.isFinite(v)) counts.set(h, counts.get(h) + 1);
                }
            }
            // score by fraction numeric, sort desc
            const scored = headers.map(h => ({ h, frac: total ? (counts.get(h) / total) : 0 }));
            scored.sort((a, b) => b.frac - a.frac);
            // keep columns that are mostly numeric
            const numeric = scored.filter(s => s.frac >= 0.6).map(s => s.h);
            return numeric.length ? numeric : scored.slice(0, 2).map(s => s.h);
        }

        function captureCurrentRanges() {
            const el = document.getElementById('histogram-plot');
            const fl = el && el._fullLayout;
            if (!fl) return;
            const xr = fl.xaxis && fl.xaxis.range;
            const yr = fl.yaxis && fl.yaxis.range;
            if (Array.isArray(xr) && xr.length === 2 && xr.every(v => Number.isFinite(v))) {
                LAST_X_RANGE = xr.slice();
            }
            if (Array.isArray(yr) && yr.length === 2 && yr.every(v => Number.isFinite(v))) {
                LAST_Y_RANGE = yr.slice();
            }
        }

        function shouldPreserveHistogramRanges(forcePreserve = false) {
            if (forcePreserve) return true;
            return !document.getElementById('autoscaleOnRender')?.checked;
        }

        async function rerenderHistogramFromUpdate({ preserveRanges = false, captureRanges = true, summarize = true } = {}) {
            if (captureRanges) captureCurrentRanges();
            PRESERVE_ON_NEXT_RENDER = shouldPreserveHistogramRanges(preserveRanges);
            if (summarize) summarizeSelection();
            await renderHistogram();
        }

        async function fetchSmoothedSummary() {
            // Load the selected summary CSV. In 'auto' mode, pick the most recently modified
            // among unsmoothed, smoothed, and original using /api/summaries.
            if (CACHED_SUMMARY) return CACHED_SUMMARY;
            const sel = document.getElementById('summarySource')?.value || 'auto';
            if (sel === 'custom' && LOCAL_SUMMARY) {
                CACHED_SUMMARY = prepareSummaryDataset(LOCAL_SUMMARY);
                return CACHED_SUMMARY;
            }

            async function pickAutoUrls() {
                try {
                    const r = await fetch('/api/summaries');
                    if (!r.ok) throw new Error('summaries not available');
                    const info = await r.json();
                    const srcs = Array.isArray(info?.sources) ? info.sources : [];
                    // Filter existing ones and sort by mtime descending
                    const existing = srcs.filter(s => s && s.exists).sort((a, b) => (b.mtime || 0) - (a.mtime || 0));
                    const order = existing.length ? existing.map(s => s.label) : ['smoothed', 'unsmoothed', 'original'];
                    return order.map(lbl => `/api/summary?src=${encodeURIComponent(lbl)}`);
                } catch (_) {
                    // Fallback to previous preference order if summaries endpoint fails
                    return ['/api/summary?src=smoothed', '/api/summary?src=unsmoothed', '/api/summary?src=original'];
                }
            }

            let urls = [];
            if (sel === 'smoothed') urls = ['/api/summary?src=smoothed'];
            else if (sel === 'unsmoothed') urls = ['/api/summary?src=unsmoothed'];
            else if (sel === 'original') urls = ['/api/summary?src=original'];
            else urls = await pickAutoUrls();

            for (const url of urls) {
                try {
                    const res = await fetch(url);
                    if (!res.ok) continue;
                    showLoading();
                    const text = await res.text();
                    // Yield to let browser paint spinner before heavy sync parse
                    await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
                    const parsed = parseCSV(text);
                    if (!parsed.headers.length || !parsed.rows.length) continue;
                    CACHED_SUMMARY = prepareSummaryDataset(parsed);
                    return CACHED_SUMMARY;
                } catch (_) { /* try next */ }
            }
            return { headers: [], rows: [] };
        }

        async function fetchSummaryHeaders() {
            // Try smoothed first, then fallback to original
            const s = await fetchSmoothedSummary();
            return s.headers || [];
        }

        async function fetchEventToEventDtRaw() {
            // Loads the latest offline neighbor Δt CSV via server API
            if (CACHED_EVENT_TO_EVENT_DT_RAW) return CACHED_EVENT_TO_EVENT_DT_RAW;
            try {
                const res = await fetch('/api/event_to_event_dt_raw');
                if (!res.ok) return { headers: [], rows: [] };
                const text = await res.text();
                CACHED_EVENT_TO_EVENT_DT_RAW = parseCSV(text, 'event_to_event_dt_raw');
                return CACHED_EVENT_TO_EVENT_DT_RAW;
            } catch (e) {
                return { headers: [], rows: [] };
            }
        }

        function populateSelectFromHeaders(sel, headers, includeAdvanced = true) {
            sel.innerHTML = '';

            // Sort headers by priority: time features first, then alphabetically
            const sortedHeaders = [...headers].sort((a, b) => {
                const aIsTime = isPhaseShiftableKey(a);
                const bIsTime = isPhaseShiftableKey(b);

                // Time features come first
                if (aIsTime && !bIsTime) return -1;
                if (!aIsTime && bIsTime) return 1;

                // Within same category, sort alphabetically
                return a.localeCompare(b);
            });

            // Add time-based features group if any exist
            const timeFeatures = sortedHeaders.filter(h => isPhaseShiftableKey(h));
            const otherFeatures = sortedHeaders.filter(h => !isPhaseShiftableKey(h));

            if (timeFeatures.length > 0) {
                const timeGroup = document.createElement('optgroup');
                timeGroup.label = 'Time-based features (phase shift available)';
                timeFeatures.forEach(h => {
                    const opt = document.createElement('option');
                    opt.value = h;
                    opt.textContent = h;
                    opt.style.fontWeight = 'bold';
                    timeGroup.appendChild(opt);
                });
                sel.appendChild(timeGroup);
            }

            // Add other features
            if (otherFeatures.length > 0) {
                const otherGroup = document.createElement('optgroup');
                otherGroup.label = 'Other features';
                otherFeatures.forEach(h => {
                    const opt = document.createElement('option');
                    opt.value = h;
                    opt.textContent = h;
                    otherGroup.appendChild(opt);
                });
                sel.appendChild(otherGroup);
            }

            // Advanced features group (always at the bottom)
            if (includeAdvanced && ADVANCED_FEATURES.length) {
                const og = document.createElement('optgroup');
                og.label = 'Advanced features';
                ADVANCED_FEATURES.forEach(f => {
                    // Avoid duplicating if header already exists
                    if (headers.includes(f.key)) return;
                    const opt = document.createElement('option');
                    opt.value = f.key;
                    opt.textContent = f.label;
                    opt.style.fontWeight = 'bold';
                    opt.dataset.advanced = '1';
                    og.appendChild(opt);
                });
                sel.appendChild(og);
            }
        }

        const PREFERRED_FEATURE_SELECTIONS = { x: '', y: '', f: '' };

        function optionValueExists(sel, value) {
            if (!sel || !value) return false;
            return Array.from(sel.options || []).some((opt) => opt.value === value);
        }

        function ensureAdvancedFilterOption(sel) {
            if (!sel || optionValueExists(sel, 'C3_Filter')) return;
            const optC3 = document.createElement('option');
            optC3.value = 'C3_Filter';
            optC3.textContent = 'C3_Filter (C4 with C3 ±window ns)';
            optC3.style.fontWeight = 'bold';
            sel.appendChild(optC3);
        }

        function rememberFeatureSelectionPreference(which, value) {
            if (!Object.prototype.hasOwnProperty.call(PREFERRED_FEATURE_SELECTIONS, which)) return;
            if (typeof value === 'string' && value) PREFERRED_FEATURE_SELECTIONS[which] = value;
        }

        function initializeFeatureSelectionPreferences(xSel, ySel, fSel) {
            if (!PREFERRED_FEATURE_SELECTIONS.x && xSel?.value) PREFERRED_FEATURE_SELECTIONS.x = xSel.value;
            if (!PREFERRED_FEATURE_SELECTIONS.y && ySel?.value) PREFERRED_FEATURE_SELECTIONS.y = ySel.value;
            if (!PREFERRED_FEATURE_SELECTIONS.f && fSel?.value) PREFERRED_FEATURE_SELECTIONS.f = fSel.value;
        }

        function applyCurrentDefaultFeatureSelections(headers, xSel, ySel, fSel, restoreState = {}) {
            if (!Array.isArray(headers) || !headers.length) return;
            if (xSel && !restoreState.x) {
                if (headers.includes('event_start_time') && optionValueExists(xSel, 'event_start_time')) {
                    xSel.value = 'event_start_time';
                } else if (headers.includes('psd_value') && optionValueExists(xSel, 'psd_value')) {
                    xSel.value = 'psd_value';
                }
            }
            if (ySel && !restoreState.y && headers.includes('qtotal_mV_ns') && optionValueExists(ySel, 'qtotal_mV_ns')) {
                ySel.value = 'qtotal_mV_ns';
            }
            if (fSel && !restoreState.f) {
                if (headers.includes('snr') && optionValueExists(fSel, 'snr')) {
                    fSel.value = 'snr';
                } else {
                    const fallbackValue = (xSel?.value && optionValueExists(fSel, xSel.value)) ? xSel.value : headers[0];
                    if (optionValueExists(fSel, fallbackValue)) fSel.value = fallbackValue;
                }
            }
        }

        function applyCustomDefaultFeatureSelections(headers, rows, xSel, ySel, fSel, restoreState = {}) {
            if (!Array.isArray(headers) || !headers.length) return;
            try {
                const numeric = inferNumericColumns(headers, rows || []);
                if (Array.isArray(numeric) && numeric.length) {
                    if (xSel && !restoreState.x && numeric[0] && optionValueExists(xSel, numeric[0])) xSel.value = numeric[0];
                    if (ySel && !restoreState.y && optionValueExists(ySel, numeric[1] || numeric[0])) ySel.value = numeric[1] || numeric[0];
                    if (fSel && !restoreState.f && xSel?.value && optionValueExists(fSel, xSel.value)) fSel.value = xSel.value;
                }
            } catch (_) { }
            if (fSel && !restoreState.f && headers.includes('snr') && optionValueExists(fSel, 'snr')) fSel.value = 'snr';
        }

        function restoreOrDefaultFeatureSelections(headers, rows, options = {}) {
            const xSel = document.getElementById('axis-x');
            const ySel = document.getElementById('axis-y');
            const fSel = document.getElementById('axis-f');
            populateSelectFromHeaders(xSel, headers, true);
            populateSelectFromHeaders(ySel, headers, true);
            populateSelectFromHeaders(fSel, headers, false);
            ensureAdvancedFilterOption(fSel);

            const restoredX = optionValueExists(xSel, PREFERRED_FEATURE_SELECTIONS.x);
            const restoredY = optionValueExists(ySel, PREFERRED_FEATURE_SELECTIONS.y);
            const restoredF = optionValueExists(fSel, PREFERRED_FEATURE_SELECTIONS.f);

            if (restoredX) xSel.value = PREFERRED_FEATURE_SELECTIONS.x;
            if (restoredY) ySel.value = PREFERRED_FEATURE_SELECTIONS.y;
            if (restoredF) fSel.value = PREFERRED_FEATURE_SELECTIONS.f;

            if (!(restoredX && restoredY && restoredF)) {
                const restoreState = { x: restoredX, y: restoredY, f: restoredF };
                if (options.useCustomDefaults) {
                    applyCustomDefaultFeatureSelections(headers, rows, xSel, ySel, fSel, restoreState);
                } else {
                    applyCurrentDefaultFeatureSelections(headers, xSel, ySel, fSel, restoreState);
                }
            }

            initializeFeatureSelectionPreferences(xSel, ySel, fSel);
        }

        function syncFeatureRowVisibility(mode = document.querySelector('input[name="hist-type"]:checked')?.value || '2d') {
            const yRow = document.getElementById('y-row');
            const yFilterRow = document.getElementById('y-filter-row');
            const fFilterRow = document.getElementById('f-filter-row');
            const c3AdvRow = document.getElementById('c3-adv-row');
            const xKey = document.getElementById('axis-x')?.value;
            const isC3 = document.getElementById('axis-f')?.value === 'C3_Filter';

            if (yRow) yRow.style.display = (mode === '2d') ? 'grid' : 'none';
            if (yFilterRow) yFilterRow.style.display = (mode === '2d') ? 'grid' : 'none';
            if (fFilterRow) fFilterRow.style.display = (!isC3) ? 'grid' : 'none';
            if (c3AdvRow) c3AdvRow.style.display = isC3 ? 'flex' : 'none';

            const mergeRow = document.getElementById('merge-row');
            if (mergeRow) {
                const showMerge = (mode === '1d') && !isDtFeature(xKey);
                mergeRow.style.display = showMerge ? 'grid' : 'none';
            }
        }

        function setMode(mode) {
            const yRow = document.getElementById('y-row');
            const binsRow = document.getElementById('bins-row');
            const binsYLabel = document.getElementById('binsy-label');
            const binsYInput = document.getElementById('binsY');
            const colorsSectionTitle = document.getElementById('colors-section-title');
            yRow.style.display = (mode === '2d') ? 'grid' : 'none';
            // Toggle 2D specific controls

        function toNumeric(arr) {
            const out = [];
            for (let i = 0; i < arr.length; i++) {
                const v = parseFloat(arr[i]);
                if (Number.isFinite(v)) out.push(v);
            }
            return out;
        }

        // Detect if a feature key corresponds to an event start time
        function isEventStartKey(key) {
            return key === 'event_start_time_ns' || key === 'EventStartTime' || key === 'event_time_ns' || key === 'EventTime';
        }

        // Detect if a feature key corresponds to a peak time
        function isPeakTimeKey(key) {
            return key === 'peak_time_ns' || key === 'PeakTime' || key === 'peak_time' || key === 'PeakTimeNs';
        }

        // Detect if a feature key corresponds to an event end time
        function isEventEndKey(key) {
            return key === 'event_end_time_ns' || key === 'EventEndTime' || key === 'event_end_time' || key === 'EventEndTimeNs';
        }

        // Detect if a feature key supports phase shift (any time-based feature)
        function isPhaseShiftableKey(key) {
            return isEventStartKey(key) || isPeakTimeKey(key) || isEventEndKey(key);
        }

        // Compute dataset period (ns) from summary headers/rows; prefer cycle_period_ns, fallback to 40ns
        function computeDatasetPeriodNs(dataset) {
            const summaryDataset = prepareSummaryDataset(dataset);
            const headers = summaryDataset.headers || [];
            const runtime = getSummaryRuntime(summaryDataset);
            if (Number.isFinite(runtime.periodCache?.datasetPeriodNs)) return runtime.periodCache.datasetPeriodNs;
            const periodKeys = ['cycle_period_ns', 'CyclePeriodNs', 'period_ns', 'PeriodNs'];
            const pKey = periodKeys.find(k => headers.includes(k));
            if (pKey) {
                const vals = [];
                const column = getSummaryColumn(summaryDataset, pKey);
                for (let i = 0; column && i < column.length; i++) {
                    const v = column[i];
                    if (Number.isFinite(v) && v > 0) vals.push(v);
                }
                if (vals.length) {
                    vals.sort((a, b) => a - b);
                    const med = vals[Math.floor(vals.length / 2)];
                    runtime.periodCache.datasetPeriodNs = med;
                    return med;
                }
            }
            // Fallback: try cyclotron period from summary metadata columns if present
            const altKeys = ['phase_period_ns', 'PhasePeriodNs'];
            const aKey = altKeys.find(k => headers.includes(k));
            if (aKey) {
                const vals = [];
                const column = getSummaryColumn(summaryDataset, aKey);
                for (let i = 0; column && i < column.length; i++) {
                    const v = column[i];
                    if (Number.isFinite(v) && v > 0) vals.push(v);
                }
                if (vals.length) {
                    vals.sort((a, b) => a - b);
                    runtime.periodCache.datasetPeriodNs = vals[Math.floor(vals.length / 2)];
                    return runtime.periodCache.datasetPeriodNs;
                }
            }
            runtime.periodCache.datasetPeriodNs = 40.0;
            return 40.0; // default 40 ns if not detectable
        }

        // Wrap value into [0, period) after adding shift (ns)
        function shiftAndWrapNs(value, shift, period) {
            if (!Number.isFinite(value)) return value;
            const p = (Number.isFinite(period) && period > 0) ? period : 40.0;
            let v = value + (Number.isFinite(shift) ? shift : 0);
            // Proper modulo for negatives
            v = ((v % p) + p) % p;
            return v;
        }

        // Compute differences for Event_to_event_dt
        // Modes:
        // - NxN pairs within each (channel, trace) group; optional excludeSelfPairs
        // - neighborOnly: only t[i] - t[i-1] within each group (sorted by time)
        function computeEventToEventDiffs(headers, rows, opts = {}) {
            const dataset = opts.dataset || prepareSummaryDataset({ headers, rows });
            // Prefer 'delta_t_ns' column; fall back to a close variant if present
            const dtKey = headers.includes('delta_t_ns') ? 'delta_t_ns'
                : (headers.includes('deltaT_ns') ? 'deltaT_ns'
                    : (headers.includes('deltaT') ? 'deltaT' : null));
            if (!dtKey) return [];
            const {
                fKey = null,
                fMin = undefined,
                fMax = undefined,
                excludeSelfPairs = false,
                neighborOnly = false,
                limitWithinTrace = true,
                splitByFilter = false,
                maxAbsDt = DEFAULT_DT_LIMIT_NS,
            } = opts;

            // Detect channel and a likely trace/file grouping key
            const chanKey = getChannelKey(headers);
            const traceCandidates = ['trace_id', 'TraceID', 'trace', 'Trace', 'file', 'File', 'filename', 'basename', 'source_file', 'source', 'run', 'Run', 'segment', 'Segment', 'cycle_id', 'CycleID', 'cycle'];
            const traceKey = traceCandidates.find(k => headers.includes(k)) || null;

            // Build per-group arrays of timestamps (ns)
            const groups = new Map();
            for (const r of rows) {
                const t = getSummaryNumericValue(dataset, r, dtKey);
                if (!Number.isFinite(t)) continue;
                const chv = chanKey ? String(r[chanKey]).trim() : '';
                const trv = traceKey ? String(r[traceKey]).trim() : '';
                const gk = limitWithinTrace ? `${chv}||${trv}` : `${chv}`;
                let bucket = groups.get(gk);
                if (!bucket) {
                    bucket = splitByFilter ? { in: [], out: [] } : [];
                    groups.set(gk, bucket);
                }
                // Determine F-range membership for this event
                let inRange = true;
                if (fKey) {
                    const fv = getSummaryNumericValue(dataset, r, fKey);
                    if (!Number.isFinite(fv)) inRange = false;
                    if (Number.isFinite(fMin) && fv < fMin) inRange = false;
                    if (Number.isFinite(fMax) && fv > fMax) inRange = false;
                }
                if (splitByFilter) {
                    (inRange ? bucket.in : bucket.out).push(t);
                } else {
                    if (inRange) bucket.push(t);
                }
            }

            // Early exit if no groups
            if (!groups.size) return splitByFilter ? { in: [], out: [] } : [];

            // Neighbor-only differences within each group
            if (neighborOnly) {
                if (!splitByFilter) {
                    const out = [];
                    for (const [, dts] of groups.entries()) {
                        if (dts.length < 2) continue;
                        dts.sort((a, b) => a - b);
                        for (let i = 1; i < dts.length; i++) {
                            const d = dts[i] - dts[i - 1];
                            if (!Number.isFinite(maxAbsDt) || Math.abs(d) <= maxAbsDt) out.push(d);
                        }
                    }
                    return out;
                } else {
                    const outIn = [];
                    const outOut = [];
                    for (const [, g] of groups.entries()) {
                        const seq = [];
                        for (const t of g.in) seq.push({ t, in: true });
                        for (const t of g.out) seq.push({ t, in: false });
                        if (seq.length < 2) continue;
                        seq.sort((a, b) => a.t - b.t);
                        for (let i = 1; i < seq.length; i++) {
                            const d = seq[i].t - seq[i - 1].t;
                            if (!Number.isFinite(maxAbsDt) || Math.abs(d) <= maxAbsDt) {
                                if (seq[i].in && seq[i - 1].in) outIn.push(d); else outOut.push(d);
                            }
                        }
                    }
                    return { in: outIn, out: outOut };
                }
            }

            // NxN differences (may be sampled)
            const MAX_PAIRS = 1000000;
            if (!splitByFilter) {
                const groupList = [];
                let totalPairs = 0;
                for (const [key, dts] of groups.entries()) {
                    const n = dts.length;
                    if (!n) continue;
                    const pairs = excludeSelfPairs ? (n * (n - 1)) : (n * n);
                    groupList.push({ key, dts, n, pairs });
                    totalPairs += pairs;
                }
                const out = [];
                if (!groupList.length) return out;
                if (totalPairs <= MAX_PAIRS) {
                    // Use all pairs within each group
                    for (const g of groupList) {
                        const { dts, n } = g;
                        for (let i = 0; i < n; i++) {
                            const di = dts[i];
                            if (excludeSelfPairs) {
                                for (let j = 0; j < n; j++) if (j !== i) {
                                    const d = di - dts[j];
                                    if (!Number.isFinite(maxAbsDt) || Math.abs(d) <= maxAbsDt) out.push(d);
                                }
                            } else {
                                for (let j = 0; j < n; j++) {
                                    const d = di - dts[j];
                                    if (!Number.isFinite(maxAbsDt) || Math.abs(d) <= maxAbsDt) out.push(d);
                                }
                            }
                        }
                    }
                    return out;
                }
                // Proportional sampling by group pair weight
                for (let idx = 0; idx < groupList.length; idx++) {
                    const g = groupList[idx];
                    const quota = Math.max(0, Math.floor(MAX_PAIRS * (g.pairs / totalPairs)));
                    if (!quota) continue;
                    if (quota >= g.pairs) {
                        const { dts, n } = g;
                        for (let i = 0; i < n; i++) {
                            const di = dts[i];
                            if (excludeSelfPairs) {
                                for (let j = 0; j < n; j++) if (j !== i) {
                                    const d = di - dts[j];
                                    if (!Number.isFinite(maxAbsDt) || Math.abs(d) <= maxAbsDt) out.push(d);
                                }
                            } else {
                                for (let j = 0; j < n; j++) {
                                    const d = di - dts[j];
                                    if (!Number.isFinite(maxAbsDt) || Math.abs(d) <= maxAbsDt) out.push(d);
                                }
                            }
                        }
                        continue;
                    }
                    let attempts = 0;
                    for (let k = 0; k < quota && attempts < quota * 3; attempts++) {
                        const i = Math.floor(Math.random() * g.n);
                        let j = Math.floor(Math.random() * g.n);
                        if (excludeSelfPairs && j === i) j = (j + 1) % g.n;
                        const d = g.dts[i] - g.dts[j];
                        if (!Number.isFinite(maxAbsDt) || Math.abs(d) <= maxAbsDt) { out.push(d); k++; }
                    }
                }
                out.__sampled = true;
                out.__totalPairs = totalPairs;
                out.__sampledPairs = out.length;
                return out;
            } else {
                // splitByFilter: compute in/out pairs separately
                const groupList = [];
                let totalInPairs = 0, totalOutPairs = 0;
                for (const [key, g] of groups.entries()) {
                    const nIn = g.in.length, nOut = g.out.length;
                    const nTot = nIn + nOut;
                    if (!nTot) continue;
                    const inPairs = excludeSelfPairs ? (nIn * (nIn - 1)) : (nIn * nIn);
                    const outPairs = (excludeSelfPairs ? (nTot * (nTot - 1)) : (nTot * nTot)) - inPairs;
                    groupList.push({ key, inArr: g.in, outArr: g.out, nIn, nOut, inPairs, outPairs });
                    totalInPairs += inPairs;
                    totalOutPairs += outPairs;
                }
                const outIn = [], outOut = [];
                if (!groupList.length) return { in: outIn, out: outOut };
                if ((totalInPairs + totalOutPairs) <= MAX_PAIRS) {
                    for (const g of groupList) {
                        const { inArr, outArr, nIn, nOut } = g;
                        // in-in pairs
                        for (let i = 0; i < nIn; i++) {
                            const di = inArr[i];
                            for (let j = 0; j < nIn; j++) {
                                if (excludeSelfPairs && j === i) continue;
                                const d = di - inArr[j];
                                if (!Number.isFinite(maxAbsDt) || Math.abs(d) <= maxAbsDt) outIn.push(d);
                            }
                        }
                        // in-out and out-in
                        for (let i = 0; i < nIn; i++) {
                            const di = inArr[i];
                            for (let j = 0; j < nOut; j++) {
                                let d = di - outArr[j]; if (!Number.isFinite(maxAbsDt) || Math.abs(d) <= maxAbsDt) outOut.push(d);
                                d = outArr[j] - di; if (!Number.isFinite(maxAbsDt) || Math.abs(d) <= maxAbsDt) outOut.push(d);
                            }
                        }
                        // out-out
                        for (let i = 0; i < nOut; i++) {
                            const di = outArr[i];
                            for (let j = 0; j < nOut; j++) {
                                if (excludeSelfPairs && j === i) continue;
                                const d = di - outArr[j];
                                if (!Number.isFinite(maxAbsDt) || Math.abs(d) <= maxAbsDt) outOut.push(d);
                            }
                        }
                    }
                    return { in: outIn, out: outOut };
                }
                // Sampling proportionally for in/out categories
                const totalPairs = totalInPairs + totalOutPairs;
                const quotaInTotal = Math.floor(MAX_PAIRS * (totalInPairs / totalPairs));
                const quotaOutTotal = MAX_PAIRS - quotaInTotal;
                for (const g of groupList) {
                    const qIn = Math.max(0, Math.floor(quotaInTotal * (g.inPairs / totalInPairs || 0)));
                    const qOut = Math.max(0, Math.floor(quotaOutTotal * (g.outPairs / totalOutPairs || 0)));
                    // Sample in-in
                    let attemptsIn = 0;
                    for (let k = 0; k < qIn && attemptsIn < qIn * 3; attemptsIn++) {
                        if (g.nIn < (excludeSelfPairs ? 2 : 1)) break;
                        const i = Math.floor(Math.random() * g.nIn);
                        let j = Math.floor(Math.random() * g.nIn);
                        if (excludeSelfPairs && j === i) j = (j + 1) % g.nIn;
                        const d = g.inArr[i] - g.inArr[j];
                        if (!Number.isFinite(maxAbsDt) || Math.abs(d) <= maxAbsDt) { outIn.push(d); k++; }
                    }
                    // Sample out-category pairs: randomly choose among (in-out, out-in, out-out) weighted by their counts
                    const countInOut = g.nIn * g.nOut * 2; // in-out and out-in
                    const countOutOut = excludeSelfPairs ? (g.nOut * (g.nOut - 1)) : (g.nOut * g.nOut);
                    const countOutTotal = countInOut + countOutOut;
                    let attemptsOut = 0;
                    for (let k = 0; k < qOut && countOutTotal > 0 && attemptsOut < qOut * 3; attemptsOut++) {
                        const r = Math.random() * countOutTotal;
                        if (r < countInOut) {
                            const iIn = Math.floor(Math.random() * g.nIn);
                            const iOut = Math.floor(Math.random() * g.nOut);
                            const pick = Math.random() < 0.5 ? (g.inArr[iIn] - g.outArr[iOut]) : (g.outArr[iOut] - g.inArr[iIn]);
                            if (!Number.isFinite(maxAbsDt) || Math.abs(pick) <= maxAbsDt) { outOut.push(pick); k++; }
                        } else {
                            if (g.nOut < (excludeSelfPairs ? 2 : 1)) continue;
                            const i = Math.floor(Math.random() * g.nOut);
                            let j = Math.floor(Math.random() * g.nOut);
                            if (excludeSelfPairs && j === i) j = (j + 1) % g.nOut;
                            const d = g.outArr[i] - g.outArr[j];
                            if (!Number.isFinite(maxAbsDt) || Math.abs(d) <= maxAbsDt) { outOut.push(d); k++; }
                        }
                    }
                }
                outIn.__sampled = true; outIn.__category = 'in';
                outOut.__sampled = true; outOut.__category = 'out';
                return { in: outIn, out: outOut };
            }
        }

        async function renderHistogram() {
            showLoading();
            try {
                const el = document.getElementById('histogram-plot');
                const meta = document.getElementById('hist-meta');
                const mode = document.querySelector('input[name="hist-type"]:checked').value;
                const xKey = document.getElementById('axis-x').value;
                const yKey = document.getElementById('axis-y').value;
                const fKey = document.getElementById('axis-f')?.value;
                // Feature value filters
                const xMinF = getStoredNumericValue('xMinFilter');
                const xMaxF = getStoredNumericValue('xMaxFilter');
                const yMinF = getStoredNumericValue('yMinFilter');
                const yMaxF = getStoredNumericValue('yMaxFilter');
                const fMinF = getStoredNumericValue('fMinFilter');
                const fMaxF = getStoredNumericValue('fMaxFilter');
                const binsX = parseInt(document.getElementById('binsX').value || '50', 10);
                const binsY = parseInt(document.getElementById('binsY')?.value || String(binsX), 10);

            function countDecimals(value) {
                if (!Number.isFinite(value)) return 0;
                const text = String(value).toLowerCase();
                if (text.includes('e-')) {
                    const [base, exp] = text.split('e-');
                    const fracLen = (base.split('.')[1] || '').length;

                if (!Number.isFinite(val) || val === 0) return 0.1;

            async function getLogicalStep(targetId, el) {
                if (targetId === 'fMinFilter' || targetId === 'fMaxFilter') {

                    const span = bounds ? Math.abs(bounds.max - bounds.min) : NaN;
                    if (Number.isFinite(span) && span > 0) return Math.max(span / 100, 0.0001);
                }

                const minAttr = parseFloat(el.getAttribute('min'));
                const maxAttr = parseFloat(el.getAttribute('max'));
                if (Number.isFinite(minAttr) && Number.isFinite(maxAttr) && maxAttr > minAttr) {
                    return Math.max((maxAttr - minAttr) / 100, 0.0001);
                }

                const cur = getStoredNumericValue(el);
                return smartStep(cur);
            }

                const base = Number.isFinite(cur) ? cur : 0;
                const next = direction > 0 ? base + step : base - step;
                // Clamp to input min/max if defined
                const minAttr = parseFloat(el.getAttribute('min'));
                const maxAttr = parseFloat(el.getAttribute('max'));
                let clamped = next;
                if (Number.isFinite(minAttr) && clamped < minAttr) clamped = minAttr;
                if (Number.isFinite(maxAttr) && clamped > maxAttr) clamped = maxAttr;
                const decimals = Math.min(6, Math.max(countDecimals(step), countDecimals(cur)));

                undoHistogramHistory().catch((error) => console.warn('Undo failed', error));
            });
            redoButton?.addEventListener('click', () => {
                redoHistogramHistory().catch((error) => console.warn('Redo failed', error));
            });
            const swapAxesButton = document.getElementById('btn-swap-axes');
            if (swapAxesButton && !swapAxesButton.querySelector('svg')) {
                const icon = document.createElement('span');
                icon.className = 'hist-tool-btn-icon';
                icon.appendChild(buildToolbarSwapAxesIcon());
                swapAxesButton.appendChild(icon);
            }
            swapAxesButton?.addEventListener('click', async () => {
                await swapHistogramAxes(document.getElementById('histogram-plot'));
            });

            document.addEventListener('input', (event) => {
                const target = event.target;
                if (!target || HISTOGRAM_HISTORY_IS_APPLYING) return;
                if (target instanceof HTMLElement && (target.matches('input, textarea, select') || target.classList.contains('plot-text-inline-editor'))) {
                    scheduleHistogramHistoryCommit(320);
                }
            }, true);
            document.addEventListener('change', (event) => {
                const target = event.target;
                if (!target || HISTOGRAM_HISTORY_IS_APPLYING) return;
                if (target instanceof HTMLElement && target.matches('input, textarea, select')) {
                    scheduleHistogramHistoryCommit(180);
                }
            }, true);
            document.addEventListener('click', (event) => {
                const target = event.target instanceof Element ? event.target.closest('button, .modebar-btn') : null;
                if (!target || HISTOGRAM_HISTORY_IS_APPLYING) return;
                if (target.id === 'btn-undo' || target.id === 'btn-redo') return;
                scheduleHistogramHistoryCommit(260);
            }, true);

            summarizeSelection();
            if (plotlyReady) {
                await renderPlaceholder();
            }
            if (headers && headers.length) {
                await autoFillFeatureMinMax('x');
                await autoFillFeatureMinMax('y');
                await autoFillFeatureMinMax('f');
                syncFeatureRowVisibility();
            }
            initializeHistogramHistory();
        });
    </script>
</body>

</html>
